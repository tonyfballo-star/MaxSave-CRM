/* ===== SMOOTH DARK MODE TRANSITIONS ===== */

.tabs, .tab, .data-table th, .data-table td, .task-item, .fee-row,
.field-row, .stage-step, .status-row, .admin-nav-item, .lb-row,
.icon-btn, .tbl-icon-btn, .btn-ghost, .form-control, .filter-select,
.topbar-search, .topbar-title, .nav-item, .tag, .progress,
.mini-progress, .funnel-track, .empty-title, .card-title {
  transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.dark-toggle {
  width: 52px; height: 28px;
  border-radius: 100px;
  background: var(--gray-200);
  border: 1.5px solid var(--border-strong);
  cursor: pointer;
  position: relative;
  transition: background 0.25s ease, border-color 0.25s ease;
  flex-shrink: 0;
  display: flex; align-items: center; padding: 3px;
}
.dark-toggle.on { background: var(--navy-800); border-color: var(--navy-600); }
.dark-toggle-knob {
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.20);
  transition: transform 0.25s ease;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; line-height: 1; flex-shrink: 0;
}
.dark-toggle.on .dark-toggle-knob { transform: translateX(24px); background: var(--green-400); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg-page); color: var(--gray-800); font-size: 15px; line-height: 1.55; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; transition: background 0.25s ease, color 0.25s ease; }

.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar { width: 130px; background: linear-gradient(175deg, #0A1624 0%, #122B47 100%); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; position: relative; }
.sidebar::before { display: none; }
.sidebar-logo { padding: 18px 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--green-500) 0%, var(--green-700) 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 12px rgba(59,170,71,0.35), inset 0 1px 0 rgba(255,255,255,0.20); position: relative; overflow: hidden; }
.logo-mark::before { content: ''; position: absolute; top: -10px; left: -10px; width: 20px; height: 20px; background: rgba(255,255,255,0.18); border-radius: 50%; pointer-events: none; }
.logo-mark svg { position: relative; z-index: 1; }
.logo-text { display: flex; flex-direction: column; line-height: 1.05; }
.logo-name { font-family: var(--font-display); font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
.logo-name .accent { color: var(--green-400); }
.logo-tagline { font-size: 8.5px; font-weight: 600; color: rgba(255,255,255,0.40); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-nav::-webkit-scrollbar { display: none; }
.nav-section { margin-bottom: 2px; }
.nav-section-label { display: none; }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 10px 8px 9px; color: rgba(255,255,255,0.78); cursor: pointer; border: 1.5px solid transparent; border-radius: var(--radius-md); transition: all 0.15s ease; font-family: var(--font-body); font-size: 13px; font-weight: 500; position: relative; user-select: none; margin: 1px 8px; text-align: center; line-height: 1.25; }
.nav-item:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.96); }
.nav-item.active { background: rgba(22, 61, 107, 0.45); color: #fff; border-color: rgba(80, 148, 224, 0.55); font-weight: 600; }
.nav-item.active .nav-ic { opacity: 1; }
.nav-ic { width: 22px; height: 22px; opacity: 0.75; flex-shrink: 0; }
.nav-badge { display: none; }
.nav-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--green-400); box-shadow: 0 0 0 2px #0A1624; flex-shrink: 0; pointer-events: none; }
.nav-item.nav-logout { color: rgba(255,100,100,0.65); }
.nav-item.nav-logout:hover { background: rgba(239,68,68,0.10); color: rgba(255,120,120,0.95); }
.nav-item.nav-logout .nav-ic { opacity: 0.7; }

.sidebar-footer { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,0.07); }
.user-widget { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--radius-md); cursor: pointer; transition: background 0.15s; }
.user-widget:hover { background: rgba(255,255,255,0.06); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0; font-family: var(--font-display); }
.av-green { background: var(--green-600); }
.av-navy { background: var(--navy-600); }
.av-amber { background: #B45309; }
.av-teal { background: var(--teal); }
.av-purple { background: var(--purple); }
.av-red { background: #DC2626; }
.user-name { font-size: 14px; font-weight: 600; color: #fff; }
.user-role { font-size: 12px; color: rgba(255,255,255,0.38); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ===== NOTIFICATION BANNERS ===== */
.notif-banner { position:fixed; top:56px; left:138px; right:0; z-index:9900; display:flex; align-items:center; gap:16px; padding:13px 22px; box-shadow:0 6px 24px rgba(0,0,0,0.30); animation:notifSlideDown 0.32s cubic-bezier(0.34,1.56,0.64,1); font-family:var(--font-body); }
.notif-banner.new-lead-banner { background:linear-gradient(135deg,#1A5C22 0%,#2B8035 55%,#33953D 100%); color:#fff; }
.notif-banner.inbound-call-banner { background:linear-gradient(135deg,#0A1824 0%,#0E2340 60%,#122840 100%); color:#fff; }
.notif-divider { width:1px; height:42px; background:rgba(255,255,255,0.20); flex-shrink:0; }
.notif-chip { background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25); padding:5px 12px; border-radius:var(--radius-full); font-size:11.5px; font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.notif-chip:hover { background:rgba(255,255,255,0.25); }
.notif-chip.selected { background:rgba(255,255,255,0.35); border-color:rgba(255,255,255,0.70); font-weight:800; }
.notif-btn-white { background:#fff; border:none; padding:9px 16px; border-radius:var(--radius-md); font-family:var(--font-body); font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; }
.notif-btn-ghost { background:rgba(255,255,255,0.14); color:#fff; border:1px solid rgba(255,255,255,0.30); padding:9px 13px; border-radius:var(--radius-md); font-family:var(--font-body); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
.notif-btn-end { background:rgba(239,68,68,0.30); color:#fff; border:1px solid rgba(239,68,68,0.55); padding:9px 13px; border-radius:var(--radius-md); font-family:var(--font-body); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
@keyframes notifSlideDown { from { transform:translateY(-110%); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes notifPulse { 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }

.topbar { background: var(--white); border-bottom: 1px solid var(--border); height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; flex-shrink: 0; box-shadow: var(--shadow-sm); }
.topbar-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--navy-900); margin-right: auto; letter-spacing: -0.2px; }
.topbar-search { display: flex; align-items: center; gap: 8px; background: var(--gray-50); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 7px 13px; width: 250px; transition: all 0.15s; }
.topbar-search:focus-within { border-color: var(--green-500); background: var(--white); box-shadow: 0 0 0 3px var(--green-100); }

.btn { font-family: var(--font-body); font-size: 14px; font-weight: 500; padding: 7px 15px; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.btn-navy { background: var(--navy-900); color: #fff; }
.btn-navy:hover { background: var(--navy-800); }
.icon-btn { width: 34px; height: 34px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--gray-50); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; position: relative; }

.content { flex: 1; overflow-y: auto; padding: 22px 64px; scroll-behavior: smooth; }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }

.btn-group { display: flex; gap: 8px; }

.tabs { display: flex; gap: 2px; background: var(--gray-100); border-radius: var(--radius-lg); padding: 3px; width: fit-content; margin-bottom: 20px; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-grid-3 { grid-template-columns: repeat(3, 1fr); }
.kpi-grid-5 { grid-template-columns: repeat(5, 1fr); }
.kpi-card { background: var(--white); border-radius: var(--radius-lg); padding: 18px 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
.kpi-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.kpi-card.accent { border-left: 3.5px solid var(--green-500); }

.kpi-card.accent-red { border-left: 3.5px solid var(--red); }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
.kpi-value { font-family: var(--font-display); font-size: 28px; font-weight: 600; color: var(--navy-900); line-height: 1; letter-spacing: -0.5px; }

.kpi-value.red { color: var(--red); }

.mini-progress { background: var(--gray-100); border-radius: 100px; height: 5px; margin-top: 8px; overflow: hidden; }
.mini-progress-fill { height: 100%; border-radius: 100px; transition: width 0.6s ease; }

.card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }

.card-body { padding: 18px 20px; }
.card-link { font-size: 13px; font-weight: 600; color: var(--green-600); cursor: pointer; text-decoration: none; transition: color 0.15s; }
.card-link:hover { color: var(--green-700); }
.panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.panel-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; white-space: nowrap; }

.tier { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: var(--radius-full); font-size: 13px; font-weight: 700; letter-spacing: 0.2px; }
.tier-bronze { background: #FFF7ED; color: #92400E; border: 1px solid #FDE68A; }
.tier-silver { background: #F8FAFC; color: #475569; border: 1px solid #CBD5E1; }
.tier-gold { background: #FFFBEB; color: #92400E; border: 1px solid #FCD34D; }
.tier-platinum { background: #F5F3FF; color: #5B21B6; border: 1px solid #DDD6FE; }
.tier-elite { background: linear-gradient(135deg, #1C2B4B, #253659); color: #fff; border: none; box-shadow: 0 2px 8px rgba(26,43,75,0.25); }

.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; font-size: 12px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; padding: 11px 14px; border-bottom: 2px solid var(--border); white-space: nowrap; background: var(--gray-50); }
.data-table td { padding: 13px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; }

.table-actions { display: flex; gap: 5px; opacity: 0; transition: opacity 0.15s; }

.tbl-icon-btn { width: 27px; height: 27px; border-radius: var(--radius-sm); background: var(--gray-50); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; font-size: 12px; }

.progress { background: var(--gray-100); border-radius: 100px; overflow: hidden; }

.pb-green { background: linear-gradient(90deg, var(--green-500), var(--green-400)); }
.pb-amber { background: linear-gradient(90deg, var(--amber), #FCD34D); }
.pb-red { background: linear-gradient(90deg, var(--red), #F87171); }
.pb-navy { background: linear-gradient(90deg, var(--navy-700), var(--navy-500)); }

.funnel { display: flex; flex-direction: column; gap: 6px; }
.funnel-row { display: flex; align-items: center; gap: 10px; }
.funnel-label { width: 96px; font-size: 13px; color: var(--gray-500); text-align: right; flex-shrink: 0; }
.funnel-track { flex: 1; background: var(--gray-100); border-radius: 5px; height: 24px; overflow: hidden; }
.funnel-fill { height: 100%; border-radius: 5px; display: flex; align-items: center; padding-left: 10px; font-size: 12.5px; font-weight: 700; color: #fff; min-width: 28px; transition: width 0.5s ease; }

.lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.lb-row:last-child { border-bottom: none; }
.lb-rank { width: 22px; font-size: 14.5px; font-weight: 800; text-align: center; font-family: var(--font-display); }
.lb-rank.r1 { color: #D4A017; } .lb-rank.r2 { color: #94A3B8; } .lb-rank.r3 { color: #CD7F32; } .lb-rank.rn { color: var(--gray-400); }
.lb-name { flex: 1; font-size: 14.5px; font-weight: 500; }
.lb-val { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--navy-900); }
.lb-sub { font-size: 12px; color: var(--gray-400); }

.alert { display: flex; align-items: flex-start; gap: 10px; padding: 10px 13px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 7px; border: 1px solid; }
.alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.alert-red { background: var(--red-light); border-color: #FCA5A5; color: #991B1B; }
.alert-amber { background: var(--amber-light); border-color: #FCD34D; color: #92400E; }
.alert-blue { background: var(--blue-light); border-color: #A8BFD4; color: #0C1D33; }
.alert-green { background: var(--green-50); border-color: var(--green-200); color: var(--green-800); }

.bar-chart { display: flex; align-items: flex-end; gap: 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.bar-fill { border-radius: 5px 5px 0 0; width: 100%; min-height: 4px; transition: height 0.4s ease; }
.bar-val { font-size: 10.5px; font-weight: 700; color: var(--navy-800); }
.bar-lbl { font-size: 10px; color: var(--gray-400); }

.tl-item { display: flex; gap: 12px; margin-bottom: 16px; }
.tl-icon { width: 33px; height: 33px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; border: 2px solid; }
.tl-call { background: var(--green-50); border-color: var(--green-200); }
.tl-note { background: var(--blue-light); border-color: #A8BFD4; }
.tl-status { background: var(--amber-light); border-color: #FCD34D; }
.tl-email { background: var(--purple-light); border-color: #DDD6FE; }
.tl-sys { background: var(--gray-100); border-color: var(--gray-200); }
.tl-body { flex: 1; }
.tl-title { font-size: 14px; font-weight: 600; color: var(--navy-800); }
.tl-meta { font-size: 12px; color: var(--gray-400); margin-top: 1px; }
.tl-text { font-size: 13.5px; color: var(--gray-600); margin-top: 4px; line-height: 1.5; }

.field-row { display: flex; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border); }
.field-row:last-child { border-bottom: none; }
.field-key { width: 140px; font-size: 12.5px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0; padding-top: 1px; }
.field-val { font-size: 14px; color: var(--navy-800); flex: 1; }
.field-val.link { color: var(--blue); cursor: pointer; }
.field-val.money { font-weight: 700; color: var(--navy-900); }
.field-val.warn { color: #B45309; font-weight: 600; }
.field-val.danger { color: var(--red); font-weight: 600; }

.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--navy-50); color: var(--navy-700); border: 1px solid var(--navy-100); padding: 3px 9px; border-radius: var(--radius-full); font-size: 11px; font-weight: 500; margin: 2px; }
.tag-x { cursor: pointer; color: var(--gray-400); font-size: 10px; margin-left: 2px; }
.tag-x:hover { color: var(--red); }

.stage-step { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: var(--radius-md); margin-bottom: 4px; transition: all 0.15s; }
.stage-step.done { background: var(--green-50); }
.stage-step.current { background: var(--navy-50); border: 1px solid var(--navy-200); }
.stage-step.future { opacity: 0.45; }
.stage-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.stage-label { font-size: 12.5px; font-weight: 500; }

.ld-layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; }
.donut-wrap { display: flex; align-items: center; gap: 20px; }
.donut-stat { font-family: var(--font-display); font-size: 34px; font-weight: 800; color: var(--navy-900); }
.donut-sub { font-size: 12px; color: var(--gray-500); margin-top: 3px; }

.admin-layout { display: grid; grid-template-columns: 210px 1fr; gap: 16px; align-items: start; }
.admin-nav-item { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 500; color: var(--gray-600); cursor: pointer; transition: all 0.15s; margin-bottom: 2px; }
.admin-nav-item:hover { background: var(--gray-50); color: var(--navy-900); }
.admin-nav-item.active { background: var(--navy-50); color: var(--navy-900); font-weight: 600; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 10.5px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; }
.form-control { padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 12.5px; color: var(--navy-900); outline: none; background: var(--white); transition: border-color 0.15s, box-shadow 0.15s; }
.form-control:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
select.form-control { cursor: pointer; }

.filter-bar { background: linear-gradient(175deg, #0A1624 0%, #122B47 100%); border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius-lg); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(10,22,36,0.35); }
.filter-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.5px; }
.filter-bar .filter-select, .filter-bar input.filter-select { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 12px; color: #fff; background: rgba(255,255,255,0.08); outline: none; cursor: pointer; }
.filter-bar .filter-select:focus, .filter-bar input.filter-select:focus { border-color: var(--green-500); background: rgba(255,255,255,0.12); }
.filter-bar .filter-select option { background: #122B47; color: #fff; }
.filter-bar span[style*="var(--gray-400)"] { color: rgba(255,255,255,0.35) !important; }
.filter-select { padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 12px; color: var(--navy-800); background: var(--gray-50); outline: none; cursor: pointer; }
.filter-select:focus { border-color: var(--green-500); }

.status-row { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--radius-md); font-size: 12px; background: var(--gray-50); border: 1px solid var(--border); margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
.status-row:hover { background: var(--white); border-color: var(--border-strong); }
.status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.status-drag { color: var(--gray-300); font-size: 11px; margin-left: auto; cursor: grab; }
.status-edit { opacity: 0; font-size: 11px; color: var(--green-600); cursor: pointer; }
.status-row:hover .status-edit { opacity: 1; }

.goal-card { background: var(--white); border-radius: var(--radius-lg); padding: 18px 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.goal-pct { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px; }

.fee-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.fee-row:last-child { border-bottom: none; }
.fee-label { flex: 1; font-size: 12.5px; font-weight: 500; }
.fee-val { font-family: var(--font-display); font-size: 14px; font-weight: 700; }

.task-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 7px; transition: all 0.15s; }
.task-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.task-item.overdue { background: var(--red-light); border-color: #FCA5A5; }
.task-cb { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--gray-300); flex-shrink: 0; cursor: pointer; }
.task-label { font-size: 12.5px; font-weight: 500; flex: 1; }
.task-time { font-size: 11px; color: var(--gray-400); }
.pri-badge { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: var(--radius-full); letter-spacing: 0.3px; }
.pri-high { background: var(--red-light); color: var(--red); }
.pri-med { background: var(--amber-light); color: #B45309; }
.pri-low { background: var(--gray-100); color: var(--gray-500); }

.rpt-bar-wrap { display: flex; align-items: flex-end; gap: 8px; height: 150px; margin: 14px 0 8px; }

@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.page-content { animation: fadeSlideIn 0.2s ease both; }

.sidebar-accent { display: none; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

.empty { text-align: center; padding: 48px 24px; }
.empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--navy-800); margin-bottom: 6px; }
.empty-sub { font-size: 12.5px; color: var(--gray-500); margin-bottom: 16px; }

.fin-row { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
.fin-row:last-child { border-bottom: none; }

/* Board cards in dark mode */
body.dark-mode .board-card { background: #2A2A2A; border-color: rgba(255,255,255,0.09); }

/* Unread text badge on lead profile Text button */
.text-btn-wrap { position: relative; }
.text-unread-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  background: var(--red);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  border-radius: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--white);
  box-shadow: 0 2px 8px rgba(239,68,68,0.40);
  animation: pulseBadge 1.6s ease-in-out infinite;
  z-index: 2;
}
@keyframes pulseBadge {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}
body.dark-mode .text-unread-badge { border-color: #2A2A2A; }

/* Larger leads table */
.leads-table th { font-size: 12px !important; padding: 13px 16px !important; letter-spacing: 0.7px; }
.leads-table td { padding: 14px 16px !important; }
.leads-table .lead-name-link:hover { color: var(--green-600) !important; text-decoration: underline; }

/* Logout confirm modal */
.logout-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9999; display: flex; align-items: center; justify-content: center; animation: fadeSlideIn 0.15s ease both; }
.logout-modal { background: var(--white); border-radius: var(--radius-xl); padding: 28px 32px; width: 340px; box-shadow: var(--shadow-lg); text-align: center; }
.logout-modal h2 { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--navy-900); margin-bottom: 8px; }
.logout-modal p { font-size: 13px; color: var(--gray-500); margin-bottom: 22px; line-height: 1.5; }
.logout-modal-btns { display: flex; gap: 10px; justify-content: center; }
body.dark-mode .logout-modal { background: #2A2A2A; }
body.dark-mode .logout-modal h2 { color: #C8C8C8; }
</style>

window._notifTimers = {};

function showNewLeadAlert(lead) {

    '<div style="font-size:26px;flex-shrink:0;animation:notifPulse 1.4s infinite">🟢</div>' +
    '<div style="flex-shrink:0">' +
      '<div style="font-size:9.5px;font-weight:800;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">New Lead Incoming</div>' +
      '<div style="font-size:18px;font-weight:800;font-family:var(--font-display);line-height:1.1">' + lead.name + '</div>' +
    '</div>' +
    '<div class="notif-divider"></div>' +
    '<div style="display:flex;gap:20px;flex-wrap:wrap;flex:1">' +
      '<div><div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Phone</div><div style="font-size:14px;font-weight:700">' + lead.phone + '</div></div>' +
      '<div><div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Source</div><div style="font-size:14px;font-weight:700">' + lead.source + '</div></div>' +
      '<div><div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Coverage</div><div style="font-size:14px;font-weight:700">' + lead.coverage + '</div></div>' +
      '<div><div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Lead Type</div><div style="font-size:14px;font-weight:700">' + lead.type + '</div></div>' +
      '<div><div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Assigned</div><div style="font-size:14px;font-weight:700">' + lead.agent + '</div></div>' +
      '<div><div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Received</div><div style="font-size:14px;font-weight:700">' + lead.received + '</div></div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-shrink:0;align-items:center">' +
      '<button class="notif-btn-white" style="color:#1A5C22" onclick="nav(\'leads\',null);dismissBanner(\'newlead\')">View Lead →</button>' +
      '<button class="notif-btn-ghost" onclick="dismissBanner(\'newlead\')">Dismiss</button>' +
    '</div>';
  document.body.appendChild(el);
  window._notifTimers['newlead'] = setTimeout(function() { dismissBanner('newlead'); }, 30000);
}

function showInboundCallAlert(call) {
  call = call || { name:'Maria Gonzalez', phone:'(619) 555-0124', isCustomer:true };
  clearBanner('inbound');
  const el = document.createElement('div');
  el.id = 'inboundCallBanner';
  el.className = 'notif-banner inbound-call-banner';
  let secs = 0;
  const timerRef = { interval: null };
  const statusBadge = call.isCustomer
    ? '<span style="background:rgba(59,170,71,0.28);color:#fff;border:1px solid rgba(255,255,255,0.30);padding:3px 11px;border-radius:var(--radius-full);font-size:12px;font-weight:700">✓ Existing Customer</span>'
    : '<span style="background:rgba(245,158,11,0.28);color:#fff;border:1px solid rgba(255,255,255,0.30);padding:3px 11px;border-radius:var(--radius-full);font-size:12px;font-weight:700">⊕ New Caller</span>';
  const disps = ['Customer Service','EQ LIVE','PRIORITY','Ready to Buy','Rewrite'];
  el.innerHTML =
    '<div style="font-size:26px;flex-shrink:0;animation:notifPulse 0.9s infinite">📞</div>' +
    '<div style="flex-shrink:0">' +
      '<div style="font-size:9.5px;font-weight:800;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Inbound Call</div>' +
      '<div style="font-size:18px;font-weight:800;font-family:var(--font-display);line-height:1.1">' + call.name + '</div>' +
      '<div style="font-size:12.5px;color:rgba(255,255,255,0.70);margin-top:2px">' + call.phone + ' &nbsp;·&nbsp; <span id="inboundCallTimer">0:00</span></div>' +
    '</div>' +
    '<div class="notif-divider"></div>' +
    '<div style="flex-shrink:0">' +
      '<div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">Status</div>' +
      statusBadge +
    '</div>' +
    '<div class="notif-divider"></div>' +
    '<div style="flex:1">' +
      '<div style="font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.52);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Disposition</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        disps.map(function(d){ return '<button class="notif-chip" onclick="selectInboundDisp(this)">' + d + '</button>'; }).join('') +
      '</div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-shrink:0;align-items:center">' +
      '<button class="notif-btn-white" style="color:#0E2340" onclick="nav(\'customers\',null);dismissBanner(\'inbound\')">View Profile →</button>' +
      '<button class="notif-btn-end" onclick="dismissBanner(\'inbound\')">End Call</button>' +
    '</div>';
  document.body.appendChild(el);
  timerRef.interval = setInterval(function() {
    secs++;
    const m = Math.floor(secs/60), s = secs % 60;
    const t = document.getElementById('inboundCallTimer');
    if (t) t.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    else clearInterval(timerRef.interval);
  }, 1000);
  window._notifTimers['inbound_interval'] = timerRef.interval;
}

function selectInboundDisp(btn) {
  const container = btn.parentNode;
  if (!container) return;
  container.querySelectorAll('.notif-chip').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
}

function dismissBanner(id) {
  const elId = id === 'newlead' ? 'newLeadBanner' : 'inboundCallBanner';
  const el = document.getElementById(elId);
  if (el) {
    el.style.transition = 'opacity 0.28s ease, transform 0.28s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-110%)';
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  if (window._notifTimers[id]) clearTimeout(window._notifTimers[id]);
  if (id === 'inbound' && window._notifTimers['inbound_interval']) clearInterval(window._notifTimers['inbound_interval']);
}

function clearBanner(id) {
  const elId = id === 'newlead' ? 'newLeadBanner' : 'inboundCallBanner';
  const el = document.getElementById(elId);
  if (el && el.parentNode) el.parentNode.removeChild(el);
  if (window._notifTimers[id]) clearTimeout(window._notifTimers[id]);
  if (id === 'inbound' && window._notifTimers['inbound_interval']) clearInterval(window._notifTimers['inbound_interval']);
}

// ===== NAVIGATION =====
function nav(page, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const titles = {
    dashboard:'Dashboard', leads:'Leads', leaddetail:'Lead Detail — Maria Gonzalez',
    customers:'Customers', customerdetail:'Customer Profile', calendar:'Calendar', liveview:'Live View', inbox:'Inbox — Calls · Texts · Emails',
    agents:'Agent Management', reports:'Reports & Analytics', goals:'Goals & Tiers',
    finance:'Finance & Broker Fees', tasks:'Tasks & Follow-Ups',
    esignatures:'E Signatures', payment:'Payment Terminal', reputation:'Reputation Manager',
    agency:'My Agency', admin:'Settings'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  document.getElementById('content').innerHTML = '';
  setTimeout(() => {
    const div = document.createElement('div');
    div.className = 'page-content';
    div.innerHTML = PAGES[page] || '<div class="empty"><div class="empty-icon">🧱</div><div class="empty-title">Coming Soon</div><div class="empty-sub">This section is under development.</div></div>';
    document.getElementById('content').appendChild(div);
    if (window.PAGE_INIT && window.PAGE_INIT[page]) window.PAGE_INIT[page]();
  }, 10);
}

// ===== LOGOUT =====
window.CLOCK_STATE = { clocked: false, clockInTime: null };
function handleClockIn() {
  if (window.CLOCK_STATE.clocked) { alert('Already clocked in at ' + window.CLOCK_STATE.clockInTime); return; }
  const now = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  window.CLOCK_STATE.clocked = true;
  window.CLOCK_STATE.clockInTime = now;
  const btn = document.getElementById('clockInBtn');
  if (btn) { btn.innerHTML = '✓ Clocked in'; btn.style.background = '#0E4D20'; btn.style.opacity = '0.75'; btn.style.cursor = 'default'; }
  const status = document.getElementById('dashClockStatus');
  const time = document.getElementById('dashClockTime');
  if (status) status.innerHTML = '<span style="color:rgba(255,255,255,0.90)">Clocked In</span>';
  if (time) time.textContent = now;
  const out = document.getElementById('clockOutBtn');
  if (out) { out.style.borderColor = 'rgba(255,255,255,0.40)'; out.style.color = 'rgba(255,255,255,0.90)'; }
}
function handleClockOut() {
  if (!window.CLOCK_STATE.clocked) { alert('You are not clocked in.'); return; }
  const now = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  window.CLOCK_STATE.clocked = false;
  window.CLOCK_STATE.clockInTime = null;
  const out = document.getElementById('clockOutBtn');
  if (out) { out.innerHTML = '✓ Clocked out'; out.style.background = 'rgba(22,61,107,0.30)'; out.style.borderColor = 'rgba(22,61,107,0.60)'; out.style.color = 'rgba(255,255,255,0.55)'; out.style.cursor = 'default'; }
  const status = document.getElementById('dashClockStatus');
  const time = document.getElementById('dashClockTime');
  if (status) status.innerHTML = 'Not clocked in';
  if (time) time.textContent = 'Out at ' + now;
  const inBtn = document.getElementById('clockInBtn');
  if (inBtn) { inBtn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v3.5l2.5 1.5" stroke-linecap="round"/></svg>Clock In'; inBtn.style.background = '#1A6ED0'; inBtn.style.opacity = '1'; inBtn.style.cursor = 'pointer'; }
}
function showLogout() {
  document.getElementById('logoutOverlay').style.display = 'flex';
}
function hideLogout(e) {
  if (!e || e.target === document.getElementById('logoutOverlay')) {
    document.getElementById('logoutOverlay').style.display = 'none';
  }
}
function confirmLogout() {
  document.getElementById('logoutOverlay').style.display = 'none';
  document.getElementById('content').innerHTML = '';
  document.getElementById('page-title').textContent = 'Logged Out';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('content').innerHTML = `
    <div class="empty" style="margin-top:80px">
      <div class="empty-icon">🔒</div>
      <div class="empty-title">You've been logged out</div>
      <div class="empty-sub">Close this tab or click below to log back in.</div>
      <button class="btn btn-primary" onclick="location.reload()">Log Back In</button>
    </div>`;
}

function loadConversation(name, phone) {

    let todayBucket = window.CONVERSATIONS[phone].find(d => d.date === 'Today');
    if (!todayBucket) { todayBucket = { date:'Today', msgs:[] }; window.CONVERSATIONS[phone].push(todayBucket); }
    todayBucket.msgs.push({ from:'us', time, author:'Sarah Kim', text });

  let attachHTML = '';

    attachHTML = window.THREAD_ATTACHMENTS.map(f =>
      `<div class="text-bubble us" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.20);border:1px solid rgba(255,255,255,0.30)"><span style="font-size:18px">${fileIcon(f.name)}</span><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div><div style="font-size:10.5px;opacity:0.85">${fileSize(f.size)}</div></div></div>`
    ).join('');
  }
  const textHTML = text ? `<div class="text-bubble us">${text.replace(/</g,'&lt;')}</div>` : '';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end;gap:4px';
  wrap.innerHTML = attachHTML + textHTML + `<div class="text-bubble-time us">${time} · You</div>`;
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;

  input.value = '';
  window.THREAD_ATTACHMENTS = [];
  renderThreadAttachments();
  input.focus();
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓';
    btn.style.color = 'var(--green-400)';
    btn.style.borderColor = 'var(--green-500)';
    setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 1600);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const orig = btn.innerHTML;
    btn.innerHTML = '✓';
    setTimeout(() => { btn.innerHTML = orig; }, 1600);
  });
}

// ===== FILE HANDLERS =====
function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp','heic'].includes(ext)) return '🖼️';
  if (['pdf'].includes(ext)) return '📄';
  if (['doc','docx'].includes(ext)) return '📝';
  if (['xls','xlsx','csv'].includes(ext)) return '📊';
  return '📎';
}
function fileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function launchConfetti(duration) {
  duration = duration || 3500;
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#3BAA47','#52BE5E','#1C2B4B','#F59E0B','#EF4444','#3B82F6','#8B5CF6','#FFFFFF'];
  const pieces = [];
  for (let i = 0; i < 220; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.4,
      w: 6 + Math.random() * 8,
      h: 10 + Math.random() * 14,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: -2 + Math.random() * 4,
      vy: 2 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      vr: -0.2 + Math.random() * 0.4,
      shape: Math.random() < 0.5 ? 'rect' : 'circle'
    });
  }
  const start = Date.now();
  function frame() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.w/2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
    if (Date.now() - start < duration) {
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.style.display = 'none';
    }
  }
  frame();
}

// Shared SVG ring helper for KPI cards
function ring(pctVal, size, stroke, color) {
  size = size || 56; stroke = stroke || 7; color = color || 'var(--green-500)';
  const r = (size-stroke)/2; const c = 2*Math.PI*r;
  const fill = Math.min(pctVal/100,1)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gray-100)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${fill} ${c}" stroke-dashoffset="${c*0.25}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+4}" text-anchor="middle" font-family="Sora" font-weight="800" font-size="${size>80?'16':'12'}" fill="var(--navy-900)">${Math.round(pctVal)}%</text>
  </svg>`;
}

function closeTaskModal() {
  const el = document.getElementById('taskModalOverlay');

function submitTaskModal() {
  const label    = document.getElementById('tm_label').value.trim();
  const icon     = document.getElementById('tm_type').value;
  const priority = document.getElementById('tm_priority').value;
  const dueDate  = document.getElementById('tm_date').value;
  const rawTime  = document.getElementById('tm_time').value;
  const assignTo = document.getElementById('tm_assign').value;
  const related  = document.getElementById('tm_related').value.trim();
  const notes    = document.getElementById('tm_notes').value.trim();
  const errEl    = document.getElementById('tm_error');
  if (!label) { errEl.textContent='Task description is required.'; errEl.style.display='block'; return; }
  if (!dueDate) { errEl.textContent='Due date is required.'; errEl.style.display='block'; return; }
  // Format time for display
  let dueTime = '';
  if (rawTime) {
    const [h,m] = rawTime.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    dueTime = ((h%12)||12) + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  // Shorten assignedTo for display (strip "(Tony Ballo)" part)
  const assignLabel = assignTo.startsWith('Admin') ? 'Admin' : assignTo;
  const task = { id: window._nextTaskId++, icon, label: label + (related?' — '+related:''), dueDate, dueTime, priority, assignedTo: assignLabel, notes, done: false };
  window.TASKS_DATA.push(task);
  closeTaskModal();
  // Refresh visible panels
  if (document.getElementById('focusTasks'))    renderFocusTasks();
  if (document.getElementById('tasksPageWrap')) refreshTasksPage();
}

// State for filters/pagination/view
window.LEADS_STATE = { view:'table', page: 1, perPage: 50, statusFilter:'All', agentFilter:'All', sourceFilter:'All', dispositionFilter:'All', dateFrom:'', dateTo:'', search:'' };

function renderLeadsPage(){
  const s = window.LEADS_STATE;
  let filtered = LEADS.slice();
  // In table view we hide Sold leads (per spec). Board view shows everything.
  if (s.view === 'table') filtered = filtered.filter(l => l.status !== 'Sold');
  if (s.statusFilter !== 'All') filtered = filtered.filter(l => l.status === s.statusFilter);
  if (s.agentFilter  !== 'All') filtered = filtered.filter(l => l.agent  === s.agentFilter);
  if (s.sourceFilter !== 'All') filtered = filtered.filter(l => l.source === s.sourceFilter);
  if (s.dispositionFilter !== 'All') filtered = filtered.filter(l => (l.disposition || 'None') === s.dispositionFilter);
  if (s.dateFrom) filtered = filtered.filter(l => l.received >= s.dateFrom);
  if (s.dateTo)   filtered = filtered.filter(l => l.received <= s.dateTo);
  if (s.search)   { const q = s.search.toLowerCase(); filtered = filtered.filter(l => l.name.toLowerCase().includes(q) || l.phone.includes(q)); }

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / s.perPage));
  if (s.page > totalPages) s.page = totalPages;
  const start = (s.page - 1) * s.perPage;
  const pageLeads = filtered.slice(start, start + s.perPage);

  const statuses = s.view === 'board'
    ? ['All','New Lead','Contacted','Quoted','Sold','Appointment Set','Bad Lead']
    : ['All','New Lead','Contacted','Quoted','Appointment Set','Bad Lead'];
  const agents = ['All', ...AGENTS.map(a=>a.name), 'Unassigned'];
  const sources = ['All','Everquote','Facebook Ads','Google Ads','Referral','Direct Call','Cold Call'];
  const dispositions = ['All','None','Quoted','Bad Lead','Do Not Call','Refund','HR','Already Sold','Spanish','Rewrite','Cancelled','Follow Up'];

  // selected count for bulk-action buttons
  const selectedCount = (window.LEADS_SELECTED || new Set()).size;

  const baseLeadsHTML = `

        <p>${total} matching leads · Showing page ${s.page} of ${totalPages}${selectedCount?` · <strong style="color:var(--green-700)">${selectedCount} selected</strong>`:''}</p>
      </div>

        <span style="font-size:11.5px;font-weight:700;color:var(--green-700);background:var(--green-50);padding:5px 10px;border-radius:var(--radius-full);border:1px solid var(--green-200)">${selectedCount} selected</span>
        <button type="button" class="btn" style="background:var(--blue);color:#fff;font-size:13px;padding:7px 16px;font-weight:600;cursor:pointer" onclick="openBulkText()">💬 Bulk Text</button>

        <button type="button" class="btn btn-ghost" style="font-size:12px;cursor:pointer" onclick="clearSelection()">Clear</button>

    </div>

    </div>
  </div>

  <div class="filter-bar">

    <select class="filter-select" onchange="window.LEADS_STATE.sourceFilter=this.value;window.LEADS_STATE.page=1;refreshLeads()">

    <input type="date" class="filter-select" value="${s.dateTo}" onchange="window.LEADS_STATE.dateTo=this.value;window.LEADS_STATE.page=1;refreshLeads()" style="font-family:var(--font-body)">

// ===== BOARD DRAG & DROP =====
window._dragPhone = null;

function onCardDragStart(ev, phone) {
  window._dragPhone = phone;
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', phone); } catch(_) {}
  ev.currentTarget.style.opacity = '0.4';
  ev.currentTarget.style.cursor = 'grabbing';
}
function onCardDragEnd(ev) {
  ev.currentTarget.style.opacity = '';
  ev.currentTarget.style.cursor = 'grab';
  // Reset any column highlights
  document.querySelectorAll('.board-col').forEach(c => {
    c.style.background = 'var(--gray-50)';
    c.style.borderColor = 'var(--border)';
  });
  window._dragPhone = null;
}
function onColDragOver(ev) {
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  const col = ev.currentTarget;
  col.style.background = 'var(--green-50)';
  col.style.borderColor = 'var(--green-500)';
}
function onColDragLeave(ev) {
  // Only reset when truly leaving the column (not entering a child)
  const col = ev.currentTarget;
  if (!col.contains(ev.relatedTarget)) {
    col.style.background = 'var(--gray-50)';
    col.style.borderColor = 'var(--border)';
  }
}
function onColDrop(ev, newStatus) {
  ev.preventDefault();
  const phone = window._dragPhone || (ev.dataTransfer && ev.dataTransfer.getData('text/plain'));
  if (!phone) return;
  const lead = LEADS.find(l => l.phone === phone);
  if (lead) lead.status = newStatus;
  window._dragPhone = null;
  refreshLeads();
}

function openBulkText() {
  ensureBulkTextModalExists();
  // Combine selections: leads (LEADS_SELECTED) + customers (CUSTOMERS_SELECTED)
  if (!window.LEADS_SELECTED) window.LEADS_SELECTED = new Set();
  if (!window.CUSTOMERS_SELECTED) window.CUSTOMERS_SELECTED = new Set();
  const count = window.LEADS_SELECTED.size + window.CUSTOMERS_SELECTED.size;
  if (count === 0) { alert('Select at least one lead or customer first.'); return; }
  // Defensive: each setter only runs if the element actually exists
  const set = function(id, prop, val) { const el = document.getElementById(id); if (el) el[prop] = val; };
  set('bulkTextCount','textContent',count);
  set('bulkTextMessage','value','');
  const preview = document.getElementById('bulkTextPreview'); if (preview) preview.style.display = 'none';
  const schRow  = document.getElementById('bulkScheduleRow'); if (schRow)  schRow.style.display = 'none';
  const schTog  = document.getElementById('bulkScheduleToggle'); if (schTog) schTog.checked = false;
  loadTemplatesIntoDropdown();
  updateBulkTextStats();
  const overlay = document.getElementById('bulkTextOverlay');
  if (overlay) overlay.style.display = 'flex';
  else alert('Bulk Text modal element missing. Reload the page.');
}
function closeBulkText() {
  const overlay = document.getElementById('bulkTextOverlay');
  if (overlay) overlay.style.display = 'none';
}
function applyBulkTextTemplateById(id) {
  if (!id) return;
  const t = (window.TEMPLATES || []).find(function(x){ return x.id === parseInt(id); });
  if (t) {
    const ta = document.getElementById('bulkTextMessage');
    if (ta) ta.value = t.text;
    updateBulkTextStats();
  }
}
function applyBulkTextTemplate(text) {
  const ta = document.getElementById('bulkTextMessage');
  if (ta) { ta.value = text; updateBulkTextStats(); }
}
function insertToken(token) {
  const ta = document.getElementById('bulkTextMessage');
  if (!ta) return;
  const start = ta.selectionStart || 0, end = ta.selectionEnd || 0;
  ta.value = ta.value.substring(0,start) + token + ta.value.substring(end);
  ta.focus();
  try { ta.selectionStart = ta.selectionEnd = start + token.length; } catch(e){}
  updateBulkTextStats();
}
function updateBulkTextStats() {
  const ta = document.getElementById('bulkTextMessage');
  const c  = document.getElementById('bulkTextChars');
  const s  = document.getElementById('bulkTextSegs');
  if (!ta || !c || !s) return;
  const len = ta.value.length;
  c.textContent = len;
  s.textContent = len === 0 ? 0 : Math.ceil(len/160);
}
function togglePreview() {
  const preview = document.getElementById('bulkTextPreview');
  const content = document.getElementById('bulkTextPreviewContent');
  const ta      = document.getElementById('bulkTextMessage');
  if (!preview || !content || !ta) return;
  const isOpen = preview.style.display === 'block';
  if (isOpen) { preview.style.display = 'none'; return; }
  let msg = ta.value || '(empty message)';
  let lead = { name:'Maria Gonzalez', phone:'(619) 555-0124', agent:'Sarah Kim', policy:'Auto' };
  try {
    const firstPhone = Array.from(window.LEADS_SELECTED || [])[0];
    const found = (typeof LEADS !== 'undefined') ? LEADS.find(function(l){ return l.phone === firstPhone; }) : null;
    if (found) lead = found;
  } catch(e) {}
  const firstName = (lead.name||'').split(' ')[0];
  msg = msg
    .replace(/\{\{name\}\}/g,  firstName)
    .replace(/\{\{phone\}\}/g, lead.phone || '')
    .replace(/\{\{agent\}\}/g, lead.agent || 'Sarah Kim')
    .replace(/\{\{policy\}\}/g, lead.policy || 'Auto');
  const optOut = document.getElementById('bulkOptOutFooter');
  if (optOut && optOut.checked) msg += '\n\nReply STOP to opt out.';
  content.textContent = msg;
  preview.style.display = 'block';
}
function sendBulkText() {
  const ta = document.getElementById('bulkTextMessage');
  const msg = (ta ? ta.value : '').trim();
  if (!msg) { alert('Type a message before sending.'); return; }
  const leadCount = (window.LEADS_SELECTED || new Set()).size;
  const custCount = (window.CUSTOMERS_SELECTED || new Set()).size;
  const count = leadCount + custCount;
  const schTog = document.getElementById('bulkScheduleToggle');
  const scheduled = schTog && schTog.checked;
  const dateEl = document.getElementById('bulkScheduleDate');
  const timeEl = document.getElementById('bulkScheduleTime');
  const date = dateEl ? dateEl.value : '';
  const time = timeEl ? timeEl.value : '';
  closeBulkText();
  setTimeout(function(){
    if (scheduled && date && time) {
      alert('📅 Scheduled — ' + count + ' text' + (count===1?'':'s') + ' will send on ' + date + ' at ' + time + '.');
    } else {
      alert('✅ Bulk text sent to ' + count + ' recipient' + (count===1?'':'s') + '.');
    }
    if (leadCount > 0 && typeof clearSelection === 'function') clearSelection();
    if (custCount > 0 && typeof clearCustomerSelection === 'function') clearCustomerSelection();
  }, 150);
}

function saveTemplateRow(id, btn) {
  const row = btn.closest('[data-tid]');
  const next = {};
  row.querySelectorAll('[data-field]').forEach(el => next[el.dataset.field] = el.value);
  const t = window.TEMPLATES.find(x => x.id === id);
  if (t) Object.assign(t, next);
  const original = btn.textContent;
  btn.textContent = '✓ Saved';
  btn.style.background = 'var(--green-700)';
  setTimeout(() => { btn.textContent = 'Save'; btn.style.background = 'var(--green-500)'; }, 1200);
}
function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  window.TEMPLATES = window.TEMPLATES.filter(t => t.id !== id);
  renderTemplateEditor();
}

function startPowerDial() {
  if (!window.LEADS_SELECTED) window.LEADS_SELECTED = new Set();
  if (!window.CUSTOMERS_SELECTED) window.CUSTOMERS_SELECTED = new Set();
  const leadCount = window.LEADS_SELECTED.size;
  const custCount = window.CUSTOMERS_SELECTED.size;
  const count = leadCount + custCount;
  if (count === 0) { alert('Select at least one lead or customer first.'); return; }
  if (confirm('🚀 Start Power Dial session for ' + count + ' contact' + (count===1?'':'s') + '?\n\nThe dialer will call them back-to-back, hanging up dead numbers automatically.')) {
    alert('📞 Power Dial session started — calling 1 of ' + count + '…');
    if (leadCount > 0) clearSelection();
    if (custCount > 0) clearCustomerSelection();
  }
}

// ==================== ACTIVITY LOG ====================
const _actLogHTML = (function(){
  // Sample daily activity numbers — would come from DYL/dialer in production
  const totalLeadsToday = 100;
  const inboundsToday   = 38;
  const outboundCalls   = 67;
  const textsSent       = 84;
  const inboundsAnswered = 24;
  const meetingsBooked  = 6;
  const dispositions    = 41;

  const outboundCoveragePct = totalLeadsToday > 0 ? Math.round(outboundCalls / totalLeadsToday * 100) : 0;
  const inboundAnswerPct    = inboundsToday   > 0 ? Math.round(inboundsAnswered / inboundsToday   * 100) : 0;
  const textCoveragePct     = totalLeadsToday > 0 ? Math.round(textsSent / totalLeadsToday * 100)  : 0;

  const today = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const barColor = pct => pct >= 75 ? 'pb-green' : pct >= 50 ? 'pb-amber' : 'pb-red';
  const txtColor = pct => pct >= 75 ? 'var(--green-700)' : pct >= 50 ? '#B45309' : 'var(--red)';

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <span style="font-size:14px;color:var(--gray-500)">${today} · Sarah Kim · Real-time dialer + texting activity</span>
    <div class="btn-group">
      <select class="form-control" style="font-size:13px;width:auto">
        <option>Today</option><option>Yesterday</option><option>This Week</option><option>This Month</option>
      </select>
      <select class="form-control" style="font-size:13px;width:auto">
        <option>My Activity</option>${AGENTS.map(a=>`<option>${a.name}</option>`).join('')}
      </select>
      <button class="btn btn-ghost">⬇ Export</button>
    </div>
  </div>

  <!-- TOP-LINE METRIC ROW -->
  <div class="kpi-grid kpi-grid-5" style="margin-bottom:18px">
    <div class="kpi-card accent-navy">
      <div class="kpi-label">Total Leads Today</div>
      <div class="kpi-value">${totalLeadsToday}</div>
      <div class="kpi-sub">${inboundsToday} inbound · ${totalLeadsToday-inboundsToday} new ingest</div>
    </div>
    <div class="kpi-card accent">
      <div class="kpi-label">Outbound Calls</div>
      <div class="kpi-value">${outboundCalls}</div>
      <div class="mini-progress"><div class="mini-progress-fill ${barColor(outboundCoveragePct)}" style="width:${Math.min(outboundCoveragePct,100)}%"></div></div>
      <div class="kpi-sub"><span style="font-weight:700;color:${txtColor(outboundCoveragePct)}">${outboundCoveragePct}%</span> of today's leads called</div>
    </div>
    <div class="kpi-card accent">
      <div class="kpi-label">Texts Sent</div>
      <div class="kpi-value">${textsSent}</div>
      <div class="mini-progress"><div class="mini-progress-fill ${barColor(textCoveragePct)}" style="width:${Math.min(textCoveragePct,100)}%"></div></div>
      <div class="kpi-sub"><span style="font-weight:700;color:${txtColor(textCoveragePct)}">${textCoveragePct}%</span> of today's leads texted</div>
    </div>
    <div class="kpi-card accent-amber">
      <div class="kpi-label">Inbound Calls</div>
      <div class="kpi-value">${inboundsToday}</div>
      <div class="kpi-sub">${inboundsAnswered} answered · ${inboundsToday-inboundsAnswered} missed</div>
    </div>
    <div class="kpi-card accent-amber">
      <div class="kpi-label">Inbound Answer Rate</div>
      <div class="kpi-value" style="color:${txtColor(inboundAnswerPct)}">${inboundAnswerPct}%</div>
      <div class="mini-progress"><div class="mini-progress-fill ${barColor(inboundAnswerPct)}" style="width:${Math.min(inboundAnswerPct,100)}%"></div></div>
      <div class="kpi-sub">${inboundsAnswered} of ${inboundsToday} inbounds answered</div>
    </div>
  </div>

  <div class="panel-row">
    <!-- COVERAGE BREAKDOWN -->
    <div class="card">
      <div class="card-header"><div class="card-title">Lead Coverage Today</div><span style="font-size:10.5px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Outbound · Inbound · Text</span></div>
      <div class="card-body">

        <div style="margin-bottom:18px">
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px">
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--navy-900)">📞 Outbound Calls vs. Leads</div>
              <div style="font-size:11.5px;color:var(--gray-500);margin-top:1px">${outboundCalls} of ${totalLeadsToday} leads called today</div>
            </div>
            <div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:${txtColor(outboundCoveragePct)}">${outboundCoveragePct}%</div>
          </div>
          <div class="progress" style="height:11px"><div class="progress-bar ${barColor(outboundCoveragePct)}" style="width:${Math.min(outboundCoveragePct,100)}%"></div></div>
        </div>

        <div style="margin-bottom:18px">
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px">
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--navy-900)">📲 Inbound Answer Rate</div>
              <div style="font-size:11.5px;color:var(--gray-500);margin-top:1px">${inboundsAnswered} of ${inboundsToday} inbound calls answered</div>
            </div>
            <div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:${txtColor(inboundAnswerPct)}">${inboundAnswerPct}%</div>
          </div>
          <div class="progress" style="height:11px"><div class="progress-bar ${barColor(inboundAnswerPct)}" style="width:${Math.min(inboundAnswerPct,100)}%"></div></div>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px">
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--navy-900)">💬 Texts Sent vs. Leads</div>

// ===== CUSTOMER HELPER FUNCTIONS =====
function customerLifetimeValue(c) {
  return c.policies.reduce((s,p)=>s+(p.premium||0),0);
}
function customerLifetimeFee(c) {
  return c.policies.reduce((s,p)=>s+(p.feeTotal||0),0);
}
function daysToRenewal(c) {
  const active = c.policies.find(p => p.status === 'Active');
  if (!active) return null;
  const today = new Date();
  const exp = new Date(active.expires);
  return Math.ceil((exp - today) / (1000*60*60*24));
}
function renewalChip(days) {
  if (days === null) return '<span style="color:var(--gray-300);font-size:11px">—</span>';
  if (days < 0)  return `<span style="color:var(--red);font-weight:700">${Math.abs(days)}d overdue</span>`;
  if (days <= 30) return `<span style="background:var(--red-light);color:var(--red);padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:700;border:1px solid #FCA5A5">${days}d</span>`;
  if (days <= 60) return `<span style="background:var(--amber-light);color:#B45309;padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:700;border:1px solid #FCD34D">${days}d</span>`;
  return `<span style="background:var(--green-50);color:var(--green-700);padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:700;border:1px solid var(--green-200)">${days}d</span>`;
}
function riskTierBadge(score) {
  if (score >= 80) return `<span style="background:var(--green-50);color:var(--green-700);padding:2px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;border:1px solid var(--green-200)">A · ${score}</span>`;
  if (score >= 65) return `<span style="background:var(--blue-light);color:#0E2340;padding:2px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;border:1px solid #C3D6E8">B · ${score}</span>`;
  if (score >= 50) return `<span style="background:var(--amber-light);color:#B45309;padding:2px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;border:1px solid #FCD34D">C · ${score}</span>`;
  return `<span style="background:var(--red-light);color:var(--red);padding:2px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;border:1px solid #FCA5A5">D · ${score}</span>`;
}

// Customer balance calculation: HCC collected → $0, else extended portion is what's outstanding
function customerBalance(p) {
  if (p.hccCollected) return 0;
  return p.feeExtended || 0;
}
function customerOpenBalance(c) {
  return c.policies.filter(p => p.status === 'Active' || p.status === 'Pending Cancellation')
    .reduce((sum,p) => sum + customerBalance(p), 0);
}
