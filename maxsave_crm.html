window.CUSTOMERS_SELECTED = new Set();

function toggleSelectCustomer(id, checked) {
  if (!window.CUSTOMERS_SELECTED) window.CUSTOMERS_SELECTED = new Set();
  if (checked) window.CUSTOMERS_SELECTED.add(id);
  else window.CUSTOMERS_SELECTED.delete(id);
  refreshCustomers();
}
function toggleSelectAllCustomers(checked) {
  if (!window.CUSTOMERS_SELECTED) window.CUSTOMERS_SELECTED = new Set();
  const list = window._currentCustomerList || [];
  if (checked) list.forEach(c => window.CUSTOMERS_SELECTED.add(c.id));
  else list.forEach(c => window.CUSTOMERS_SELECTED.delete(c.id));
  refreshCustomers();
}
function clearCustomerSelection() {
  window.CUSTOMERS_SELECTED = new Set();
  refreshCustomers();
}

function refreshCustomers(){
  const c = document.getElementById('content');
  if (!c) return;
  c.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'page-content';
  div.innerHTML = renderCustomersPage();
  c.appendChild(div);
}

function renderCustomersPage(){
  const s = window.CUSTOMERS_STATE;
  const tabs = ['Active','Upcoming Renewals','Cancelled','Pending Cancellation'];
  const upcomingRenewalsList = CUSTOMERS.filter(c => {
    if (c.status !== 'Active') return false;
    const d = daysToRenewal(c);
    return d !== null && d >= 0 && d <= 7;
  });
  const counts = {
    'Active': CUSTOMERS.filter(c => c.status==='Active').length,
    'Upcoming Renewals': upcomingRenewalsList.length,
    'Cancelled': CUSTOMERS.filter(c => c.status==='Cancelled').length,
    'Pending Cancellation': CUSTOMERS.filter(c => c.status==='Pending Cancellation').length,
  };

  // Active tab uses status filter; Upcoming Renewals tab uses 7-day filter
  let list;
  if (s.tab === 'Upcoming Renewals') {
    list = upcomingRenewalsList.slice();
  } else {
    list = CUSTOMERS.filter(c => c.status === s.tab);
  }
  if (s.carrier !== 'All') list = list.filter(c => c.carrier === s.carrier);
  if (s.city    !== 'All') list = list.filter(c => c.city === s.city);
  if (s.zip     !== 'All') list = list.filter(c => c.zip === s.zip);
  if (s.ageMin) list = list.filter(c => c.age >= parseInt(s.ageMin));
  if (s.ageMax) list = list.filter(c => c.age <= parseInt(s.ageMax));
  if (s.search) { const q = s.search.toLowerCase(); list = list.filter(c => (c.first+' '+c.last).toLowerCase().includes(q) || c.phone.includes(q) || c.policyNumber.toLowerCase().includes(q)); }
  // Dashboard-driven contextual filters:
  if (s.payPeriodOnly) {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-14);
    list = list.filter(c => c.policies.some(p => new Date(p.effective) >= cutoff));
  }
  if (s.openBalanceOnly) list = list.filter(c => customerOpenBalance(c) > 0);
  if (s.brokerFeeCollectedOnly) list = list.filter(c => c.policies.some(p => (p.feeCollected||0) > 0));
  if (s.renewalWindow) {
    list = list.filter(c => {
      const d = daysToRenewal(c);
      if (d === null || d < 0) return false;
      if (s.renewalWindow === 30) return d <= 30;
      if (s.renewalWindow === 60) return d > 30 && d <= 60;
      if (s.renewalWindow === 90) return d > 60 && d <= 90;
      return true;
    });
  }

  const carriers = ['All', ...new Set(CUSTOMERS.map(c => c.carrier))];
  const cities   = ['All', ...new Set(CUSTOMERS.map(c => c.city))];
  const zips     = ['All', ...new Set(CUSTOMERS.map(c => c.zip))];
  const filterOpen = !!window._custFilterOpen;

  // Contextual banner from dashboard click-throughs
  let contextBanner = '';
  if (s.payPeriodOnly) contextBanner = `<div style="background:linear-gradient(135deg,var(--green-500),var(--green-700));color:#fff;padding:13px 18px;border-radius:var(--radius-lg);margin-bottom:14px;display:flex;align-items:center;gap:12px"><span style="font-size:22px">💰</span><div style="flex:1"><div style="font-weight:800;font-size:14px">Pay Period Sales — Last 14 Days</div><div style="font-size:12px;opacity:0.85;margin-top:1px">Showing customers whose policy was effective in the current pay period.</div></div><button class="btn btn-ghost" style="background:rgba(255,255,255,0.18);color:#fff;border-color:rgba(255,255,255,0.30);font-size:12px" onclick="window.CUSTOMERS_STATE.payPeriodOnly=false;refreshCustomers()">Clear ✕</button></div>`;
  else if (s.openBalanceOnly) contextBanner = `<div style="background:linear-gradient(135deg,#F59E0B,#B45309);color:#fff;padding:13px 18px;border-radius:var(--radius-lg);margin-bottom:14px;display:flex;align-items:center;gap:12px"><span style="font-size:22px">💳</span><div style="flex:1"><div style="font-weight:800;font-size:14px">Open Balances — HCC Outstanding</div><div style="font-size:12px;opacity:0.90;margin-top:1px">Showing customers with unpaid extended broker fees.</div></div><button class="btn btn-ghost" style="background:rgba(255,255,255,0.20);color:#fff;border-color:rgba(255,255,255,0.30);font-size:12px" onclick="window.CUSTOMERS_STATE.openBalanceOnly=false;refreshCustomers()">Clear ✕</button></div>`;
  else if (s.brokerFeeCollectedOnly) contextBanner = `<div style="background:linear-gradient(135deg,var(--green-600),var(--green-800));color:#fff;padding:13px 18px;border-radius:var(--radius-lg);margin-bottom:14px;display:flex;align-items:center;gap:12px"><span style="font-size:22px">✅</span><div style="flex:1"><div style="font-weight:700;font-size:14px">Broker Fee Collected</div><div style="font-size:12px;opacity:0.85;margin-top:1px">Showing customers with broker fee collected this pay period.</div></div><button class="btn btn-ghost" style="background:rgba(255,255,255,0.18);color:#fff;border-color:rgba(255,255,255,0.30);font-size:12px" onclick="window.CUSTOMERS_STATE.brokerFeeCollectedOnly=false;refreshCustomers()">Clear ✕</button></div>`;
  else if (s.renewalWindow) contextBanner = `<div style="background:linear-gradient(135deg,var(--navy-700),var(--navy-900));color:#fff;padding:13px 18px;border-radius:var(--radius-lg);margin-bottom:14px;display:flex;align-items:center;gap:12px"><span style="font-size:22px">🔄</span><div style="flex:1"><div style="font-weight:800;font-size:14px">Renewals — ${s.renewalWindow===30?'Next 30 Days':s.renewalWindow===60?'31–60 Days':'61–90 Days'}</div><div style="font-size:12px;opacity:0.85;margin-top:1px">Active customers approaching renewal in this window.</div></div><button class="btn btn-ghost" style="background:rgba(255,255,255,0.18);color:#fff;border-color:rgba(255,255,255,0.30);font-size:12px" onclick="window.CUSTOMERS_STATE.renewalWindow=null;refreshCustomers()">Clear ✕</button></div>`;

  const custSelectedCount = (window.CUSTOMERS_SELECTED || new Set()).size;

  return `
  ${contextBanner}
  <div class="page-header">
    <div class="page-header-left" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="window._custFilterOpen=!window._custFilterOpen;refreshCustomers()" style="font-size:13px;padding:8px 14px;${filterOpen?'background:var(--navy-900);color:#fff;border-color:var(--navy-900)':''}">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 16 16"><path d="M1 2h14l-5 7v5l-4-2V9z" stroke-linejoin="round"/></svg>
        Filter${(s.carrier!=='All'||s.city!=='All'||s.zip!=='All'||s.ageMin||s.ageMax)?` <span style="background:var(--green-500);color:#fff;font-size:10px;padding:1px 6px;border-radius:var(--radius-full);margin-left:4px">●</span>`:''}
      </button>
      <div>
        <h1>Customers</h1>
        <p>${CUSTOMERS.length} total · ${counts['Active']} active · ${counts['Upcoming Renewals']} renewing in 7d · ${counts['Pending Cancellation']} pending cancel · ${counts['Cancelled']} cancelled${custSelectedCount?` · <strong style="color:var(--green-700)">${custSelectedCount} selected</strong>`:''}</p>
      </div>
      ${custSelectedCount ? `
      <div style="display:flex;gap:8px;align-items:center;margin-left:8px">
        <span style="font-size:11.5px;font-weight:700;color:var(--green-700);background:var(--green-50);padding:5px 10px;border-radius:var(--radius-full);border:1px solid var(--green-200)">${custSelectedCount} selected</span>
        <button type="button" class="btn" style="background:var(--blue);color:#fff;font-size:13px;padding:7px 16px;font-weight:600;cursor:pointer" onclick="openBulkText()">💬 Bulk Text</button>
        <button type="button" class="btn" style="background:var(--green-600);color:#fff;font-size:13px;padding:7px 16px;font-weight:600;cursor:pointer" onclick="startPowerDial()">📞 Power Dial</button>
        <button type="button" class="btn btn-ghost" style="font-size:12px;cursor:pointer" onclick="clearCustomerSelection()">Clear</button>
      </div>` : ''}
    </div>
    <div class="btn-group">
      <input class="filter-select" placeholder="Search name, phone, policy #…" value="${s.search}" oninput="window.CUSTOMERS_STATE.search=this.value;refreshCustomers()" style="font-family:var(--font-body);min-width:220px;font-size:13px">
      <button class="btn btn-ghost">⬇ Export</button>
      <button class="btn btn-primary">+ Add Customer</button>
    </div>
  </div>

  ${filterOpen ? `
  <div class="filter-bar" style="margin-bottom:14px">
    <span class="filter-label">Carrier:</span>
    <select class="filter-select" onchange="window.CUSTOMERS_STATE.carrier=this.value;refreshCustomers()">
      ${carriers.map(x=>`<option ${s.carrier===x?'selected':''}>${x}</option>`).join('')}
    </select>
    <span class="filter-label">City:</span>
    <select class="filter-select" onchange="window.CUSTOMERS_STATE.city=this.value;refreshCustomers()">
      ${cities.map(x=>`<option ${s.city===x?'selected':''}>${x}</option>`).join('')}
    </select>
    <span class="filter-label">ZIP:</span>
    <select class="filter-select" onchange="window.CUSTOMERS_STATE.zip=this.value;refreshCustomers()">
      ${zips.map(x=>`<option ${s.zip===x?'selected':''}>${x}</option>`).join('')}
    </select>
    <span class="filter-label">Age:</span>
    <input type="number" class="filter-select" placeholder="Min" value="${s.ageMin}" oninput="window.CUSTOMERS_STATE.ageMin=this.value;refreshCustomers()" style="width:70px;font-family:var(--font-body)">
    <span style="font-size:11px;color:var(--gray-400)">to</span>
    <input type="number" class="filter-select" placeholder="Max" value="${s.ageMax}" oninput="window.CUSTOMERS_STATE.ageMax=this.value;refreshCustomers()" style="width:70px;font-family:var(--font-body)">
    <button class="btn btn-ghost" style="font-size:12px;margin-left:auto" onclick="window.CUSTOMERS_STATE={tab:window.CUSTOMERS_STATE.tab,carrier:'All',city:'All',zip:'All',ageMin:'',ageMax:'',search:''};refreshCustomers()">Reset Filters</button>
  </div>` : ''}

  <div class="tabs" style="margin-bottom:14px">
    ${tabs.map(t=>{
      const cls = s.tab === t ? 'tab active' : 'tab';
      const dot = t==='Active' ? '#3BAA47' : t==='Cancelled' ? '#EF4444' : t==='Upcoming Renewals' ? '#B45309' : '#F59E0B';
      const icon = t==='Upcoming Renewals' ? '🔄 ' : '';
      return `<div class="${cls}" onclick="window.CUSTOMERS_STATE.tab='${t}';clearCustomerSelection()">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dot};margin-right:6px"></span>
        ${icon}${t} <span style="background:${t==='Upcoming Renewals' && counts[t]>0 ? '#FEF9EC' : 'var(--gray-100)'};color:${t==='Upcoming Renewals' && counts[t]>0 ? '#B45309' : 'var(--gray-600)'};padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;margin-left:5px">${counts[t]}</span>
      </div>`;
    }).join('')}
  </div>

  ${(()=>{ window._currentCustomerList = list; return ''; })()}
  <div class="card" style="overflow-x:auto">
    <table class="data-table leads-table">
      <thead><tr>
        <th style="width:42px"><input type="checkbox" ${list.length>0 && list.every(c => (window.CUSTOMERS_SELECTED||new Set()).has(c.id)) ? 'checked' : ''} onchange="toggleSelectAllCustomers(this.checked)" style="cursor:pointer;width:16px;height:16px"></th>
        <th>Customer</th><th>Carrier / Policy #</th><th>Sold By</th><th>Lines</th><th>Broker Fee Total</th><th>Open Balance</th><th>Renewal</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${list.length === 0 ? '<tr><td colspan="9" style="text-align:center;padding:36px;color:var(--gray-400);font-size:14px">No customers match the current filters.</td></tr>' : list.map(c=>{
          const bal = customerOpenBalance(c);
          const brokerFeeTotal = c.policies.reduce((sum,p) => sum + (p.feeTotal||0), 0);
          const renew = daysToRenewal(c);
          const lineCount = c.policies.filter(p => p.status === 'Active' || p.status === 'Pending Cancellation').length;
          const isSel = (window.CUSTOMERS_SELECTED || new Set()).has(c.id);
          return `<tr style="${isSel?'background:var(--green-50)':''}">
            <td><input type="checkbox" ${isSel?'checked':''} onchange="toggleSelectCustomer('${c.id}',this.checked)" style="cursor:pointer;width:16px;height:16px"></td>
            <td>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <div class="lead-name-link" onclick="openCustomerDetail('${c.id}')" style="font-weight:800;font-size:16px;color:var(--navy-900);cursor:pointer">${c.first} ${c.last}</div>
                ${c.sr22?'<span style="background:#FEF2F2;color:#991B1B;border:1px solid #FCA5A5;padding:1px 7px;border-radius:var(--radius-full);font-size:11px;font-weight:800;letter-spacing:0.4px">SR-22</span>':''}
                ${c.language==='Spanish'?'<span title="Spanish-speaking" style="font-size:14px">🇪🇸</span>':''}
              </div>
              <div style="font-size:14px;color:var(--gray-500);margin-top:2px">${c.phone}</div>
            </td>
            <td>
              <div style="font-size:14px;font-weight:600;color:var(--gray-800)">${c.carrier}</div>
              <div style="font-family:monospace;font-size:13px;color:var(--gray-500);margin-top:1px">${c.policyNumber}</div>
            </td>
            <td><span style="font-size:15px;font-weight:800;color:#0C2040">${c.soldBy}</span></td>
            <td><span style="background:var(--navy-50);color:var(--navy-700);font-size:13px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full);border:1px solid var(--navy-100)">${lineCount} line${lineCount!==1?'s':''}</span></td>
            <td style="font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--green-700)">${brokerFeeTotal>0?fmt$(brokerFeeTotal):'—'}</td>
            <td style="font-family:var(--font-display);font-weight:700;font-size:15px;color:${bal>0?'var(--red)':'var(--gray-300)'}">${bal>0?fmt$(bal):'$0'}</td>
            <td>${renewalChip(renew)}</td>
            <td>
              <div style="display:flex;gap:6px">
                <button type="button" title="View" onclick="openCustomerDetail('${c.id}')" style="width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--gray-50);cursor:pointer;font-size:13px">👁</button>
                <button type="button" title="Call" onclick="alert('Calling ${c.first}…')" style="background:#1A6ED0;color:#fff;border:none;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);white-space:nowrap"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16"><path d="M2 2.5C2 2.5 3.5 1 5 1s2.5 1.5 3 3-1 2-1 3 2 2.5 3 3 3-1.5 3-3 1 3 1 3-1.5 2-3 2c-2 0-4-1-6-3S1 5.5 1 3.5C1 2.5 2 2.5 2 2.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>Call</button>
                <button type="button" title="Text" onclick="openTextThread()" style="background:#fff;color:#374151;border:1.5px solid #D1D5DB;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);white-space:nowrap"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16"><path d="M14 9.5a5 5 0 0 1-5 5H3l-2 2V5a5 5 0 0 1 5-5h3a5 5 0 0 1 5-5v4.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>Text</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

PAGES.customers = '';
window.PAGE_INIT = window.PAGE_INIT || {};
window.PAGE_INIT.customers = function(){ refreshCustomers(); };

// ===== CUSTOMER DETAIL =====
function openCustomerDetail(id) {
  window._currentCustomerId = id;
  nav('customerdetail', null);
}

PAGES.customerdetail = '';
window.PAGE_INIT.customerdetail = function(){
  const id = window._currentCustomerId;
  const c = CUSTOMERS.find(x => x.id === id) || CUSTOMERS[0];
  const isActive = c.status === 'Active';
  const isCancelled = c.status === 'Cancelled';
  const statusColor = isActive ? '#3BAA47' : isCancelled ? '#EF4444' : '#F59E0B';
  const statusGlow  = isActive ? '0 0 18px rgba(59,170,71,0.55)' : isCancelled ? '0 0 18px rgba(239,68,68,0.55)' : '0 0 18px rgba(245,158,11,0.55)';
  const statusLabel = c.status.toUpperCase();

  const totalCollected = c.policies.reduce((s,p)=>s+(p.feeCollected||0)+(p.hccCollected?(p.feeExtended||0):0),0);
  const totalExtended  = c.policies.reduce((s,p)=>s+(p.feeExtended||0),0);
  const openBal        = customerOpenBalance(c);

  const html = `
  <!-- HEADER -->
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-ghost" onclick="nav('customers',document.querySelector('[onclick*=customers]'))">← All Customers</button>
    <div style="flex:1;min-width:240px">
      <div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--navy-900);letter-spacing:-0.3px">${c.first} ${c.last}</div>
      <div style="font-size:12.5px;color:var(--gray-500);margin-top:2px">Customer ID: ${c.id} · Customer since ${c.customerSince}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10.5px;color:var(--gray-400);font-weight:700;letter-spacing:0.6px;text-transform:uppercase">Carrier</div>
      <div style="font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--navy-900)">${c.carrier}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10.5px;color:var(--gray-400);font-weight:700;letter-spacing:0.6px;text-transform:uppercase">Policy #</div>
      <div style="font-family:monospace;font-weight:700;font-size:14px;color:var(--navy-900)">${c.policyNumber}</div>
    </div>
    <div class="cust-status-badge" style="background:${statusColor};color:#fff;font-weight:800;font-size:13px;padding:11px 22px;border-radius:var(--radius-full);letter-spacing:0.8px;box-shadow:${statusGlow};animation:custGlow 2s ease-in-out infinite">
      ${isActive ? '●' : isCancelled ? '✕' : '⚠'} ${statusLabel}
    </div>
    <button class="btn quote-export-btn" style="background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;font-size:13px;padding:11px 20px;font-weight:700;box-shadow:0 4px 14px rgba(28,43,75,0.30);border:none" onclick="openQuoteExport('customer','${c.id}')">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16"><path d="M8 2v8m0 0l-3-3m3 3l3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Quote Export
    </button>
  </div>

  <!-- ACTION BAR -->
  <div class="card" style="margin-bottom:14px;padding:11px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn" style="background:var(--green-500);color:#fff;font-size:13px;padding:8px 16px" onclick="alert('Calling ${c.first}…')">📞 Call</button>
    <button class="btn" style="background:var(--blue);color:#fff;font-size:13px;padding:8px 16px" onclick="openTextThread()">💬 Text</button>
    <button class="btn" style="background:var(--purple);color:#fff;font-size:13px;padding:8px 16px" onclick="alert('Set follow-up appointment')">📅 Schedule</button>
    <button class="btn btn-ghost" style="font-size:13px;padding:8px 16px">📄 Generate Renewal Quote</button>
    <button class="btn btn-ghost" style="font-size:13px;padding:8px 16px">💼 File a Claim</button>
    <div style="flex:1"></div>
  </div>

  <!-- SUMMARY METRIC ROW -->
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px">
    <div class="kpi-card accent">
      <div class="kpi-label">Lifetime Premium</div>
      <div class="kpi-value" style="font-size:22px">${fmtK(customerLifetimeValue(c))}</div>
      <div class="kpi-sub">${c.policies.length} policies on record</div>
    </div>
    <div class="kpi-card accent">
      <div class="kpi-label">Lifetime Broker Fees</div>
      <div class="kpi-value green" style="font-size:22px">${fmtK(customerLifetimeFee(c))}</div>
      <div class="kpi-sub">All-time agency revenue</div>
    </div>
    <div class="kpi-card ${openBal>0?'accent-red':'accent'}">
      <div class="kpi-label">Open Balance</div>
      <div class="kpi-value ${openBal>0?'red':'green'}" style="font-size:22px">${openBal>0?fmt$(openBal):'$0'}</div>
      <div class="kpi-sub">${openBal>0?'Outstanding HCC':'All paid up'}</div>
    </div>
    <div class="kpi-card accent-amber">
      <div class="kpi-label">Days to Renewal</div>
      <div class="kpi-value amber" style="font-size:22px">${daysToRenewal(c)===null?'—':(daysToRenewal(c) + 'd')}</div>
      <div class="kpi-sub">${(()=>{const a=c.policies.find(p=>p.status==='Active');return a?'Expires '+a.expires:'No active policy';})()}</div>
    </div>
    <div class="kpi-card accent-navy">
      <div class="kpi-label">Risk Score</div>
      <div class="kpi-value" style="font-size:22px">${riskTierBadge(c.riskScore)}</div>
      <div class="kpi-sub">${c.claimsLast5yr} claims · ${c.ticketsLast3yr} tickets</div>

// Drag handlers for live call transfer
window._dragCallFrom = null;
function onAgentCallDragStart(ev, agentName) {
  window._dragCallFrom = agentName;
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', agentName); } catch(_) {}
  ev.currentTarget.style.opacity = '0.5';
}
function onAgentCallDragEnd(ev) {
  ev.currentTarget.style.opacity = '';
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('dragover'));
}
function onTransferDrop(ev, type, target) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const fromName = window._dragCallFrom || (ev.dataTransfer && ev.dataTransfer.getData('text/plain'));
  if (!fromName) return;
  const fromAgent = window.AGENT_LIVE.find(a => a.name === fromName);
  if (!fromAgent || fromAgent.status !== 'on-call') return;
  if (type === 'all-extensions') {
    alert('📡 Broadcasting ' + fromAgent.leadName + ' to all extensions…');
    fromAgent.status = 'wrap-up'; fromAgent.callDuration = 0; fromAgent.leadName = null; fromAgent.leadPhone = null; fromAgent.callDirection = null;
  } else if (type === 'agent') {
    const toAgent = window.AGENT_LIVE.find(a => a.name === target);
    if (toAgent) {
      alert('↪ Transferring ' + fromAgent.leadName + ' to ' + toAgent.name + ' (Ext ' + toAgent.ext + ')');
      // simulate the transfer
      toAgent.status = 'on-call';
      toAgent.callDuration = 1;
      toAgent.callDirection = fromAgent.callDirection;
      toAgent.leadName = fromAgent.leadName;
      toAgent.leadPhone = fromAgent.leadPhone;
      fromAgent.status = 'wrap-up'; fromAgent.callDuration = 0; fromAgent.leadName = null; fromAgent.leadPhone = null; fromAgent.callDirection = null;
    }
  } else if (type === 'park') {
    const slotIdx = target;
    const time = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    window.LIVEVIEW_STATE.parkingLot[slotIdx] = { lead: fromAgent.leadName, phone: fromAgent.leadPhone, parkedAt: time };
    alert('🅿 ' + fromAgent.leadName + ' parked in slot ' + (slotIdx+1));
    fromAgent.status = 'wrap-up'; fromAgent.callDuration = 0; fromAgent.leadName = null; fromAgent.leadPhone = null; fromAgent.callDirection = null;
  }
  window._dragCallFrom = null;
  refreshLiveView();
}
function retrieveParkedCall(idx) {
  const slot = window.LIVEVIEW_STATE.parkingLot[idx];
  if (!slot) return;
  const me = window.AGENT_LIVE.find(a => a.name === window.LIVEVIEW_STATE.loggedInAgent);
  if (!me) return;
  me.status = 'on-call';
  me.callDuration = 1;
  me.callDirection = 'outbound';
  me.leadName = slot.lead;
  me.leadPhone = slot.phone;
  window.LIVEVIEW_STATE.parkingLot[idx] = null;
  alert('▶ Retrieved ' + slot.lead + ' from parking');
  refreshLiveView();
}

function refreshInbox() {
  const c = document.getElementById('content'); if (!c) return;
  c.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'page-content';
  div.innerHTML = renderInboxPage();
  c.appendChild(div);
}

function setInboxTab(t) { window.INBOX_STATE.tab = t; refreshInbox(); }

function sentimentBadge(s) {
  if (s === 'positive') return '<span title="Positive sentiment" style="font-size:14px">😊</span>';
  if (s === 'negative') return '<span title="Negative sentiment" style="font-size:14px">😠</span>';
  return '<span title="Neutral sentiment" style="font-size:14px">😐</span>';
}
function priorityChip(p) {
  if (p === 'high') return '<span style="background:var(--red-light);color:var(--red);border:1px solid #FCA5A5;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:var(--radius-full);letter-spacing:0.4px">HIGH</span>';
  if (p === 'med')  return '<span style="background:var(--amber-light);color:#B45309;border:1px solid #FCD34D;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:var(--radius-full);letter-spacing:0.4px">MED</span>';
  return '<span style="background:var(--gray-100);color:var(--gray-500);font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:var(--radius-full);letter-spacing:0.4px">LOW</span>';
}

function renderInboxPage() {
  const s = window.INBOX_STATE;
  const myCalls   = window.CALL_HISTORY.filter(h => h.agent === s.loggedInAgent);
  const myEmails  = window.EMAILS.filter(e => e.agent === s.loggedInAgent);
  const unreadEmails = myEmails.filter(e => !e.read).length;
  const missedCalls  = myCalls.filter(c => c.status === 'missed').length;

  // Build text conversations list (one row per phone number with last message)
  const threadList = Object.keys(window.CONVERSATIONS || {}).map(phone => {
    const days = window.CONVERSATIONS[phone];
    let lastMsg = null;
    let lastDay = '';
    for (let i = days.length - 1; i >= 0; i--) {
      if (days[i].msgs.length > 0) {
        lastMsg = days[i].msgs[days[i].msgs.length - 1];
        lastDay = days[i].date;
        break;
      }
    }
    if (!lastMsg) return null;
    // Find name from APPOINTMENTS / LEADS / CUSTOMERS / CALL_HISTORY
    let name = 'Unknown';
    const fromAppt = APPOINTMENTS.find(a => a.phone === phone);
    const fromLead = (typeof LEADS !== 'undefined') ? LEADS.find(l => l.phone === phone) : null;
    const fromCall = window.CALL_HISTORY.find(h => h.phone === phone);
    if (fromAppt) name = fromAppt.lead;
    else if (fromLead) name = fromLead.name;
    else if (fromCall) name = fromCall.contact;
    const unread = (window.UNREAD_THREADS || new Set()).has(phone);
    return { phone, name, lastMsg, lastDay, unread };
  }).filter(Boolean);
  // Sort: unread first, then most recent
  threadList.sort((a,b) => {
    if (a.unread !== b.unread) return a.unread ? -1 : 1;
    if (a.lastDay !== b.lastDay) return a.lastDay === 'Today' ? -1 : 1;
    return 0;
  });
  const unreadTexts = threadList.filter(t => t.unread).length;

  // Filter by search
  const q = s.search.toLowerCase();
  const filteredCalls   = !q ? myCalls   : myCalls.filter(c => c.contact.toLowerCase().includes(q) || c.phone.includes(q));
  const filteredThreads = !q ? threadList: threadList.filter(t => t.name.toLowerCase().includes(q) || t.phone.includes(q) || (t.lastMsg.text||'').toLowerCase().includes(q));
  const filteredEmails  = !q ? myEmails  : myEmails.filter(e => e.from.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q) || e.preview.toLowerCase().includes(q));

  return `
  <div class="page-header">
    <div class="page-header-left">
      <h1>📬 Inbox</h1>
      <p>${myCalls.length} calls · ${threadList.length} text threads · ${myEmails.length} emails · ${unreadTexts + unreadEmails} unread</p>
    </div>
    <div class="btn-group">
      <input class="filter-select" placeholder="Search across all comms…" value="${s.search}" oninput="window.INBOX_STATE.search=this.value;refreshInbox()" style="font-family:var(--font-body);min-width:240px;font-size:13px">
      <select class="filter-select" style="font-family:var(--font-body);font-size:13px" onchange="window.INBOX_STATE.dateRange=this.value;refreshInbox()">
        <option ${s.dateRange==='Today'?'selected':''}>Today</option>
        <option ${s.dateRange==='Yesterday'?'selected':''}>Yesterday</option>
        <option ${s.dateRange==='Week'?'selected':''}>This Week</option>
        <option ${s.dateRange==='Month'?'selected':''}>This Month</option>
        <option ${s.dateRange==='All'?'selected':''}>All</option>
      </select>
      <button class="btn btn-ghost">🔇 Mark All Read</button>
      <button class="btn btn-primary">✏ Compose</button>
    </div>
  </div>

  <!-- STATS ROW -->
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi-card accent"><div class="kpi-label">Calls Today</div><div class="kpi-value">${myCalls.filter(c=>c.date==='Today').length}</div><div class="kpi-sub">${myCalls.filter(c=>c.date==='Today' && c.recording).length} recordings</div></div>
    <div class="kpi-card accent-red"><div class="kpi-label">Missed Calls</div><div class="kpi-value red">${missedCalls}</div><div class="kpi-sub">Need callback</div></div>
    <div class="kpi-card accent-navy"><div class="kpi-label">Unread Texts</div><div class="kpi-value">${unreadTexts}</div><div class="kpi-sub">${threadList.length} active threads</div></div>
    <div class="kpi-card accent-amber"><div class="kpi-label">Unread Emails</div><div class="kpi-value amber">${unreadEmails}</div><div class="kpi-sub">${myEmails.filter(e=>e.priority==='high').length} marked high priority</div></div>
  </div>

  <!-- TABS -->
  <div class="tabs" style="margin-bottom:16px">
    <div class="tab ${s.tab==='Calls'?'active':''}"  onclick="setInboxTab('Calls')">📞 Calls <span style="background:var(--gray-100);color:var(--gray-600);padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;margin-left:5px">${myCalls.length}</span></div>
    <div class="tab ${s.tab==='Texts'?'active':''}"  onclick="setInboxTab('Texts')">💬 Texts <span style="background:${unreadTexts>0?'#FEF2F2':'var(--gray-100)'};color:${unreadTexts>0?'var(--red)':'var(--gray-600)'};padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;margin-left:5px">${threadList.length}${unreadTexts?' · '+unreadTexts+' new':''}</span></div>
    <div class="tab ${s.tab==='Emails'?'active':''}" onclick="setInboxTab('Emails')">📧 Emails <span style="background:${unreadEmails>0?'#FEF2F2':'var(--gray-100)'};color:${unreadEmails>0?'var(--red)':'var(--gray-600)'};padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700;margin-left:5px">${myEmails.length}${unreadEmails?' · '+unreadEmails+' new':''}</span></div>
  </div>

  ${s.tab === 'Calls' ? renderInboxCalls(filteredCalls) :
    s.tab === 'Texts' ? renderInboxTexts(filteredThreads) :
                        renderInboxEmails(filteredEmails)}
  `;
}

function renderInboxCalls(calls) {
  if (calls.length === 0) return `<div class="card"><div class="empty"><div class="empty-icon">📞</div><div class="empty-title">No calls match</div></div></div>`;
  return `
  <div class="card">
    <table class="data-table">
      <thead><tr><th>Time</th><th>Direction</th><th>Contact</th><th>Phone</th><th>Duration</th><th>Outcome</th><th>Recording</th><th>Transcript</th><th>Actions</th></tr></thead>
      <tbody>
        ${calls.map(h => {
          const dirIco = h.direction === 'outbound' ? '↗ Outbound' : '↙ Inbound';
          const dirCol = h.direction === 'outbound' ? 'var(--green-700)' : '#0E2340';
          const statusCol = h.status === 'connected' ? 'var(--green-700)' : h.status === 'missed' ? 'var(--red)' : 'var(--gray-500)';
          const safeName = h.contact.replace(/'/g,"\\'");
          return `<tr>
            <td><div style="font-weight:600;font-size:13px">${h.time}</div><div style="font-size:11px;color:var(--gray-400)">${h.date}</div></td>
            <td><span style="font-size:11.5px;font-weight:700;color:${dirCol}">${dirIco}</span></td>
            <td><div class="lead-name-link" onclick="nav('leaddetail',null)" style="font-weight:700;color:var(--navy-900);cursor:pointer;font-size:13.5px">${h.contact}</div></td>
            <td style="font-size:12.5px;color:var(--gray-600);font-family:monospace">${h.phone}</td>
            <td style="font-family:var(--font-display);font-weight:700;color:${statusCol}">${h.duration > 0 ? fmtCallDuration(h.duration) : '—'}</td>
            <td><span style="font-size:11.5px;font-weight:700;color:${statusCol}">${h.outcome}</span></td>
            <td>${h.recording?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:4px 11px" onclick="playRecording('${safeName}')">▶ Play</button>`:'<span style="color:var(--gray-300);font-size:11px">—</span>'}</td>
            <td>${h.recording?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:4px 11px" onclick="viewTranscript('${safeName}')">📄 View</button>`:'<span style="color:var(--gray-300);font-size:11px">—</span>'}</td>
            <td>
              <div style="display:flex;gap:5px">
                <button type="button" title="Call back" onclick="alert('Calling ${safeName}…')" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--green-200);background:var(--green-50);cursor:pointer;font-size:13px">📞</button>
                <button type="button" title="Text" onclick="openTextThread('${safeName}','${h.phone}')" style="width:30px;height:30px;border-radius:6px;border:1px solid #C3D6E8;background:var(--blue-light);cursor:pointer;font-size:13px">💬</button>
                <button type="button" title="View profile" onclick="nav('leaddetail',null)" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--gray-50);cursor:pointer;font-size:13px">👁</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

function renderInboxTexts(threads) {
  if (threads.length === 0) return `<div class="card"><div class="empty"><div class="empty-icon">💬</div><div class="empty-title">No conversations match</div></div></div>`;
  return `
  <div class="card">
    <div class="card-body" style="padding:6px 0">
      ${threads.map(t => {
        const safeName = t.name.replace(/'/g,"\\'");
        const init = t.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
        const isInbound = t.lastMsg.from === 'them';
        return `
        <div onclick="openTextThread('${safeName}','${t.phone}');if(window.UNREAD_THREADS){window.UNREAD_THREADS.delete('${t.phone}');document.getElementById('inboxBadge').textContent=window.UNREAD_THREADS.size;}refreshInbox()" style="display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;background:${t.unread?'var(--green-50)':'transparent'};transition:background 0.15s;border-left:${t.unread?'3px solid var(--green-500)':'3px solid transparent'}" onmouseenter="if(!${t.unread})this.style.background='var(--gray-50)'" onmouseleave="if(!${t.unread})this.style.background='transparent'">
          <div class="avatar ${agentAv(t.name)}" style="width:42px;height:42px;font-size:13px;flex-shrink:0">${init}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
              <div style="font-weight:${t.unread?'800':'700'};font-size:14px;color:var(--navy-900)">${t.name}</div>
              <span style="font-size:11.5px;color:var(--gray-400)">${t.phone}</span>
              ${t.unread?'<span style="background:var(--red);color:#fff;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:var(--radius-full);letter-spacing:0.4px">NEW</span>':''}
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:${t.unread?'var(--navy-900)':'var(--gray-600)'};font-weight:${t.unread?'600':'400'};line-height:1.4">
              ${isInbound?'':'<span style="color:var(--gray-400);font-weight:600">You:</span>'}
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">${(t.lastMsg.text||'').replace(/</g,'&lt;')}</span>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:11.5px;color:var(--gray-500);font-weight:600">${t.lastDay==='Today'?t.lastMsg.time:t.lastDay}</div>
            <button type="button" class="btn" style="background:var(--blue);color:#fff;font-size:11px;padding:5px 12px;font-weight:700;margin-top:6px" onclick="event.stopPropagation();openTextThread('${safeName}','${t.phone}')">💬 Reply</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  `;
}

function renderInboxEmails(emails) {
  if (emails.length === 0) return `<div class="card"><div class="empty"><div class="empty-icon">📧</div><div class="empty-title">No emails match</div></div></div>`;
  return `
  <div class="card">
    <div class="card-body" style="padding:6px 0">
      ${emails.map(e => {
        const init = e.from.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
        return `
        <div onclick="alert('Opening: ${e.subject.replace(/'/g,"\\'")}')" style="display:flex;align-items:flex-start;gap:13px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;background:${!e.read?'var(--green-50)':'transparent'};transition:background 0.15s;border-left:${!e.read?'3px solid var(--green-500)':'3px solid transparent'}" onmouseenter="if(${e.read})this.style.background='var(--gray-50)'" onmouseleave="if(${e.read})this.style.background='transparent'">
          <div class="avatar ${agentAv(e.from)}" style="width:42px;height:42px;font-size:13px;flex-shrink:0">${init}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap">
              <div style="font-weight:${!e.read?'800':'700'};font-size:14px;color:var(--navy-900)">${e.from}</div>
              ${e.starred?'<span style="font-size:14px;color:#F59E0B" title="Starred">★</span>':''}
              ${priorityChip(e.priority)}
              ${sentimentBadge(e.sentiment)}
              ${e.attachments>0?`<span style="font-size:11px;color:var(--gray-500);background:var(--gray-100);padding:1px 7px;border-radius:var(--radius-full);font-weight:600">📎 ${e.attachments}</span>`:''}
              <span style="font-size:11.5px;color:var(--gray-400);margin-left:auto">${e.time} · ${e.date}</span>
            </div>
            <div style="font-weight:${!e.read?'700':'600'};font-size:13.5px;color:var(--navy-900);margin-bottom:3px">${e.subject}</div>
            <div style="font-size:12.5px;color:var(--gray-600);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.preview}</div>
            <div style="display:flex;gap:6px;margin-top:9px" onclick="event.stopPropagation()">
              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="alert('Reply to ${e.from.replace(/'/g,"\\'")} composer opening…')">↩ Reply</button>
              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px">↪ Forward</button>
              ${e.phone?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="alert('Calling ${e.from.replace(/'/g,"\\'")}…')">📞 Call</button><button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="openTextThread('${e.from.replace(/'/g,"\\'")}','${e.phone}')">💬 Text</button>`:''}
              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px">⏰ Snooze</button>
              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px">📁 Archive</button>
              ${e.phone?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="nav('leaddetail',null)">👁 Profile</button>`:''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  `;
}

function refreshTasksPage() {
  const c = document.getElementById('content');
  if (!c) return;
  c.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'page-content';
  div.innerHTML = renderTasksPage();
  c.appendChild(div);
}

function renderTasksPage() {
  const filterAgent = window.TASKS_STATE.agentFilter || 'All';
  const agentList   = ['All', 'Admin', ...AGENTS.map(a => a.name)];

  let tasks = window.TASKS_DATA.slice();
  if (filterAgent !== 'All') tasks = tasks.filter(t => t.assignedTo === filterAgent);

  const todayTasks    = tasks.filter(t => t.dueDate === TODAY_ISO && !t.done);
  const upcomingTasks = tasks.filter(t => t.dueDate > TODAY_ISO && !t.done);
  const doneTasks     = tasks.filter(t => t.done);
  const totalOpen     = todayTasks.length + upcomingTasks.length;

  const taskRow = (t, isToday) => `
  <div id="task-row-${t.id}" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-md);border:1px solid ${t.done?'var(--border)':t.priority==='high'?'var(--navy-200)':'var(--border)'};margin-bottom:7px;background:${t.done?'var(--gray-50)':t.priority==='high'&&isToday?'var(--navy-50)':'var(--white)'};transition:all 0.15s">
    <div onclick="toggleTaskDone(${t.id})" style="width:16px;height:16px;border-radius:4px;border:2px solid ${t.done?'var(--green-500)':'var(--gray-300)'};flex-shrink:0;cursor:pointer;background:${t.done?'var(--green-500)':'transparent'};display:flex;align-items:center;justify-content:center">
      ${t.done?'<svg width="9" height="9" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
    </div>
    <span style="font-size:14px;flex-shrink:0">${t.icon}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12.5px;font-weight:600;color:${t.done?'var(--gray-400)':'var(--navy-900)'};${t.done?'text-decoration:line-through':''}">${t.label}</div>
      <div style="font-size:11px;color:var(--gray-400);margin-top:1px;display:flex;align-items:center;gap:8px">
        <span>${t.dueTime||'No time set'}</span>
        <span style="background:${t.assignedTo==='Admin'?'var(--navy-50)':'var(--green-50)'};color:${t.assignedTo==='Admin'?'var(--navy-700)':'var(--green-700)'};border:1px solid ${t.assignedTo==='Admin'?'var(--navy-200)':'var(--green-200)'};padding:1px 7px;border-radius:var(--radius-full);font-size:10px;font-weight:600">
          ${t.assignedTo==='Admin'?'👤 Admin':'🧑‍💼 '+t.assignedTo}
        </span>
        ${t.notes?`<span style="color:var(--gray-400);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">"${t.notes}"</span>`:''}
      </div>
    </div>
    <span class="pri-badge pri-${t.priority}">${t.priority.toUpperCase()}</span>
    <div onclick="deleteTask(${t.id})" title="Delete" style="flex-shrink:0;cursor:pointer;color:var(--gray-300);font-size:13px;padding:3px 6px;border-radius:4px;margin-left:2px" onmouseenter="this.style.color='var(--red)'" onmouseleave="this.style.color='var(--gray-300)'">✕</div>
  </div>`;

  const section = (title, list, badge, isToday) => list.length === 0 ? '' : `
  <div class="card" style="margin-bottom:14px">
    <div class="card-header">
      <div class="card-title">${title}</div>
      ${badge}
    </div>
    <div class="card-body" style="padding:14px 16px">
      ${list.map(t => taskRow(t, isToday)).join('')}
    </div>
  </div>`;

  const todayBadge    = `<span style="background:var(--navy-50);color:var(--navy-700);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-full)">${todayTasks.length} task${todayTasks.length!==1?'s':''}</span>`;
  const upcomingBadge = `<span style="background:var(--gray-100);color:var(--gray-600);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-full)">${upcomingTasks.length} upcoming</span>`;
  const doneBadge     = `<span style="background:var(--green-50);color:var(--green-700);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-full)">${doneTasks.length} completed</span>`;

  return `
  <div id="tasksPageWrap">
    <div class="page-header">
      <div class="page-header-left" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <h1>Tasks &amp; Follow-Ups</h1>
          <p>${totalOpen} open · ${doneTasks.length} completed</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;font-weight:600;color:var(--gray-500)">Assign:</span>
          <select class="filter-select" onchange="window.TASKS_STATE.agentFilter=this.value;refreshTasksPage()" style="font-size:12px">
            ${agentList.map(n=>`<option value="${n}" ${filterAgent===n?'selected':''}>${n==='All'?'All Assignees':n==='Admin'?'Admin (Tony Ballo)':n}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="font-size:12px" onclick="openTaskModal()">+ New Task (Admin)</button>
        <button class="btn btn-primary" onclick="openTaskModal()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
          Assign to Agent
        </button>
      </div>
    </div>
    ${section('Today — May 1, 2026', todayTasks, todayBadge, true)}
    ${section('Upcoming', upcomingTasks, upcomingBadge, false)}
    ${section('Completed', doneTasks, doneBadge, false)}
    ${totalOpen === 0 && doneTasks.length === 0 ? `<div class="card"><div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No tasks yet</div><div class="empty-sub">Add a task using the button above.</div></div></div>` : ''}
  </div>`;
}

function renderAdminPage() {
  const s = window.ADMIN_STATE;
  const panels = [
    { key:'agents',       label:'Teams & Agents',      icon:'👥' },
    { key:'statuses',     label:'Lead Statuses',        icon:'🏷' },
    { key:'policytypes',  label:'Policy Types',         icon:'📄' },
    { key:'leadsources',  label:'Lead Sources',         icon:'📡' },
    { key:'goals',        label:'Goal Templates',       icon:'🎯' },
    { key:'tiers',        label:'Tier Thresholds',      icon:'⭐' },
    { key:'roles',        label:'Roles & Permissions',  icon:'🔒' },
    { key:'notifs',       label:'Notification Rules',   icon:'🔔' },
    { key:'branding',     label:'Branding',             icon:'🎨' },
    { key:'integrations', label:'Integrations',         icon:'🔗' },
    { key:'auditlog',     label:'Audit Log',            icon:'📋' },
  ];

  const sidebar = `
  <div class="card" style="padding:10px">
    <div style="font-size:9.5px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:1.2px;padding:4px 10px 8px">Configuration</div>
    ${panels.map(p=>`
    <div class="admin-nav-item${s.panel===p.key?' active':''}" onclick="window.ADMIN_STATE.panel='${p.key}';window.ADMIN_STATE.addingAgent=false;refreshAdminPage()">
      <span style="font-size:13px">${p.icon}</span> ${p.label}
    </div>`).join('')}
  </div>`;

  let main = '';

  if (s.panel === 'agents') {
    if (s.addingAgent) {
      main = renderAddAgentForm();
    } else if (s.viewingAgent !== null && s.viewingAgent !== undefined) {
      main = renderAgentProfile(s.viewingAgent);
    } else {
      main = renderAgentList();
    }
  } else if (s.panel === 'goals') {
    main = `<div class="card">
      <div class="card-header"><div class="card-title">Goal Templates</div><button class="btn btn-primary" style="font-size:11.5px">+ New Template</button></div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group"><div class="form-label">App Count Target</div><input class="form-control" type="number" value="20"></div>
          <div class="form-group"><div class="form-label">Broker Fee Target</div><input class="form-control" value="$8,500"></div>
          <div class="form-group"><div class="form-label">Goal Period</div><select class="form-control"><option>Monthly</option><option>Bi-weekly</option><option>Quarterly</option></select></div>
          <div class="form-group"><div class="form-label">Applies To</div><select class="form-control"><option>All Agents</option><option>Team Alpha</option></select></div>
        </div>
        <button class="btn btn-primary" style="font-size:12.5px">Save Template</button>
      </div>
    </div>`;
  } else {
    const labels = { statuses:'Lead Statuses', policytypes:'Policy Types', leadsources:'Lead Sources', tiers:'Tier Thresholds', roles:'Roles & Permissions', notifs:'Notification Rules', branding:'Branding', integrations:'Integrations', auditlog:'Audit Log' };
    main = `<div class="card"><div class="card-body" style="text-align:center;padding:60px 24px">
      <div style="font-size:36px;margin-bottom:12px">${(panels.find(p=>p.key===s.panel)||{}).icon||'🧱'}</div>
      <div class="empty-title">${labels[s.panel]||'Coming Soon'}</div>
      <div class="empty-sub">This configuration panel is coming soon.</div>
    </div></div>`;
  }

  return `
  <div class="page-header">
    <div class="page-header-left"><h1>Settings</h1><p>Admin configuration — manage agents, goals, statuses, and more</p></div>
  </div>
  <div class="admin-layout">${sidebar}${main}</div>`;
}

        ${field('Policy Goal', a.goal+' policies / period')}

        ${field('Goal Period', 'Bi-weekly')}
        ${field('Commission Tier', a.tier+' — '+({'Elite':'40%','Platinum':'35%','Gold':'30%','Silver':'25%','Bronze':'20%'}[a.tier]||'20%'))}
        ${field('Total Fees Collected', '$'+a.fee.toLocaleString())}

          <div>
            <div style="font-weight:700;font-size:13px;color:#991B1B">Danger Zone</div>
            <div style="font-size:11.5px;color:#B91C1C;margin-top:1px">These actions affect this agent's access and data. Proceed with caution.</div>
          </div>
        </div>
        <div style="padding:18px 20px;background:var(--white);display:flex;flex-direction:column;gap:14px">

          <!-- ARCHIVE -->
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md)">

              <div style="font-weight:600;font-size:13px;color:var(--navy-900)">${isArchived?'Restore Agent':'Archive Agent'}</div>

                ${isArchived
                  ? 'Restore this agent\'s access and mark them as active again.'

                }
              </div>
            </div>
            <button class="btn btn-ghost" style="flex-shrink:0;font-size:12.5px;border-color:var(--gray-300);white-space:nowrap"
              onclick="${isArchived?'restoreAgent('+idx+')':'confirmArchiveAgent('+idx+')'}">${isArchived?'Restore Agent':'⏸ Archive Agent'}</button>
          </div>

          <!-- DELETE -->
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid #FCA5A5;border-radius:var(--radius-md);background:#FFFAFA">
            <div>
              <div style="font-weight:600;font-size:13px;color:#991B1B">Delete Agent</div>

        </div>
      </div>

    </div>

  <!-- ARCHIVE CONFIRM MODAL -->
  <div id="archiveModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center">

      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="document.getElementById('archiveModal').style.display='none'">Cancel</button>
        <button class="btn" style="flex:1;justify-content:center;background:var(--navy-800);color:#fff" onclick="archiveAgent(${idx})">Yes, Archive</button>
      </div>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div id="deleteModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.50);z-index:9999;align-items:center;justify-content:center">
    <div style="background:var(--white);border-radius:var(--radius-xl);padding:28px 32px;width:420px;box-shadow:var(--shadow-lg)">
      <div style="font-size:30px;margin-bottom:10px;text-align:center">🗑</div>
      <div style="font-family:var(--font-display);font-size:17px;font-weight:700;color:#991B1B;text-align:center;margin-bottom:8px">Delete ${a.name}?</div>
      <div style="font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:16px;line-height:1.55">This will permanently remove this agent and all of their records. <strong style="color:#991B1B">This action cannot be undone.</strong></div>
      <div style="margin-bottom:18px">
        <div style="font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:6px">Type <strong style="color:var(--navy-900)">${a.name}</strong> to confirm:</div>
        <input id="deleteConfirmInput" class="form-control" placeholder="Full name" oninput="document.getElementById('confirmDeleteBtn').disabled=this.value!=='${a.name}'">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="document.getElementById('deleteModal').style.display='none'">Cancel</button>
        <button id="confirmDeleteBtn" class="btn" style="flex:1;justify-content:center;background:#DC2626;color:#fff;opacity:0.5" disabled onclick="deleteAgent(${idx})">Delete Permanently</button>
      </div>
    </div>
  </div>`;
}

function confirmArchiveAgent(idx) {
  document.getElementById('archiveModal').style.display = 'flex';
}
function confirmDeleteAgent(idx) {
  document.getElementById('deleteModal').style.display = 'flex';
}
function archiveAgent(idx) {
  AGENTS[idx]._archived = true;
  window.ADMIN_STATE.viewingAgent = null;
  window.ADMIN_STATE.successMsg = AGENTS[idx].name + ' has been archived.';
  refreshAdminPage();
}
function restoreAgent(idx) {
  AGENTS[idx]._archived = false;
  window.ADMIN_STATE.viewingAgent = null;
  window.ADMIN_STATE.successMsg = AGENTS[idx].name + ' has been restored.';
  refreshAdminPage();
}
function deleteAgent(idx) {
  const name = AGENTS[idx].name;
  AGENTS.splice(idx, 1);
  window.ADMIN_STATE.viewingAgent = null;
  window.ADMIN_STATE.successMsg = name + ' has been permanently deleted.';
  refreshAdminPage();
}

function clearAgentError() {
  if (window.ADMIN_STATE.agentError) {
    window.ADMIN_STATE.agentError = '';
    const errEl = document.querySelector('#agentFormError');
    if (errEl) errEl.style.display = 'none';
  }
}

function submitAddAgent() {
  const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const required = [
    ['af_first',      'First Name'],
    ['af_last',       'Last Name'],
    ['af_email',      'Email Address'],
    ['af_phone',      'Phone Number'],
    ['af_npn',        'NPN'],
    ['af_lic',        'License Number'],
    ['af_licstate',   'License State(s)'],
    ['af_licexp',     'License Expiration Date'],
    ['af_eo',         'E&O Insurance Carrier'],
    ['af_eoexp',      'E&O Expiration Date'],
    ['af_loginemail', 'Login Email'],
    ['af_pass',       'Temporary Password'],
    ['af_pass2',      'Confirm Password'],
    ['af_start',      'Start Date'],
    ['af_pgoal',      'Policy Goal'],
  ];
  for (const [id, label] of required) {
    if (!get(id)) {
      window.ADMIN_STATE.agentError = `⚠ "${label}" is required.`;
      refreshAdminPage();
      document.querySelector('.card-body').scrollTop = 0;
      return;
    }
  }
  if (get('af_pass') !== get('af_pass2')) {
    window.ADMIN_STATE.agentError = '⚠ Passwords do not match.';
    refreshAdminPage();
    return;
  }
  if (get('af_pass').length < 8) {
    window.ADMIN_STATE.agentError = '⚠ Password must be at least 8 characters.';
    refreshAdminPage();
    return;
  }
  const newAgent = {
    name: get('af_first') + ' ' + get('af_last'),
    apps: 0, goal: parseInt(get('af_pgoal')) || 20,
    fee: 0, feeGoal: 8000, premium: 0,
    tier: 'Bronze', close: '0%', contact: '0%', leads: 0,
    rank: AGENTS.length + 1
  };
  AGENTS.push(newAgent);
  window.ADMIN_STATE.addingAgent = false;
  window.ADMIN_STATE.agentError = '';
  window.ADMIN_STATE.successMsg = get('af_first') + ' ' + get('af_last');
  refreshAdminPage();
}

function refreshAdminPage() {
  const c = document.getElementById('content');
  if (!c) return;
  c.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'page-content';
  div.innerHTML = renderAdminPage();
  c.appendChild(div);
  if (window.ADMIN_STATE.successMsg) {
    const msg = window.ADMIN_STATE.successMsg;
    window.ADMIN_STATE.successMsg = '';
    const isDelete = msg.includes('deleted');
    const isArchive = msg.includes('archived') || msg.includes('restored');
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:24px;right:28px;background:'+(isDelete?'#DC2626':isArchive?'var(--navy-800)':'var(--green-700)')+';color:#fff;padding:13px 20px;border-radius:var(--radius-lg);box-shadow:0 6px 24px rgba(0,0,0,0.25);font-weight:600;font-size:13px;z-index:9999;animation:fadeSlideIn 0.25s ease';
      banner.textContent = '✓ ' + (isDelete||isArchive ? msg : 'Agent "'+msg+'" has been added.');
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 3500);
    }, 50);
  }
}

window.PAGE_INIT = window.PAGE_INIT || {};
window.PAGE_INIT.admin = function() { refreshAdminPage(); };

// ==================== TAB SWITCHER ====================
function switchTab(el, targetId) {
  el.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('[id]').forEach(el => {
    if (el.id && el.id !== targetId && (el.id.startsWith('dash-') || el.id.startsWith('rpt-') || el.id.startsWith('fin-'))) {
      el.style.display = 'none';
    }
  });
  const target = document.getElementById(targetId);
  if (target) target.style.display = '';
}

// ==================== DARK MODE ====================
function toggleDark() {
  const isDark = document.body.classList.toggle('dark-mode');
  document.getElementById('darkToggle').classList.toggle('on', isDark);
  document.getElementById('darkKnob').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('maxsave-dark', isDark ? '1' : '0');
}

window.addEventListener('DOMContentLoaded', () => {
  nav('dashboard', document.querySelector('.nav-item'));
  if (localStorage.getItem('maxsave-dark') === '1') {
    document.body.classList.add('dark-mode');
    document.getElementById('darkToggle').classList.add('on');
    document.getElementById('darkKnob').textContent = '🌙';
  }
});
</script>
