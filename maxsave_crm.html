          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81 19.79 19.79 0 01.02 2.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z" stroke-linecap="round" stroke-linejoin="round"/></svg>Call
        </button>
        <button onclick="openTextThread('${c.first} ${c.last}','${c.phone}')" style="display:flex;align-items:center;gap:6px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.35);border-radius:8px;padding:10px 22px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body)">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>Text
        </button>
        <button onclick="alert('Email: ${c.email||'—'}')" style="display:flex;align-items:center;gap:6px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.35);border-radius:8px;padding:10px 22px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body)">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke-linecap="round" stroke-linejoin="round"/><polyline points="22,6 12,13 2,6"/></svg>Email
        </button>
      </div>
    </div>

    <!-- KPI STRIP -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
      <div class="kpi-card accent"><div class="kpi-label">Lifetime Premium</div><div class="kpi-value" style="font-size:20px">${fmtK(customerLifetimeValue(c))}</div><div class="kpi-sub">${c.policies.length} policies</div></div>
      <div class="kpi-card accent"><div class="kpi-label">Lifetime Fees</div><div class="kpi-value green" style="font-size:20px">${fmtK(customerLifetimeFee(c))}</div><div class="kpi-sub">Agency revenue</div></div>
      <div class="kpi-card ${openBal>0?'accent-red':'accent'}"><div class="kpi-label">Open Balance</div><div class="kpi-value ${openBal>0?'red':'green'}" style="font-size:20px">${openBal>0?fmt$(openBal):'$0'}</div><div class="kpi-sub">${openBal>0?'Outstanding':'All paid up'}</div></div>
      <div class="kpi-card accent-amber"><div class="kpi-label">Days to Renewal</div><div class="kpi-value amber" style="font-size:20px">${daysToRenewal(c)===null?'&mdash;':daysToRenewal(c)+'d'}</div><div class="kpi-sub">${activePol?'Expires '+activePol.expires:'No active policy'}</div></div>
    </div>

    <!-- DISPOSITION BAR -->
    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-size:10.5px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.9px;white-space:nowrap">Disposition</div>
      <select id="custDisposition" style="flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13.5px;font-family:var(--font-body);color:var(--navy-900);background:#fff;cursor:pointer">
        <option>Active Customer</option>
        <option>Follow-up needed</option>
        <option>Renewal soon</option>
        <option>Payment issue</option>
        <option>At-risk / Potential cancel</option>
        <option>Re-shop in progress</option>
        <option>VIP / High value</option>
        <option>Cancelled</option>
      </select>
      <button class="btn btn-primary" style="font-size:13px;padding:9px 22px;font-weight:700" onclick="alert('Disposition updated!')">Update</button>
    </div>

    <!-- COMMUNICATION TABS -->
    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
      <div style="display:flex;border-bottom:2px solid var(--border);background:var(--gray-50);padding:0 4px">
        <button id="cdBtn-cd-calls" onclick="cdTab('cd-calls')" style="padding:12px 18px;border:none;background:transparent;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--navy-900);border-bottom:2.5px solid var(--navy-900);font-family:var(--font-body);margin-bottom:-2px;transition:all 0.15s">
          Call Log <span style="font-size:11px;background:#E0E7FF;color:#3730A3;padding:1px 7px;border-radius:var(--radius-full);margin-left:5px;font-weight:700">3</span>
        </button>
        <button id="cdBtn-cd-text" onclick="cdTab('cd-text')" style="padding:12px 18px;border:none;background:transparent;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--gray-500);border-bottom:2.5px solid transparent;font-family:var(--font-body);margin-bottom:-2px;transition:all 0.15s">
          Text / SMS <span style="font-size:11px;background:var(--gray-100);color:var(--gray-500);padding:1px 7px;border-radius:var(--radius-full);margin-left:5px;font-weight:700">5</span>
        </button>
        <button id="cdBtn-cd-notes" onclick="cdTab('cd-notes')" style="padding:12px 18px;border:none;background:transparent;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--gray-500);border-bottom:2.5px solid transparent;font-family:var(--font-body);margin-bottom:-2px;transition:all 0.15s">
          Notes <span style="font-size:11px;background:var(--gray-100);color:var(--gray-500);padding:1px 7px;border-radius:var(--radius-full);margin-left:5px;font-weight:700">2</span>
        </button>
      </div>

      <!-- CALL LOG -->
      <div id="cd-calls">
        ${callLog.map(cl => `
        <div style="display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--border)">
          <div style="width:38px;height:38px;border-radius:50%;background:${cl.ok?'#dcfce7':'var(--gray-100)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="15" height="15" fill="none" stroke="${cl.ok?'#15803d':'#9ca3af'}" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81 19.79 19.79 0 01.02 2.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
              <span style="font-size:11.5px;font-weight:700;background:${cl.db};color:${cl.dc};padding:3px 10px;border-radius:var(--radius-full)">${cl.disp}</span>
              <span style="font-size:13px;font-weight:600;color:var(--navy-900)">${cl.agent}</span>
              <span style="font-size:12px;color:var(--gray-400);font-family:monospace">${cl.dur}</span>
            </div>
            <div style="font-size:12px;color:var(--gray-400)">${cl.ts}</div>
          </div>
          <button style="font-size:11.5px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 14px;cursor:pointer;color:var(--navy-700);font-weight:700;font-family:var(--font-body);flex-shrink:0">Transcript</button>
        </div>`).join('')}
      </div>

      <!-- TEXT/SMS -->
      <div id="cd-text" style="display:none">
        <div style="padding:20px;display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto">
          <div style="display:flex;justify-content:flex-start"><div style="max-width:60%;background:var(--gray-100);border-radius:14px 14px 14px 3px;padding:11px 15px"><div style="font-size:10.5px;font-weight:700;color:var(--gray-400);margin-bottom:4px">${c.first} ${c.last} &middot; Jul 27, 10:15 AM</div><div style="font-size:13.5px;color:var(--navy-900);line-height:1.5">Ok, I will call you back this morning.</div></div></div>
          <div style="display:flex;justify-content:flex-end"><div style="max-width:60%;background:var(--blue);border-radius:14px 14px 3px 14px;padding:11px 15px"><div style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:4px">Sarah Kim &middot; Jul 26, 4:52 PM</div><div style="font-size:13.5px;color:#fff;line-height:1.5">Hi ${c.first}! Just a reminder &mdash; your renewal is coming up soon. Let me know if you have any questions. &#128522;</div></div></div>
          <div style="display:flex;justify-content:flex-start"><div style="max-width:60%;background:var(--gray-100);border-radius:14px 14px 14px 3px;padding:11px 15px"><div style="font-size:10.5px;font-weight:700;color:var(--gray-400);margin-bottom:4px">${c.first} ${c.last} &middot; Jul 25, 2:10 PM</div><div style="font-size:13.5px;color:var(--navy-900);line-height:1.5">Sounds good, thank you!</div></div></div>
          <div style="display:flex;justify-content:flex-end"><div style="max-width:60%;background:var(--blue);border-radius:14px 14px 3px 14px;padding:11px 15px"><div style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:4px">Sarah Kim &middot; Jul 25, 12:30 PM</div><div style="font-size:13.5px;color:#fff;line-height:1.5">Hi ${c.first}, this is Sarah from MSIHub. Your policy is coming up for renewal. Can we find a few minutes to connect?</div></div></div>
        </div>
        <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end">
          <textarea style="flex:1;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-md);font-family:var(--font-body);font-size:13.5px;resize:none;height:60px;color:var(--navy-900)" placeholder="Type a message&hellip;"></textarea>
          <button class="btn btn-primary" style="padding:10px 22px;font-weight:700;font-size:13px">Send</button>
        </div>
      </div>

      <!-- NOTES -->
      <div id="cd-notes" style="display:none;padding:16px 20px">
        <textarea id="cdNoteInput" style="width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-md);font-family:var(--font-body);font-size:13.5px;resize:vertical;height:76px;color:var(--navy-900);margin-bottom:8px" placeholder="Add a note about this customer&hellip;"></textarea>
        <button class="btn btn-primary" style="font-weight:700;font-size:13px;padding:9px 20px;margin-bottom:16px" onclick="alert('Note saved!')">+ Save Note</button>
        <div style="display:flex;flex-direction:column;gap:9px">
          <div style="padding:13px 15px;background:var(--gray-50);border-radius:var(--radius-md);border-left:3px solid var(--green-500)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="font-size:13px;font-weight:700;color:var(--navy-900)">Sarah Kim</div><div style="font-size:11px;color:var(--gray-400)">Jul 27, 10:30 AM</div></div>
            <div style="font-size:13px;color:var(--gray-700);line-height:1.55">Customer asked about bundling renters. Follow up on whether they rent or own &mdash; possible opportunity. Getting good engagement on calls.</div>
          </div>
          <div style="padding:13px 15px;background:var(--gray-50);border-radius:var(--radius-md);border-left:3px solid var(--blue)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="font-size:13px;font-weight:700;color:var(--navy-900)">Marcus Rivera</div><div style="font-size:11px;color:var(--gray-400)">Jul 20, 11:15 AM</div></div>
            <div style="font-size:13px;color:var(--gray-700);line-height:1.55">Renewal discussed. Customer happy with current rate. Mentioned potentially adding spouse as a driver before next renewal.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOM INFO GRID: 3 columns -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start">

      <!-- COL 1: Customer Info -->
      <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
        ${secHdr('Customer Info','<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px">&#9998; Edit</button>')}
        ${infoRow('First Name', c.first)}
        ${infoRow('Last Name', c.last)}
        ${infoRow('Phone Number', c.phone)}
        ${infoRow('Email', c.email||'—')}
        ${infoRow('Gender', c.gender)}
        ${infoRow('Marital Status', c.marital)}
        ${infoRow('Date of Birth', c.dob+' &middot; age '+c.age)}
        ${infoRow('Street', c.address)}
        ${infoRow('City', c.city)}
        ${infoRow('State', c.state)}
        ${infoRow('ZIP Code', c.zip)}
        ${infoRow('License', c.license)}
        ${infoRow('Language', c.language)}
        ${infoRow('SR-22 Required', c.sr22?'<span style="color:var(--red);font-weight:700">Yes &#8212; On File</span>':'No')}
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border)">
          <div style="font-size:10.5px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.7px">Social Security</div>
          <button style="font-size:11px;background:var(--navy-50);color:var(--navy-700);border:1px solid #C3D6E8;border-radius:var(--radius-md);padding:4px 11px;cursor:pointer;font-weight:700;font-family:var(--font-body)">Request Securely</button>
        </div>
        ${infoRow('Assigned Agent', c.agent)}
        ${infoRow('Billing', c.paymentMethod)}
        ${infoRow('Autopay', c.autopay?'<span style="color:var(--green-700);font-weight:700">&#10003; On</span>':'Off')}
        ${infoRow('Customer Since', c.customerSince, true)}
      </div>

      <!-- COL 2: Vehicles + Drivers -->
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
          ${secHdr('Vehicles ('+c.vehicles.length+')','<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px">+ Add</button>')}
          ${c.vehicles.map((v,i) => `
          <div style="padding:12px 16px;${i<c.vehicles.length-1?'border-bottom:1px solid var(--border)':''}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div style="font-size:13.5px;font-weight:700;color:var(--navy-900)">${v.year} ${v.make} ${v.model}</div>
              <span style="font-size:9.5px;font-weight:700;background:var(--navy-50);color:var(--navy-700);padding:2px 8px;border-radius:var(--radius-full)">VEH ${i+1}</span>
            </div>
            ${infoRow('VIN','<span style="font-family:monospace;font-size:11.5px">'+v.vin+'</span>')}
            ${infoRow('Garaging ZIP',v.garaging)}
            ${infoRow('Primary Use',v.use)}
            ${infoRow('Est. Value',fmt$(v.value))}
            ${v.lien?infoRow('Lienholder',v.lien,true):infoRow('Lienholder','—',true)}
          </div>`).join('')}
        </div>

        <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
          ${secHdr('Drivers ('+c.drivers.length+')','<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px">+ Add</button>')}
          ${c.drivers.map((d,i) => `
          <div style="padding:12px 16px;${i<c.drivers.length-1?'border-bottom:1px solid var(--border)':''};${d.primary?'border-left:3px solid var(--green-500)':''}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div style="font-size:13.5px;font-weight:700;color:var(--navy-900)">${d.name}</div>
              <span style="font-size:9.5px;font-weight:700;background:${d.primary?'var(--green-50)':'var(--gray-100)'};color:${d.primary?'var(--green-700)':'var(--gray-500)'};padding:2px 9px;border-radius:var(--radius-full);border:1px solid ${d.primary?'var(--green-200)':'var(--border)'}">${d.primary?'PRIMARY':'ADDITIONAL'}</span>
            </div>
            ${infoRow('Date of Birth',d.dob)}
            ${infoRow('Gender',d.gender)}
            ${infoRow('License',d.license)}
            ${infoRow('Violations',d.violations,true)}
          </div>`).join('')}
        </div>
      </div>

      <!-- COL 3: Policies + Files -->
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
          ${secHdr('Policies ('+c.policies.length+')','<span style="font-size:11px;color:var(--gray-400)">All-time</span>')}
          ${c.policies.map((p,i) => {
            const bal = customerBalance(p);
            const sc = p.status==='Active'?'#3BAA47':(p.status==='Cancelled'||p.status==='Voided')?'#EF4444':'#F59E0B';
            const isActive = p.status === 'Active';
            const canVoid = isActive && p.saleTimestamp && (Date.now() - new Date(p.saleTimestamp).getTime() < 86400000);
            return `<div style="padding:12px 16px;${i<c.policies.length-1?'border-bottom:1px solid var(--border)':''}">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <div style="font-size:13.5px;font-weight:700;color:var(--navy-900)">${p.carrier} <span style="font-size:11.5px;color:var(--gray-400);font-weight:400">&middot; ${p.line}</span></div>
                <span style="font-size:10px;font-weight:700;background:${sc}22;color:${sc};padding:2px 9px;border-radius:var(--radius-full);border:1px solid ${sc}55">${p.status}</span>
              </div>
              ${infoRow('Policy #','<span style="font-family:monospace;font-size:11.5px">'+p.number+'</span>')}
              ${infoRow('Period',p.effective+' &rarr; '+p.expires)}
              ${infoRow('Annual Premium',fmt$(p.premium))}
              ${infoRow('Fee Collected',fmt$(p.feeCollected))}
              ${infoRow('Balance',bal>0?'<span style="color:var(--red);font-weight:700">'+fmt$(bal)+'</span>':'<span style="color:var(--green-700);font-weight:700">$0.00</span>',true)}
              ${isActive ? `<div style="display:flex;gap:8px;padding:10px 0 2px">
                ${canVoid ? `<button onclick="voidPolicy('${escAttr(c.id)}','${escAttr(p.number)}')" style="flex:1;padding:7px 0;font-size:11.5px;font-weight:700;font-family:var(--font-body);background:#FEF2F2;color:#DC2626;border:1.5px solid #FECACA;border-radius:var(--radius-md);cursor:pointer">&#128683; Void</button>` : ''}
                <button onclick="cancelPolicy('${escAttr(c.id)}','${escAttr(p.number)}')" style="flex:1;padding:7px 0;font-size:11.5px;font-weight:700;font-family:var(--font-body);background:#FFF7ED;color:#C2410C;border:1.5px solid #FED7AA;border-radius:var(--radius-md);cursor:pointer">&#10006; Cancel Policy</button>
              </div>` : ''}
            </div>`;
          }).join('')}
          <div style="padding:12px 16px;background:var(--gray-50);border-top:1px solid var(--border);display:flex;gap:22px">
            <div><div style="font-size:9.5px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Total Collected</div><div style="font-size:17px;font-weight:800;color:var(--green-700);font-family:var(--font-display)">${fmt$(totalCollected)}</div></div>
            <div><div style="font-size:9.5px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Open Balance</div><div style="font-size:17px;font-weight:800;color:${openBal>0?'var(--red)':'var(--green-700)'};font-family:var(--font-display)">${openBal>0?fmt$(openBal):'$0.00'}</div></div>
          </div>
        </div>

        <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
          ${secHdr('Customer Files','<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="openCustomerFolder()">&#128193; Open Folder</button>')}
          <div style="padding:12px 16px">
            <div id="customerFilesList">
              ${c.files.map(f=>`
              <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-md);background:var(--gray-50);border:1px solid var(--border);margin-bottom:7px">
                <div style="font-size:17px">${fileIcon(f)}</div>
                <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;color:var(--navy-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f}</div></div>
                <div class="tbl-icon-btn" title="Download">&#8595;</div>

function calendarNeedsFollowUp(a) {
  if (a.sold) return false;
  if (a.status === 'No-Show') return true;
  if (a.status === 'Quoted' && a.daysSinceContact >= 2) return true;
  if (a.daysSinceContact >= 3) return true;
  return false;
}

}

  const cells = [];

function liveStatusLabel(s) {
  return ({ 'available':'Available', 'on-call':'On Call', 'dnd':'Do Not Disturb', 'wrap-up':'Wrap-Up', 'offline':'Offline' })[s] || s;
}

  const c = document.getElementById('content'); if (!c) return;

  c.appendChild(div);
}

// Drag handlers for live call transfer
window._dragCallFrom = null;
function onAgentCallDragStart(ev, agentName) {
  window._dragCallFrom = agentName;
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', agentName); } catch(_) {}
  ev.currentTarget.style.opacity = '0.5';
}
function onAgentCallDragEnd(ev) {
  ev.currentTarget.style.opacity = '';
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('dragover'));
}
function onTransferDrop(ev, type, target) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const fromName = window._dragCallFrom || (ev.dataTransfer && ev.dataTransfer.getData('text/plain'));
  if (!fromName) return;
  const fromAgent = window.AGENT_LIVE.find(a => a.name === fromName);
  const isLoggedIn = fromAgent && fromAgent.name === window.LIVEVIEW_STATE.loggedInAgent;
  if (!fromAgent || (fromAgent.status !== 'on-call' && !isLoggedIn)) return;
  if (type === 'all-extensions') {
    alert('📡 Broadcasting ' + fromAgent.leadName + ' to all extensions…');
    fromAgent.status = 'wrap-up'; fromAgent.callDuration = 0; fromAgent.leadName = null; fromAgent.leadPhone = null; fromAgent.callDirection = null;
  } else if (type === 'agent') {
    const toAgent = window.AGENT_LIVE.find(a => a.name === target);
    if (toAgent) {
      alert('↪ Transferring ' + fromAgent.leadName + ' to ' + toAgent.name + ' (Ext ' + toAgent.ext + ')');
      // simulate the transfer
      toAgent.status = 'on-call';
      toAgent.callDuration = 1;
      toAgent.callDirection = fromAgent.callDirection;
      toAgent.leadName = fromAgent.leadName;
      toAgent.leadPhone = fromAgent.leadPhone;
      fromAgent.status = 'wrap-up'; fromAgent.callDuration = 0; fromAgent.leadName = null; fromAgent.leadPhone = null; fromAgent.callDirection = null;
    }
  } else if (type === 'park') {
    const slotIdx = target;
    const time = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    window.LIVEVIEW_STATE.parkingLot[slotIdx] = { lead: fromAgent.leadName, phone: fromAgent.leadPhone, parkedAt: time };
    alert('🅿 ' + fromAgent.leadName + ' parked in slot ' + (slotIdx+1));
    fromAgent.status = 'wrap-up'; fromAgent.callDuration = 0; fromAgent.leadName = null; fromAgent.leadPhone = null; fromAgent.callDirection = null;
  }
  window._dragCallFrom = null;
  refreshLiveView();
}
function retrieveParkedCall(idx) {
  const slot = window.LIVEVIEW_STATE.parkingLot[idx];
  if (!slot) return;
  const me = window.AGENT_LIVE.find(a => a.name === window.LIVEVIEW_STATE.loggedInAgent);
  if (!me) return;
  me.status = 'on-call';
  me.callDuration = 1;
  me.callDirection = 'outbound';
  me.leadName = slot.lead;
  me.leadPhone = slot.phone;
  window.LIVEVIEW_STATE.parkingLot[idx] = null;
  alert('▶ Retrieved ' + slot.lead + ' from parking');
  refreshLiveView();
}

    const days = window.CONVERSATIONS[phone];

    let lastDay = '';
    for (let i = days.length - 1; i >= 0; i--) {
      if (days[i].msgs.length > 0) {
        lastMsg = days[i].msgs[days[i].msgs.length - 1];
        lastDay = days[i].date;
        break;

    let name = 'Unknown';

    if (fromAppt) name = fromAppt.lead;
    else if (fromLead) name = fromLead.name;
    else if (fromCall) name = fromCall.contact;
    const unread = (window.UNREAD_THREADS || new Set()).has(phone);
    return { phone, name, lastMsg, lastDay, unread };
  }).filter(Boolean);
  // Sort: unread first, then most recent
  threadList.sort((a,b) => {
    if (a.unread !== b.unread) return a.unread ? -1 : 1;
    if (a.lastDay !== b.lastDay) return a.lastDay === 'Today' ? -1 : 1;
    return 0;
  });
  const unreadTexts = threadList.filter(t => t.unread).length;

  // Filter by search
  const q = s.search.toLowerCase();
  const filteredCalls   = !q ? myCalls   : myCalls.filter(c => c.contact.toLowerCase().includes(q) || c.phone.includes(q));
  const filteredThreads = !q ? threadList: threadList.filter(t => t.name.toLowerCase().includes(q) || t.phone.includes(q) || (t.lastMsg.text||'').toLowerCase().includes(q));
  const filteredEmails  = !q ? myEmails  : myEmails.filter(e => e.from.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q) || e.preview.toLowerCase().includes(q));

  return `
  <div class="page-header">
    <div class="page-header-left">
      <h1>📬 Inbox</h1>
      <p>${myCalls.length} calls · ${threadList.length} text threads · ${myEmails.length} emails · ${unreadTexts + unreadEmails} unread</p>
    </div>
    <div class="btn-group">
      <input class="filter-select" placeholder="Search across all comms…" value="${s.search}" oninput="window.INBOX_STATE.search=this.value;refreshInbox()" style="font-family:var(--font-body);min-width:240px;font-size:13px">
      <select class="filter-select" style="font-family:var(--font-body);font-size:13px" onchange="window.INBOX_STATE.dateRange=this.value;refreshInbox()">
        <option ${s.dateRange==='Today'?'selected':''}>Today</option>
        <option ${s.dateRange==='Yesterday'?'selected':''}>Yesterday</option>
        <option ${s.dateRange==='Week'?'selected':''}>This Week</option>
        <option ${s.dateRange==='Month'?'selected':''}>This Month</option>
        <option ${s.dateRange==='All'?'selected':''}>All</option>
      </select>
      <button class="btn btn-ghost">🔇 Mark All Read</button>
      <button class="btn btn-primary">✏ Compose</button>
    </div>
  </div>

  <!-- STATS ROW -->
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi-card accent"><div class="kpi-label">Calls Today</div><div class="kpi-value">${myCalls.filter(c=>c.date==='Today').length}</div><div class="kpi-sub">${myCalls.filter(c=>c.date==='Today' && c.recording).length} recordings</div></div>
    <div class="kpi-card accent-red"><div class="kpi-label">Missed Calls</div><div class="kpi-value red">${missedCalls}</div><div class="kpi-sub">Need callback</div></div>
    <div class="kpi-card accent-navy"><div class="kpi-label">Unread Texts</div><div class="kpi-value">${unreadTexts}</div><div class="kpi-sub">${threadList.length} active threads</div></div>
    <div class="kpi-card accent-amber"><div class="kpi-label">Unread Emails</div><div class="kpi-value amber">${unreadEmails}</div><div class="kpi-sub">${myEmails.filter(e=>e.priority==='high').length} marked high priority</div></div>
  </div>

  <!-- TABS — blue bar -->
  <div style="display:flex;gap:2px;background:#1A6ED0;border-radius:var(--radius-lg);padding:3px;width:fit-content;margin-bottom:16px;box-shadow:0 2px 8px rgba(26,110,208,0.25)">
    <div onclick="setInboxTab('Calls')" style="padding:7px 20px;border-radius:var(--radius-md);cursor:pointer;font-size:14px;font-weight:${s.tab==='Calls'?'700':'500'};color:${s.tab==='Calls'?'#1A6ED0':'rgba(255,255,255,0.85)'};background:${s.tab==='Calls'?'#fff':'transparent'};transition:all 0.15s;user-select:none;display:flex;align-items:center;gap:6px">
      📞 Calls <span style="background:${s.tab==='Calls'?'#EFF6FF':'rgba(255,255,255,0.22)'};color:${s.tab==='Calls'?'#1A6ED0':'#fff'};padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700">${myCalls.length}</span>
    </div>
    <div onclick="setInboxTab('Texts')" style="padding:7px 20px;border-radius:var(--radius-md);cursor:pointer;font-size:14px;font-weight:${s.tab==='Texts'?'700':'500'};color:${s.tab==='Texts'?'#1A6ED0':'rgba(255,255,255,0.85)'};background:${s.tab==='Texts'?'#fff':'transparent'};transition:all 0.15s;user-select:none;display:flex;align-items:center;gap:6px">
      💬 Texts <span style="background:${unreadTexts>0?(s.tab==='Texts'?'#FEE2E2':'rgba(255,255,255,0.22)'):(s.tab==='Texts'?'#EFF6FF':'rgba(255,255,255,0.22)')};color:${unreadTexts>0?(s.tab==='Texts'?'var(--red)':'#fff'):(s.tab==='Texts'?'#1A6ED0':'#fff')};padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700">${threadList.length}${unreadTexts?' · '+unreadTexts:''}</span>
    </div>
    <div onclick="setInboxTab('Emails')" style="padding:7px 20px;border-radius:var(--radius-md);cursor:pointer;font-size:14px;font-weight:${s.tab==='Emails'?'700':'500'};color:${s.tab==='Emails'?'#1A6ED0':'rgba(255,255,255,0.85)'};background:${s.tab==='Emails'?'#fff':'transparent'};transition:all 0.15s;user-select:none;display:flex;align-items:center;gap:6px">
      📧 Emails <span style="background:${unreadEmails>0?(s.tab==='Emails'?'#FEE2E2':'rgba(255,255,255,0.22)'):(s.tab==='Emails'?'#EFF6FF':'rgba(255,255,255,0.22)')};color:${unreadEmails>0?(s.tab==='Emails'?'var(--red)':'#fff'):(s.tab==='Emails'?'#1A6ED0':'#fff')};padding:1px 8px;border-radius:var(--radius-full);font-size:10.5px;font-weight:700">${myEmails.length}${unreadEmails?' · '+unreadEmails:''}</span>
    </div>
  </div>

  ${s.tab === 'Calls' ? renderInboxCalls(filteredCalls, s.callFilter) :
    s.tab === 'Texts' ? renderInboxTexts(filteredThreads, s.textFilter, s.textThread) :
                        renderInboxEmails(filteredEmails)}
  `;
}

function renderInboxCalls(calls, callFilter) {
  callFilter = callFilter || 'All';
  let filtered = calls;
  if (callFilter === 'Inbound')  filtered = calls.filter(h => h.direction === 'inbound');
  if (callFilter === 'Outbound') filtered = calls.filter(h => h.direction === 'outbound');
  if (callFilter === 'Missed')   filtered = calls.filter(h => h.status === 'missed');

  const chipStyle = (active) => `padding:5px 16px;border-radius:var(--radius-full);border:none;cursor:pointer;font-size:12.5px;font-weight:600;font-family:var(--font-body);transition:all 0.15s;background:${active?'#1A6ED0':'var(--gray-100)'};color:${active?'#fff':'var(--gray-600)'}`;
  const filterBar = `
  <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--gray-50)">
    <span style="font-size:12px;font-weight:600;color:var(--gray-500)">Filter:</span>
    <button onclick="window.INBOX_STATE.callFilter='All';refreshInbox()"      style="${chipStyle(callFilter==='All')}">All <span style="opacity:0.7;font-size:11px">(${calls.length})</span></button>
    <button onclick="window.INBOX_STATE.callFilter='Inbound';refreshInbox()"  style="${chipStyle(callFilter==='Inbound')}">↙ Inbound</button>
    <button onclick="window.INBOX_STATE.callFilter='Outbound';refreshInbox()" style="${chipStyle(callFilter==='Outbound')}">↗ Outbound</button>
    <button onclick="window.INBOX_STATE.callFilter='Missed';refreshInbox()"   style="${chipStyle(callFilter==='Missed')}">⚠ Missed <span style="opacity:0.7;font-size:11px">(${calls.filter(h=>h.status==='missed').length})</span></button>
  </div>`;

  if (filtered.length === 0) return `<div class="card">${filterBar}<div class="empty"><div class="empty-icon">📞</div><div class="empty-title">No calls match</div></div></div>`;
  return `
  <div class="card">
    ${filterBar}
    <table class="data-table">
      <thead><tr><th>Time</th><th>Direction</th><th>Contact</th><th>Phone</th><th>Duration</th><th>Outcome</th><th>Recording</th><th>Transcript</th><th>Actions</th></tr></thead>
      <tbody>
        ${filtered.map(h => {
          const dirIco = h.direction === 'outbound' ? '↗ Outbound' : '↙ Inbound';
          const dirCol = h.direction === 'outbound' ? 'var(--green-700)' : '#0E2340';
          const statusCol = h.status === 'connected' ? 'var(--green-700)' : h.status === 'missed' ? 'var(--red)' : 'var(--gray-500)';
          const safeName = h.contact.replace(/'/g,"\\'");
          return `<tr>
            <td><div style="font-weight:600;font-size:13px">${h.time}</div><div style="font-size:11px;color:var(--gray-400)">${h.date}</div></td>
            <td><span style="font-size:11.5px;font-weight:700;color:${dirCol}">${dirIco}</span></td>
            <td><div class="lead-name-link" onclick="nav('leaddetail',null)" style="font-weight:700;color:var(--navy-900);cursor:pointer;font-size:13.5px">${h.contact}</div></td>
            <td style="font-size:12.5px;color:var(--gray-600);font-family:monospace">${h.phone}</td>
            <td style="font-family:var(--font-display);font-weight:700;color:${statusCol}">${h.duration > 0 ? fmtCallDuration(h.duration) : '—'}</td>
            <td><span style="font-size:11.5px;font-weight:700;color:${statusCol}">${h.outcome}</span></td>
            <td>${h.recording?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:4px 11px" onclick="playRecording('${safeName}')">▶ Play</button>`:'<span style="color:var(--gray-300);font-size:11px">—</span>'}</td>
            <td>${h.recording?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:4px 11px" onclick="viewTranscript('${safeName}')">📄 View</button>`:'<span style="color:var(--gray-300);font-size:11px">—</span>'}</td>
            <td>
              <div style="display:flex;gap:5px">
                <button type="button" title="Call back" onclick="doCall('${safeName}')" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--green-200);background:var(--green-50);cursor:pointer;font-size:13px">📞</button>
                <button type="button" title="Text" onclick="openTextThread('${safeName}','${h.phone}')" style="width:30px;height:30px;border-radius:6px;border:1px solid #C3D6E8;background:var(--blue-light);cursor:pointer;font-size:13px">💬</button>
                <button type="button" title="View profile" onclick="nav('leaddetail',null)" style="width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--gray-50);cursor:pointer;font-size:13px">👁</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

function renderInboxTexts(threads, textFilter, selectedPhone) {
  textFilter = textFilter || 'All';

  let displayThreads = textFilter === 'Unanswered' ? threads.filter(t => t.unread) : threads;

  // Build flat message list for selected thread
  let flatMessages = [];
  let selectedContact = null;
  if (selectedPhone) {
    selectedContact = threads.find(t => t.phone === selectedPhone) || null;
    const conv = window.CONVERSATIONS[selectedPhone] || [];
    for (const day of conv) {
      for (const msg of day.msgs) {
        flatMessages.push({ direction: msg.from === 'us' ? 'outbound' : 'inbound', text: msg.text, time: msg.time });
      }
    }
  }

  const safeSelPhone = (selectedPhone || '').replace(/[^0-9]/g,'');

  return `
  <div class="card" style="overflow:hidden">
    <!-- Filter bar -->
    <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--gray-50)">
      <span style="font-size:12px;font-weight:600;color:var(--gray-500)">Show:</span>
      <button onclick="window.INBOX_STATE.textFilter='All';refreshInbox()"         style="${chipStyle(textFilter==='All')}">All Texts <span style="opacity:0.7;font-size:11px">(${threads.length})</span></button>
      <button onclick="window.INBOX_STATE.textFilter='Unanswered';refreshInbox()"  style="${chipStyle(textFilter==='Unanswered')}">Unanswered <span style="opacity:0.7;font-size:11px">(${threads.filter(t=>t.unread).length})</span></button>
    </div>
    <!-- Two-panel split -->
    <div style="display:grid;grid-template-columns:290px 1fr;height:560px;overflow:hidden">

      <!-- LEFT: conversation list -->
      <div style="border-right:1px solid var(--border);overflow-y:auto;background:var(--gray-50)">
        ${displayThreads.length === 0 ? `<div style="padding:40px 20px;text-align:center;color:var(--gray-400);font-size:13px">No conversations</div>` :
          displayThreads.map(t => {
            const isSel = t.phone === selectedPhone;
            const isInbound = t.lastMsg.from === 'them';
            return `
            <div onclick="window.INBOX_STATE.textThread='${t.phone}';if(window.UNREAD_THREADS){window.UNREAD_THREADS.delete('${t.phone}');var b=document.getElementById('inboxBadge');if(b)b.textContent=window.UNREAD_THREADS.size;}refreshInbox()"
              style="padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:${isSel?'#EFF6FF':'transparent'};border-left:3px solid ${isSel?'#1A6ED0':'transparent'};transition:background 0.1s">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
                <div style="font-weight:700;font-size:14px;color:${isSel?'#1A6ED0':'var(--navy-900)'};">${t.name}</div>
                <div style="display:flex;align-items:center;gap:5px">
                  ${t.unread?'<div style="width:7px;height:7px;border-radius:50%;background:#1A6ED0;flex-shrink:0"></div>':''}
                  <div style="font-size:10.5px;color:var(--gray-400);">${t.lastDay==='Today'?t.lastMsg.time:t.lastDay}</div>
                </div>
              </div>
              <div style="font-size:11.5px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${isInbound?'':' You: '}${(t.lastMsg.text||'').replace(/</g,'&lt;')}</div>
              <div style="font-size:10.5px;color:var(--gray-400);margin-top:2px">${t.phone}</div>
            </div>`;
          }).join('')
        }
      </div>

      <!-- RIGHT: selected conversation -->
      <div style="display:flex;flex-direction:column;overflow:hidden;background:#fff">
        ${selectedContact ? `
        <!-- Header -->
        <div style="padding:13px 18px;border-bottom:1px solid var(--border);background:var(--gray-50);flex-shrink:0;display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-weight:700;font-size:15px;color:var(--navy-900)">${selectedContact.name}</div>
            <div style="font-size:12px;color:var(--gray-500);margin-top:1px">${selectedContact.phone} · SMS / MMS</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost" style="font-size:12px;padding:5px 12px" onclick="doCall('${selectedContact.name.replace(/'/g,"\\'")}')">📞 Call</button>
            <button class="btn btn-ghost" style="font-size:12px;padding:5px 12px" onclick="nav('leaddetail',null)">View Lead →</button>
          </div>
        </div>
        <!-- Messages -->
        <div style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px">
          ${flatMessages.length === 0 ? `<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:30px 0">No messages yet — start the conversation below.</div>` :
            flatMessages.map(m => `
            <div style="display:flex;justify-content:${m.direction==='outbound'?'flex-end':'flex-start'}">
              <div style="max-width:68%;padding:10px 14px;font-size:13px;line-height:1.5;${m.direction==='outbound'?'background:#1A6ED0;color:#fff;border-radius:16px 16px 4px 16px':'background:#F1F5F9;color:var(--navy-900);border-radius:16px 16px 16px 4px'}">
                ${(m.text||'').replace(/</g,'&lt;')}
                <div style="font-size:10px;margin-top:5px;text-align:right;color:${m.direction==='outbound'?'rgba(255,255,255,0.60)':'var(--gray-400)'}">${m.time}</div>
              </div>
            </div>`).join('')
          }
        </div>
        <!-- Compose bar -->
        <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;background:#fff">
          <label title="Add attachment" style="cursor:pointer;font-size:20px;color:var(--gray-400);display:flex;align-items:center;flex-shrink:0;line-height:1">
            📎<input type="file" style="display:none" onchange="alert('Attachment: '+this.files[0].name);this.value=''">
          </label>
          <input type="text" id="inboxTextInput_${safeSelPhone}" placeholder="Type a message and press Enter to send…"
            style="flex:1;font-family:var(--font-body);padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:13px;outline:none;transition:border-color 0.15s"
            onfocus="this.style.borderColor='#1A6ED0'" onblur="this.style.borderColor='var(--border)'"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();inboxSendText('${selectedPhone}')}">
          <button type="button" onclick="inboxSendText('${selectedPhone}')"
            style="background:#1A6ED0;color:#fff;border:none;border-radius:var(--radius-md);padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);white-space:nowrap;flex-shrink:0">Send</button>
        </div>
        ` : `
        <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px">
          <div style="font-size:42px">💬</div>
          <div style="font-size:15px;font-weight:600;color:var(--gray-600)">Select a conversation</div>
          <div style="font-size:12.5px;color:var(--gray-400)">Click a contact on the left to view and reply</div>
        </div>`}
      </div>
    </div>
  </div>
  `;
}

function inboxSendText(phone) {
  const safePhone = (phone || '').replace(/[^0-9]/g,'');
  const inp = document.getElementById('inboxTextInput_' + safePhone);
  if (!inp) return;
  const v = inp.value.trim();
  if (!v || !phone) return;
  if (!window.CONVERSATIONS) window.CONVERSATIONS = {};
  if (!window.CONVERSATIONS[phone]) window.CONVERSATIONS[phone] = [];
  let bucket = window.CONVERSATIONS[phone].find(d => d.date === 'Today');
  if (!bucket) { bucket = { date:'Today', msgs:[] }; window.CONVERSATIONS[phone].push(bucket); }
  const time = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  bucket.msgs.push({ from:'us', time, text: v });
  logText({ direction:'outbound', content: v });
  inp.value = '';
  refreshInbox();
}

    <div class="card-body" style="padding:6px 0">
      ${emails.map(e => {

        return `
        <div onclick="alert('Opening: ${e.subject.replace(/'/g,"\\'")}')" style="display:flex;align-items:flex-start;gap:13px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;background:${!e.read?'var(--green-50)':'transparent'};transition:background 0.15s;border-left:${!e.read?'3px solid var(--green-500)':'3px solid transparent'}" onmouseenter="if(${e.read})this.style.background='var(--gray-50)'" onmouseleave="if(${e.read})this.style.background='transparent'">

            <div style="font-weight:${!e.read?'700':'600'};font-size:13.5px;color:var(--navy-900);margin-bottom:3px">${e.subject}</div>
            <div style="font-size:12.5px;color:var(--gray-600);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.preview}</div>
            <div style="display:flex;gap:6px;margin-top:9px" onclick="event.stopPropagation()">

              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px">↪ Forward</button>
              ${e.phone?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="doCall('${e.from.replace(/'/g,"\\'")}')">📞 Call</button><button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="openTextThread('${e.from.replace(/'/g,"\\'")}','${e.phone}')">💬 Text</button>`:''}
              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px">⏰ Snooze</button>
              <button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px">📁 Archive</button>
              ${e.phone?`<button type="button" class="btn btn-ghost" style="font-size:11px;padding:5px 11px" onclick="nav('leaddetail',null)">👁 Profile</button>`:''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  `;
}

function playRecording(name) {
  alert('▶ Playing recording for ' + name + '…\n\nUsing in-app HTML5 audio player.');
}

function submitPayment() {
  const num  = (document.getElementById('pt_cardnum') ||{}).value.replace(/\s/g,'');
  const name = (document.getElementById('pt_cardname')||{}).value.trim();
  const exp  = (document.getElementById('pt_exp')     ||{}).value.trim();
  const cvv  = (document.getElementById('pt_cvv')     ||{}).value.trim();
  if (num.length < 15)  { alert('Please enter a valid card number.');    return; }
  if (!name)            { alert('Please enter the cardholder name.');    return; }
  if (!exp.match(/^\d{2}\/\d{2}$/)) { alert('Please enter a valid expiration date (MM/YY).'); return; }
  if (cvv.length < 3)   { alert('Please enter the CVV.');               return; }

  // Show processing state briefly
  const btn = document.querySelector('[onclick="submitPayment()"]');
  if (btn) { btn.textContent = 'Processing…'; btn.style.opacity = '0.7'; btn.disabled = true; }

  setTimeout(() => {
    const brands = ['VISA','Mastercard','Amex','Discover'];
    const brand  = num[0]==='4' ? 'VISA' : num[0]==='5' ? 'Mastercard' : num.slice(0,2)==='37'||num.slice(0,2)==='34' ? 'Amex' : 'Card';
    window.PAYMENT_STATE = { step: 'success', last4: num.slice(-4), cardBrand: brand };
    launchConfetti(2500);
    refreshPaymentTerminal();
  }, 1400);
}

function submitESign() {
  const email = (document.getElementById('esign_email')||{}).value.trim();
  const phone = (document.getElementById('esign_phone')||{}).value.trim();
  if (!email && !phone) { alert('Please enter at least an email or phone number to send the signing link.'); return; }
  const btn = document.querySelector('[onclick="submitESign()"]');
  if (btn) { btn.textContent = 'Sending…'; btn.style.opacity = '0.7'; btn.disabled = true; }
  setTimeout(() => {
    const pp = window.PENDING_PAYMENT || {};
    if (pp.type === 'cancellation' && pp.custId && pp.policyNum) {
      const ci = (typeof CUSTOMERS !== 'undefined' ? CUSTOMERS : []).findIndex(cu => cu.id === pp.custId);
      if (ci >= 0) {
        const pol = CUSTOMERS[ci].policies.find(p => p.number === pp.policyNum);
        if (pol) pol.status = 'Cancelled';
      }
    }
    window.ESIGN_STATE = { step: 'sent', type: (window.ESIGN_STATE||{}).type };
    launchConfetti(2000);
    refreshESignPage();
    if ((window.PENDING_PAYMENT||{}).type !== 'cancellation') {
      setTimeout(completeNewSaleDetails, 2500);
    }
  }, 1200);
}

function completeNewSaleDetails() {
  const leadName = window._preSaleLeadName || (window.PENDING_PAYMENT||{}).leadName || '';
  if (leadName) window._currentLeadName = leadName;
  nav('leaddetail', document.querySelector('.nav-item[onclick*="leads"]'));
  setTimeout(() => {
    window.ADDITIONAL_POLICIES = [];
    if (typeof setAdditionalPolicies === 'function') setAdditionalPolicies(false);
    const carrierSel = document.getElementById('nsCarrier');
    if (carrierSel && window.CARRIER_DATA && window.CARRIER_DATA.length) {
      const cur = carrierSel.value;
      carrierSel.innerHTML = window.CARRIER_DATA.map(cd=>`<option${cd.name===cur?' selected':''}>${cd.name}</option>`).join('') + `<option${cur==='Other'?' selected':''}>Other</option>`;
    }
    const overlay = document.getElementById('newSaleOverlay');
    if (overlay) {
      const dateInput = document.getElementById('newSaleEffDate');
      if (dateInput) dateInput.value = new Date().toISOString().slice(0,10);
      overlay.style.display = 'flex';
    }
  }, 450);
}

function voidPolicy(custId, policyNum) {
  if (!confirm('VOID this policy? This will reverse the sale and cannot be undone.')) return;
  const custIdx = (typeof CUSTOMERS !== 'undefined' ? CUSTOMERS : []).findIndex(cu => cu.id === custId);
  if (custIdx < 0) return;
  const pol = CUSTOMERS[custIdx].policies.find(p => p.number === policyNum);
  if (!pol) return;
  const saleIdx = (window.SALES||[]).findIndex(s => s.id === pol.saleId);
  if (saleIdx >= 0) {
    const s = window.SALES[saleIdx];
    const ai = (typeof AGENTS !== 'undefined' ? AGENTS : []).findIndex(a => a.name === s.agentName);
    if (ai >= 0) {
      AGENTS[ai].apps    = Math.max(0, (AGENTS[ai].apps    || 0) - (s.totalPolicies || 1));
      AGENTS[ai].fee     = Math.max(0, (AGENTS[ai].fee     || 0) - (s.feeCollected  || 0));
      AGENTS[ai].premium = Math.max(0, (AGENTS[ai].premium || 0) - ((s.premium||0)+(s.towingPrem||0)));
    }
    window.SALES.splice(saleIdx, 1);
  }
  pol.status = 'Voided';
  nav('customerdetail', null);
}

function cancelPolicy(custId, policyNum) {
  const custIdx = (typeof CUSTOMERS !== 'undefined' ? CUSTOMERS : []).findIndex(cu => cu.id === custId);
  if (custIdx < 0) return;
  const pol = CUSTOMERS[custIdx].policies.find(p => p.number === policyNum);
  if (!pol) return;
  const cu = CUSTOMERS[custIdx];
  window.PENDING_PAYMENT = {
    type: 'cancellation',
    custId,
    policyNum,
    sale: { carrier: pol.carrier, policyType: pol.line, policyNum: pol.number, premium: pol.premium, feeCollected: pol.feeCollected },
    leadName: cu.first + ' ' + cu.last,
  };
  window.ESIGN_STATE = { step: 'prepare', type: 'cancellation' };
  nav('esignatures', document.querySelector('.nav-item[onclick*="esignatures"]'));
}

function closeAgentModal() {

function saveAgent() {
  const g   = id => document.getElementById(id);
  const v   = id => (g(id) && g(id).value.trim()) || '';
  const num = id => parseInt(g(id) && g(id).value) || 0;
  const chk = id => !!(g(id) && g(id).checked);

  const first = v('am_first');
  const last  = v('am_last');
  if (!first || !last) { alert('Please enter both a first and last name.'); return; }
  const newName = first + ' ' + last;
  const oldName = window._editingAgent;
  const isNew   = !oldName;

  const member = {
    name: newName, first, last,
    email:     v('am_email'),
    phone:     v('am_phone'),
    ext:       v('am_ext'),
    role:      v('am_role'),
    tier:      v('am_tier'),
    team:      v('am_team'),
    status:    v('am_status'),
    startDate: v('am_startDate'),
    goalApps:    num('am_goalApps')    || 15,
    goalFee:     num('am_goalFee')     || 6000,
    goalPremium: num('am_goalPremium') || 20000,
    goalClose:   num('am_goalClose')   || 25,
    goalContact: num('am_goalContact') || 55,
    permViewAll:   chk('am_pViewAll'),
    permReports:   chk('am_pReports'),
    permPayments:  chk('am_pPayments'),
    permManage:    chk('am_pManage'),
    permAddRemove: chk('am_pAddRemove'),
  };

  if (isNew) {
    window.TEAM_MEMBERS.push(member);
    AGENTS.push({ name:newName, apps:0, goal:member.goalApps, fee:0, feeGoal:member.goalFee, premium:0, tier:member.tier, close:'0%', contact:'0%', leads:0, rank:AGENTS.length+1 });
  } else {
    const ti = window.TEAM_MEMBERS.findIndex(m => m.name === oldName);
    if (ti >= 0) window.TEAM_MEMBERS[ti] = member;
    const ai = AGENTS.findIndex(a => a.name === oldName);
    if (ai >= 0) {
      AGENTS[ai].name    = newName;
      AGENTS[ai].goal    = member.goalApps;
      AGENTS[ai].feeGoal = member.goalFee;
      AGENTS[ai].tier    = member.tier;
    }
    if (oldName !== newName && AGENT_EXTENDED_DATA[oldName]) {
      AGENT_EXTENDED_DATA[newName] = AGENT_EXTENDED_DATA[oldName];
      delete AGENT_EXTENDED_DATA[oldName];
    }
  }

  closeAgentModal();
  renderAgencyPage();
}

function confirmRemoveAgent(name) {
  if (!confirm('Remove ' + name + ' from the team? This cannot be undone.')) return;
  window.TEAM_MEMBERS = window.TEAM_MEMBERS.filter(m => m.name !== name);
  renderAgencyPage();
}

function rptDateLabel(s) {
  const modes = { payperiod:'Jul 16–31, 2026 (Current Pay Period)', thismonth:'Jul 1–31, 2026 (This Month)', lastmonth:'Jun 1–30, 2026 (Last Month)', ytd:'Jan 1–Jul 31, 2026 (Year to Date)' };
  if (modes[s.dateMode]) return modes[s.dateMode];
  if (!s.startDate || !s.endDate) return 'Custom Range';
  const mos = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtD = d => { const [yr,mo,dy] = d.split('-'); return mos[+mo-1]+' '+dy+', '+yr; };
  return fmtD(s.startDate) + ' – ' + fmtD(s.endDate);
}

function rptScale(s) {
  // Pay period baseline = 1.0 (16 days, Jul 16–31)
  const scaleMap = { payperiod:1.0, thismonth:1.94, lastmonth:1.88, ytd:13.6 };
  if (scaleMap[s.dateMode] !== undefined) return scaleMap[s.dateMode];
  const d1 = new Date(s.startDate || '2026-07-16');
  const d2 = new Date(s.endDate   || '2026-07-31');
  const days = Math.max(1, Math.round((d2 - d1) / 86400000) + 1);
  return days / 16;
}

function rptVal(base, sc) { return Math.round(base * sc); }
function rptFee(base, sc) { return Math.round(base * sc / 50) * 50; }

}

            return POLICY_TYPE_DATA.map(r => {
              const pol  = rptVal(r.policies, sc);
              const prem = rptVal(r.premium,  sc);
              const nc   = rptVal(r.newClients, sc);
              const ren  = rptVal(r.renewals,  sc);
              const avg  = pol ? Math.round(prem/pol) : 0;
              const mix  = totalPolT ? Math.round(pol/totalPolT*100) : 0;
              return `<tr>
                <td style="font-weight:700">${r.type}</td>
                <td style="font-weight:700;color:var(--navy-900)">${pol}</td>
                <td style="color:var(--green-700);font-weight:700">${fmtK(prem)}</td>
                <td style="color:var(--gray-600)">${fmt$(avg)}</td>
                <td style="color:#1A6ED0;font-weight:600">${nc}</td>
                <td style="color:var(--gray-600)">${ren}</td>

                  <div style="display:flex;align-items:center;gap:6px">
                    <div style="width:48px;height:5px;border-radius:3px;background:var(--gray-100);overflow:hidden"><div style="width:${mix}%;height:100%;background:#1A6ED0"></div></div>
                    <span style="font-size:12px;font-weight:600">${mix}%</span>
                  </div>
                </td>
              </tr>`;
            }).join('');
          })()}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderRptActivity(sc) {
  const fmtDur  = secs => { const m=Math.floor(secs/60),s2=secs%60; return m+'m '+(s2<10?'0':'')+s2+'s'; };
  const pct2    = (n,d) => d ? Math.round(n/d*100) : 0;
  const clrPct  = p => p>=75?'#16A34A':p>=50?'#D97706':'#DC2626';
  const barPct  = p => p>=75?'pb-green':p>=50?'pb-amber':'pb-red';
  const fmt$    = n => '$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});

  const agents  = (typeof AGENTS!=='undefined'?AGENTS:[]).filter(a=>!a._archived);

  // Build per-agent activity data from live logs (with AGENT_EXTENDED_DATA fallback for demo agents)
  const _actMap = {};
  agents.forEach(a => { _actMap[a.name] = getAgentActivityData(a.name); });

  // Team-level aggregates
  const totOut   = agents.reduce((s,a)=>s+(_actMap[a.name].outboundCalls||0),0);
  const totIn    = agents.reduce((s,a)=>s+(_actMap[a.name].inboundCalls||0),0);
  const totMiss  = agents.reduce((s,a)=>s+(_actMap[a.name].missedCalls||0),0);
  const totDials = agents.reduce((s,a)=>s+(_actMap[a.name].dials||0),0);
  const totTS    = agents.reduce((s,a)=>s+(_actMap[a.name].textsSent||0),0);
  const totTR    = agents.reduce((s,a)=>s+(_actMap[a.name].textsRecv||0),0);
  const totNL    = agents.reduce((s,a)=>s+(_actMap[a.name].newLeads||0),0);
  const totLM    = agents.reduce((s,a)=>s+(_actMap[a.name].leadsMissed||0),0);
  const totCalls = totOut + totIn;
  const ansRate  = pct2(totIn - totMiss, totIn||1);
  const contactR = pct2(totOut, totDials||1);
  const calledPct= pct2(totOut, totNL||1);
  const replyR   = pct2(totTR, totTS||1);

  // Team avg close rate
  const closeNums = agents.map(a=>{
    const act=_actMap[a.name];
    const ic=parseFloat(act.inboundClose)||0;
    const oc=parseFloat(act.outboundClose)||0;
    return ic||oc ? (ic+oc)/(ic&&oc?2:1) : null;
  }).filter(x=>x!==null);
  const teamClose = closeNums.length ? Math.round(closeNums.reduce((a,b)=>a+b,0)/closeNums.length*10)/10 : 0;

  const avgDur = agents.length ? Math.round(agents.reduce((s,a)=>s+(_actMap[a.name].avgCallDur||0),0)/agents.length) : 0;

  // Mini progress bar helper
  const miniBar = (val, max, color) => {
    const w = max ? Math.min(100, Math.round(val/max*100)) : 0;
    return `<div style="height:4px;background:#F3F4F6;border-radius:99px;margin-top:3px;overflow:hidden"><div style="width:${w}%;height:100%;background:${color};border-radius:99px"></div></div>`;
  };

  // Group header style
  const ghStyle = (bg,clr) => `padding:6px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;background:${bg};color:${clr};text-align:center;border-bottom:2px solid var(--border)`;
  const shStyle = `padding:8px 12px;font-size:10.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border);background:var(--gray-50);white-space:nowrap;text-align:center`;

  return `
  <!-- TEAM KPI CARDS -->
  <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:16px">
    ${[
      ['Outbound Calls', totOut,      'Calls made by agents',       '#1A6ED0', '#EFF6FF'],
      ['Inbound Calls',  totIn,       ansRate+'% answer rate',       '#16A34A', '#F0FDF4'],
      ['Calls Missed',   totMiss,     'Inbound not answered',        '#DC2626', '#FEF2F2'],
      ['Dials Made',     totDials,    contactR+'% contact rate',     '#7C3AED', '#F5F3FF'],
      ['Texts Sent',     totTS,       replyR+'% reply rate',         '#0891B2', '#ECFEFF'],
      ['Texts Received', totTR,       'From leads & customers',      '#059669', '#F0FDF4'],
      ['New Leads',      totNL,       calledPct+'% called',          '#D97706', '#FFFBEB'],
      ['Team Close %',   teamClose+'%','Avg of all agents',          '#1C2B4B', '#F0F4FF'],
    ].map(([label,val,sub,clr,bg])=>`
    <div style="background:${bg};border:1.5px solid ${clr}22;border-radius:var(--radius-lg);padding:14px 16px;border-left:4px solid ${clr}">
      <div style="font-size:10px;font-weight:700;color:${clr};text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">${label}</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--navy-900)">${val}</div>
      <div style="font-size:11px;color:var(--gray-500);margin-top:4px">${sub}</div>
    </div>`).join('')}
  </div>

  <!-- AGENT SCORECARD TABLE -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-header">
      <div class="card-title">Agent Activity Scorecard</div>
      <div style="font-size:12px;color:var(--gray-400)">Per-agent breakdown · ${window.REPORTS_STATE ? ({payperiod:'Pay Period',thismonth:'This Month',lastmonth:'Last Month',ytd:'YTD',custom:'Custom'}[window.REPORTS_STATE.dateMode]||'Period') : 'Period'}</div>
    </div>

            <th colspan="3" style="${ghStyle('#ECFEFF','#0891B2')}">💬 TEXTS</th>
            <th colspan="3" style="${ghStyle('#FFFBEB','#D97706')}">🎯 LEADS</th>
            <th colspan="3" style="${ghStyle('#F0FDF4','#16A34A')}">✅ CLOSING</th>
            <th colspan="2" style="${ghStyle('#F5F3FF','#7C3AED')}">⏱ PRODUCTIVITY</th>

            <th style="${shStyle}">Avg Duration</th>
            <th style="${shStyle}">Rev / Lead</th>
          </tr>
        </thead>
        <tbody>
          ${agents.map((a,i) => {

              ${statCell(tr2, 'var(--gray-600)')}

// ==================== TIME CLOCK REPORT ====================
function renderRptTimeClock() {
  const s = window.REPORTS_STATE;
  window.TC_FILTER = window.TC_FILTER || { agent: 'All' };

  const records = (window.TIME_CLOCK || []).filter(r => {
    if (r.date < s.startDate || r.date > s.endDate) return false;
    if (window.TC_FILTER.agent !== 'All' && r.agentName !== window.TC_FILTER.agent) return false;
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date) || (b.clockIn||'').localeCompare(a.clockIn||''));

  const agentList = (typeof AGENTS !== 'undefined' ? AGENTS : []).filter(a=>!a._archived).map(a=>a.name);
  const agentDropdown = ['All',...agentList].map(n=>`<option value="${n}" ${window.TC_FILTER.agent===n?'selected':''}>${n}</option>`).join('');

  // Per-agent hours summary
  const totals = {};
  records.forEach(r => {
    if (!totals[r.agentName]) totals[r.agentName] = { mins:0, days:new Set() };
    const mins = _tcMinutes(r.clockOut) - _tcMinutes(r.clockIn);
    if (mins > 0) totals[r.agentName].mins += mins;
    if (r.date) totals[r.agentName].days.add(r.date);
  });
  const summaryRows = Object.entries(totals).map(([name,t]) => {
    const h=Math.floor(t.mins/60), m=t.mins%60;
    const hrs = t.mins>0 ? `${h}h${m?' '+m+'m':''}` : '—';
    return `<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border)">
      <div style="flex:1;font-size:13px;font-weight:700;color:var(--navy-900)">${name}</div>
      <div style="text-align:center;min-width:48px"><div style="font-size:13px;font-weight:700;color:#1A6ED0">${t.days.size}</div><div style="font-size:10px;color:var(--gray-400)">days</div></div>
      <div style="text-align:right;min-width:70px"><div style="font-size:14px;font-weight:800;color:var(--navy-900)">${hrs}</div><div style="font-size:10px;color:var(--gray-400)">total</div></div>
    </div>`;
  }).join('') || `<div style="padding:28px;text-align:center;color:var(--gray-400);font-size:13px">No records this period.</div>`;

  const tableRows = records.length ? records.map(r => {
    const hrs  = r.clockOut ? _tcHoursWorked(r.clockIn, r.clockOut) : '—';
    const open = !r.clockOut;
    const dateLbl = new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    return `<tr>
      <td style="font-weight:700;color:var(--navy-900)">${r.agentName}</td>
      <td style="color:var(--gray-600)">${dateLbl}</td>
      <td style="font-weight:600;color:#16A34A">${r.clockIn||'—'}</td>
      <td style="font-weight:600;color:${open?'#D97706':'#DC2626'}">${open?'<em style="color:#D97706">Still in</em>':(r.clockOut||'—')}</td>
      <td style="font-weight:800;color:var(--navy-900)">${hrs}</td>
      <td style="color:var(--gray-500);font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.notes||'—'}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button onclick="openTimeCardModal('edit','${r.id}')" style="background:#EFF6FF;border:1px solid #BFDBFE;color:#1A6ED0;border-radius:var(--radius-md);padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body)">Edit</button>
          <button onclick="deleteTimeCard('${r.id}')" style="background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;border-radius:var(--radius-md);padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body)">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" style="padding:48px;text-align:center;color:var(--gray-400)">No time card records for this period.<br><span style="font-size:12px">Agents clock in/out from the Dashboard. Use "+ Add Entry" to add a manual record.</span></td></tr>`;

  return `
  <div style="display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start">
    <div class="card" style="overflow:hidden">
      <div class="card-header">
        <div class="card-title">Time Card Records</div>
        <div style="display:flex;align-items:center;gap:8px">
          <select onchange="window.TC_FILTER.agent=this.value;refreshReports()" style="font-size:12.5px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-md);font-family:var(--font-body);color:var(--navy-900);background:#fff;cursor:pointer">
            ${agentDropdown}
          </select>
          <button onclick="openTimeCardModal('add',null)" style="background:#1A6ED0;border:none;color:#fff;border-radius:var(--radius-md);padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);white-space:nowrap">+ Add Entry</button>
        </div>
      </div>
      <div style="overflow-x:auto">

function _tcTo24(str) {
  if (!str) return '';
  const [t,ampm] = str.split(' ');
  let [h,m] = t.split(':').map(Number);
  if (ampm==='PM' && h!==12) h+=12;
  if (ampm==='AM' && h===12) h=0;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function _tc12hr(val) {
  if (!val) return '';
  let [h,m] = val.split(':').map(Number);
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h%12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function saveTimeCardModal(mode, recordId) {
  const agentVal = mode==='edit'
    ? (document.getElementById('tc_agent_val')||{}).value
    : (document.getElementById('tc_agent')||{}).value;
  const date   = (document.getElementById('tc_date') ||{}).value;
  const inVal  = (document.getElementById('tc_in')   ||{}).value;
  const outVal = (document.getElementById('tc_out')  ||{}).value;
  const notes  = ((document.getElementById('tc_notes')||{}).value||'').trim();

  if (!agentVal) { alert('Please select an agent.'); return; }
  if (!date)     { alert('Please set a date.'); return; }
  if (!inVal)    { alert('Please set a clock-in time.'); return; }

  const clockIn  = _tc12hr(inVal);
  const clockOut = outVal ? _tc12hr(outVal) : null;

  window.TIME_CLOCK = window.TIME_CLOCK || [];
  if (mode==='add') {
    window.TIME_CLOCK.push({ id: Date.now(), agentName: agentVal, date, clockIn, clockOut, notes });
  } else {
    const idx = window.TIME_CLOCK.findIndex(r=>String(r.id)===String(recordId));
    if (idx!==-1) window.TIME_CLOCK[idx] = { ...window.TIME_CLOCK[idx], date, clockIn, clockOut, notes };
  }
  closeTimeCardModal();
  window.REPORTS_STATE.tab = 'timeclock';
  refreshReports();
}

function deleteTimeCard(recordId) {
  if (!confirm('Delete this time card entry? This cannot be undone.')) return;
  window.TIME_CLOCK = (window.TIME_CLOCK||[]).filter(r=>String(r.id)!==String(recordId));
  closeTimeCardModal();
  window.REPORTS_STATE.tab = 'timeclock';
  refreshReports();
}

function renderTasksPage() {
  const filterAgent = window.TASKS_STATE.agentFilter || 'All';
  const agentList   = ['All', 'Admin', ...AGENTS.map(a => a.name)];

  let tasks = window.TASKS_DATA.slice();
  if (filterAgent !== 'All') tasks = tasks.filter(t => t.assignedTo === filterAgent);

  const todayTasks    = tasks.filter(t => t.dueDate === TODAY_ISO && !t.done);
  const upcomingTasks = tasks.filter(t => t.dueDate > TODAY_ISO && !t.done);
  const doneTasks     = tasks.filter(t => t.done);
  const totalOpen     = todayTasks.length + upcomingTasks.length;

  const taskRow = (t, isToday) => `
  <div id="task-row-${t.id}" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-md);border:1px solid ${t.done?'var(--border)':t.priority==='high'?'var(--navy-200)':'var(--border)'};margin-bottom:7px;background:${t.done?'var(--gray-50)':t.priority==='high'&&isToday?'var(--navy-50)':'var(--white)'};transition:all 0.15s">
    <div onclick="toggleTaskDone(${t.id})" style="width:16px;height:16px;border-radius:4px;border:2px solid ${t.done?'var(--green-500)':'var(--gray-300)'};flex-shrink:0;cursor:pointer;background:${t.done?'var(--green-500)':'transparent'};display:flex;align-items:center;justify-content:center">
      ${t.done?'<svg width="9" height="9" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
    </div>
    <span style="font-size:14px;flex-shrink:0">${t.icon}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12.5px;font-weight:600;color:${t.done?'var(--gray-400)':'var(--navy-900)'};${t.done?'text-decoration:line-through':''}">${t.label}</div>
      <div style="font-size:11px;color:var(--gray-400);margin-top:1px;display:flex;align-items:center;gap:8px">
        <span>${t.dueTime||'No time set'}</span>
        <span style="background:${t.assignedTo==='Admin'?'var(--navy-50)':'var(--green-50)'};color:${t.assignedTo==='Admin'?'var(--navy-700)':'var(--green-700)'};border:1px solid ${t.assignedTo==='Admin'?'var(--navy-200)':'var(--green-200)'};padding:1px 7px;border-radius:var(--radius-full);font-size:10px;font-weight:600">
          ${t.assignedTo==='Admin'?'👤 Admin':'🧑‍💼 '+t.assignedTo}
        </span>
        ${t.notes?`<span style="color:var(--gray-400);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">"${t.notes}"</span>`:''}
      </div>
    </div>
    <span class="pri-badge pri-${t.priority}">${t.priority.toUpperCase()}</span>
    <div onclick="deleteTask(${t.id})" title="Delete" style="flex-shrink:0;cursor:pointer;color:var(--gray-300);font-size:13px;padding:3px 6px;border-radius:4px;margin-left:2px" onmouseenter="this.style.color='var(--red)'" onmouseleave="this.style.color='var(--gray-300)'">✕</div>
  </div>`;

  const section = (title, list, badge, isToday) => list.length === 0 ? '' : `
  <div class="card" style="margin-bottom:14px">
    <div class="card-header">
      <div class="card-title">${title}</div>
      ${badge}
    </div>
    <div class="card-body" style="padding:14px 16px">
      ${list.map(t => taskRow(t, isToday)).join('')}
    </div>
  </div>`;

  const todayBadge    = `<span style="background:var(--navy-50);color:var(--navy-700);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-full)">${todayTasks.length} task${todayTasks.length!==1?'s':''}</span>`;
  const upcomingBadge = `<span style="background:var(--gray-100);color:var(--gray-600);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-full)">${upcomingTasks.length} upcoming</span>`;
  const doneBadge     = `<span style="background:var(--green-50);color:var(--green-700);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-full)">${doneTasks.length} completed</span>`;

  return `
  <div id="tasksPageWrap">
    <div class="page-header">
      <div class="page-header-left" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <h1>Tasks &amp; Follow-Ups</h1>
          <p>${totalOpen} open · ${doneTasks.length} completed</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;font-weight:600;color:var(--gray-500)">Assign:</span>
          <select class="filter-select" onchange="window.TASKS_STATE.agentFilter=this.value;refreshTasksPage()" style="font-size:12px">
            ${agentList.map(n=>`<option value="${n}" ${filterAgent===n?'selected':''}>${n==='All'?'All Assignees':n==='Admin'?'Admin (Tony Ballo)':n}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="font-size:12px" onclick="openTaskModal()">+ New Task (Admin)</button>
        <button class="btn btn-primary" onclick="openTaskModal()">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
          Assign to Agent
        </button>
      </div>
    </div>
    ${section('Today — May 1, 2026', todayTasks, todayBadge, true)}
    ${section('Upcoming', upcomingTasks, upcomingBadge, false)}
    ${section('Completed', doneTasks, doneBadge, false)}
    ${totalOpen === 0 && doneTasks.length === 0 ? `<div class="card"><div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No tasks yet</div><div class="empty-sub">Add a task using the button above.</div></div></div>` : ''}
  </div>`;
}

  <div class="card" style="padding:12px">
    <div style="font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:1px;padding:4px 12px 10px">Configuration</div>

      ${p.label}
    </div>`).join('')}
  </div>`;

  let main = '';

  if (s.panel === 'agents') {
    if (s.addingAgent) {
      main = renderAddAgentForm();
    } else if (s.editingAgent !== null && s.editingAgent !== undefined) {
      main = renderEditAgentForm(s.editingAgent);
    } else if (s.viewingAgent !== null && s.viewingAgent !== undefined) {
      main = renderAgentProfile(s.viewingAgent);
    } else {
      main = renderAgentList();
    }
  } else if (s.panel === 'statuses' || s.panel === 'leadsources') {
    main = renderLeadsPanel();
  } else if (s.panel === 'lifecycle') {
    main = renderLifecyclePanel();
  } else if (s.panel === 'goals') {
    main = renderGoalsPanel();
  } else if (s.panel === 'tiers') {
    main = renderTiersPanel();
  } else if (s.panel === 'payperiods') {
    main = renderPayPeriodsPanel();
  } else if (s.panel === 'carriers') {
    main = renderCarriersPanel();
  } else if (s.panel === 'callsettings') {
    main = renderCallSettingsPanel();
  } else if (s.panel === 'pipelines') {
    main = renderPipelinesPanel();
  } else if (s.panel === 'dataexport') {
    main = renderDataExportPanel();
  } else {

      <div class="empty-sub">This configuration panel is coming soon.</div>

  <div class="admin-layout">${sidebar}${main}</div>

function confirmArchiveAgent(idx) {
  document.getElementById('archiveModal').style.display = 'flex';
}
function confirmDeleteAgent(idx) {
  document.getElementById('deleteModal').style.display = 'flex';
}
function archiveAgent(idx) {
  AGENTS[idx]._archived = true;
  window.ADMIN_STATE.viewingAgent = null;
  window.ADMIN_STATE.successMsg = AGENTS[idx].name + ' has been archived.';
  refreshAdminPage();
}
function restoreAgent(idx) {
  AGENTS[idx]._archived = false;
  window.ADMIN_STATE.viewingAgent = null;
  window.ADMIN_STATE.successMsg = AGENTS[idx].name + ' has been restored.';
  refreshAdminPage();
}
function deleteAgent(idx) {
  const name = AGENTS[idx].name;
  AGENTS.splice(idx, 1);
  window.ADMIN_STATE.viewingAgent = null;
  window.ADMIN_STATE.successMsg = name + ' has been permanently deleted.';
  refreshAdminPage();
}

function handleAgentFileUpload(input, idx) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const list = document.getElementById('agentFileList_' + idx);
  if (!list) return;
  files.forEach(f => {
    const kb = Math.round(f.size / 1024);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--gray-50)';
    const ext = f.name.split('.').pop().toLowerCase();
    const icon = (ext === 'pdf') ? '📄' : (ext === 'jpg' || ext === 'jpeg' || ext === 'png') ? '🖼' : '📎';
    row.innerHTML = '<div style="display:flex;align-items:center;gap:9px"><span style="font-size:18px">' + icon + '</span><div><div style="font-weight:600;font-size:13px;color:var(--navy-900)">' + f.name + '</div><div style="font-size:11px;color:var(--gray-400)">' + kb + ' KB · Just uploaded</div></div></div><button style="background:transparent;border:none;color:var(--gray-400);cursor:pointer;font-size:16px;padding:2px 6px" title="Remove" onclick="this.parentElement.remove()">✕</button>';
    list.appendChild(row);
  });
  input.value = '';
}

function saveEditedAgent(idx) {
  const g   = id => document.getElementById(id);
  const v   = id => g(id) ? g(id).value.trim() : '';
  const num = id => parseInt(g(id) && g(id).value) || 0;
  const chk = id => !!(g(id) && g(id).checked);

  const first = v('ef_first');
  const last  = v('ef_last');
  if (!first || !last) { alert('First name and last name are required.'); return; }
  const newName = first + ' ' + last;
  const oldName = AGENTS[idx].name;
  const tierRaw = v('ef_tier').split(' — ')[0];

  AGENTS[idx].name              = newName;
  AGENTS[idx].goal              = num('ef_pgoal') || AGENTS[idx].goal;
  AGENTS[idx].feeGoal           = num('ef_fgoal') || AGENTS[idx].feeGoal;
  AGENTS[idx].tier              = tierRaw;
  AGENTS[idx]._role             = v('ef_role');
  AGENTS[idx]._agentType        = v('ef_agentType');
  AGENTS[idx]._2fa              = chk('ef_2fa');
  AGENTS[idx]._inboundDisabled  = chk('ef_inboundDisabled');

  if (!window.TEAM_MEMBERS) window.TEAM_MEMBERS = [];
  const tmIdx = window.TEAM_MEMBERS.findIndex(m => m.name === oldName);
  const memberData = {
    name: newName, first, last: last,
    email:     v('ef_email'),
    phone:     v('ef_phone'),
    ext:       v('ef_ext'),
    role:      v('ef_role') === 'Admin' ? 'Admin' : 'Agent',
    tier:      tierRaw,
    team:      v('ef_team'),
    status:    v('ef_status'),
    startDate: v('ef_startDate'),
    goalApps:     num('ef_pgoal')      || 15,
    goalFee:      num('ef_fgoal')      || 6000,
    goalPremium:  num('ef_premgoal')   || 20000,
    goalClose:    num('ef_closegoal')  || 25,
    goalContact:  num('ef_contactgoal')|| 55,
    permViewAll:   chk('ef_pViewAll'),
    permReports:   chk('ef_pReports'),
    permPayments:  chk('ef_pPayments'),
    permManage:    chk('ef_pManage'),
    permAddRemove: chk('ef_pAddRemove'),
  };
  if (tmIdx >= 0) {
    window.TEAM_MEMBERS[tmIdx] = memberData;
  } else {
    window.TEAM_MEMBERS.push(memberData);
  }
  if (oldName !== newName && AGENT_EXTENDED_DATA[oldName]) {
    AGENT_EXTENDED_DATA[newName] = AGENT_EXTENDED_DATA[oldName];
    delete AGENT_EXTENDED_DATA[oldName];
  }
  window.ADMIN_STATE.editingAgent = null;
  window.ADMIN_STATE.viewingAgent = idx;
  window.ADMIN_STATE.successMsg   = newName;
  refreshAdminPage();
}
