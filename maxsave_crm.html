function saveCarrier(idx) {
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const n = id => { const el = document.getElementById(id); return el ? (parseFloat(el.value)||0) : 0; };
  if (!window.CARRIER_DATA) window.CARRIER_DATA = [];
  const record = {
    name:         g('ced_name'),
    active:       g('ced_status') === 'Active',
    apptType:     g('ced_appt'),
    lines:        g('ced_lines'),
    payTerms:     g('ced_payterms'),
    since:        g('ced_since'),
    commNew:      n('ced_commNew'),
    commRenewal:  n('ced_commRenewal'),
    bonus:        n('ced_bonus'),
    compBy:       g('ced_compBy'),
    minPrem:      n('ced_minPrem'),
    chargeback:   n('ced_chargeback'),
    contactName:  g('ced_contactName'),
    contactPhone: g('ced_contactPhone'),
    contactEmail: g('ced_contactEmail'),
    portalUrl:    g('ced_portalUrl'),
    uwPhone:      g('ced_uwPhone'),
    uwEmail:      g('ced_uwEmail'),
    uwTat:        g('ced_uwTat'),
    bindAuth:     g('ced_bind'),
    notes:        g('ced_notes'),
  };
  if (!record.name) { alert('Please enter a carrier name.'); return; }
  if (idx === -1) {
    window.CARRIER_DATA.push(record);
  } else {
    window.CARRIER_DATA[idx] = Object.assign({}, window.CARRIER_DATA[idx], record);
  }
  window._editingCarrier = null;
  window.ADMIN_STATE.successMsg = (record.name || 'Carrier') + (idx === -1 ? ' added.' : ' saved.');
  refreshAdminPage();
}

function deleteCarrier(idx) {
  const c = (window.CARRIER_DATA || [])[idx];
  if (!c) return;
  if (!confirm('Remove ' + c.name + ' from Carrier Management? This cannot be undone.')) return;
  window.CARRIER_DATA.splice(idx, 1);
  window.ADMIN_STATE.successMsg = c.name + ' removed.';
  refreshAdminPage();
}

function closeVendorModal() {
  const el = document.getElementById('vendorModalOverlay');
  if (el) el.style.display = 'none';
}

function saveVendor() {
  const g   = id => document.getElementById(id);
  const v   = id => g(id) ? g(id).value.trim() : '';
  const num = id => parseFloat(g(id) && g(id).value) || 0;
  const name = v('vm_name');
  if (!name) { alert('Vendor name is required.'); return; }
  const vendor = {
    name,
    type:          v('vm_type'),
    ppl:           num('vm_ppl'),
    hours:         v('vm_hours'),
    closeGoal:     num('vm_closeGoal'),
    dailyCap:      num('vm_dailyCap'),
    weeklyBudget:  num('vm_weeklyBudget'),
    acctMgr:       v('vm_acctMgr'),
    acctEmail:     v('vm_acctEmail'),
    payTerms:      v('vm_payTerms'),
    active:        g('vm_active') ? g('vm_active').value === '1' : true,
    notes:         v('vm_notes'),
  };
  if (!window.LEAD_VENDORS) window.LEAD_VENDORS = [];
  const idx = window._editingVendorIdx;
  if (idx !== null && idx !== undefined) {
    window.LEAD_VENDORS[idx] = vendor;
  } else {
    window.LEAD_VENDORS.push(vendor);
  }
  closeVendorModal();
  refreshAdminPage();
}

function removeVendor(idx) {
  if (!confirm('Remove ' + (window.LEAD_VENDORS[idx] || {}).name + '? This cannot be undone.')) return;
  window.LEAD_VENDORS.splice(idx, 1);
  refreshAdminPage();
}

function addLCStep() {
  syncLCStepsFromDOM();

function toggleLifecycleRule(id) {
  const r = (window.LIFECYCLE_RULES || []).find(x => x.id === id);
  if (r) r.active = !r.active;
  refreshAdminPage();
}

function renderLifecyclePanel() {
  const rules = window.LIFECYCLE_RULES || [];
  const active = rules.filter(r => r.active).length;
  const totalSteps = rules.reduce((s,r)=>s+(r.steps||[]).length,0);
  const emailSteps = rules.reduce((s,r)=>s+(r.steps||[]).filter(x=>x.action==='Send Email').length,0);

  const tcMap = tl => {
    if (tl.includes('created'))   return { bg:'#EFF6FF',color:'#1D4ED8',border:'#BFDBFE' };
    if (tl.includes('Quoted'))    return { bg:'#FFFBEB',color:'#B45309',border:'#FDE68A' };
    if (tl.includes('expires'))   return { bg:'#FEF2F2',color:'#DC2626',border:'#FCA5A5' };
    if (tl.includes('unpaid'))    return { bg:'#FFF7ED',color:'#C2410C',border:'#FED7AA' };
    if (tl.includes('birthday'))  return { bg:'#F0FDF4',color:'#16A34A',border:'#86EFAC' };
    if (tl.includes('Bad Lead'))  return { bg:'#F3F4F6',color:'#374151',border:'#D1D5DB' };
    return { bg:'#F9FAFB',color:'#374151',border:'#E5E7EB' };
  };
  const aIcon = a => ({'Send Text':'💬','Send Email':'📧','Create Task':'✅'})[a]||'⚙️';

  const cards = rules.map(r => {
    const tc = tcMap(r.triggerLabel);
    const steps = r.steps || [];
    const stepPills = steps.slice(0,6).map(s=>`<span style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-full);padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--gray-700);white-space:nowrap">${aIcon(s.action)} Day ${s.day}</span>`).join('');
    const more = steps.length > 6 ? `<span style="font-size:11.5px;color:var(--gray-400)">+${steps.length-6} more</span>` : '';
    return `<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:10px;box-shadow:var(--shadow-sm);${r.active?'':'opacity:0.6'}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <label style="display:flex;align-items:center;cursor:pointer;flex-shrink:0">
          <input type="checkbox" ${r.active?'checked':''} onchange="toggleLifecycleRule(${r.id})" style="width:17px;height:17px;cursor:pointer;accent-color:#1A6ED0">
        </label>
        <div style="font-weight:700;font-size:15px;color:var(--navy-900);flex:1">${r.name}</div>
        <span style="background:${r.active?'#DCFCE7':'#F3F4F6'};color:${r.active?'#16A34A':'#6B7280'};border:1px solid ${r.active?'#86EFAC':'#D1D5DB'};padding:2px 10px;border-radius:var(--radius-full);font-size:11.5px;font-weight:700;white-space:nowrap">${r.active?'● Active':'○ Paused'}</span>
        <button onclick="openLifecycleEditor(${r.id})" style="background:#F9FAFB;border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--navy-900);cursor:pointer;font-family:var(--font-body);flex-shrink:0">✏ Edit</button>
      </div>
      <div style="margin-bottom:10px">
        <span style="background:${tc.bg};color:${tc.color};border:1px solid ${tc.border};padding:3px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600">⚡ ${r.triggerLabel}</span>
      </div>
      <div style="font-size:11.5px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px">${steps.length} Step${steps.length!==1?'s':''} — Sequence</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${stepPills}${more}</div>
    </div>`;
  }).join('');

  return `
  <div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px">
      <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;text-align:center;box-shadow:var(--shadow-sm)">
        <div style="font-size:30px;font-weight:800;color:var(--navy-900);font-family:var(--font-display)">${rules.length}</div>
        <div style="font-size:13px;font-weight:600;color:var(--gray-500);margin-top:3px">Sequences</div>
      </div>
      <div style="background:#F0FDF4;border:1px solid #86EFAC;border-radius:var(--radius-lg);padding:14px 18px;text-align:center">
        <div style="font-size:30px;font-weight:800;color:#16A34A;font-family:var(--font-display)">${active}</div>
        <div style="font-size:13px;font-weight:600;color:#16A34A;margin-top:3px">Active</div>
      </div>
      <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:var(--radius-lg);padding:14px 18px;text-align:center">
        <div style="font-size:30px;font-weight:800;color:#1D4ED8;font-family:var(--font-display)">${totalSteps}</div>
        <div style="font-size:13px;font-weight:600;color:#1D4ED8;margin-top:3px">Total Steps</div>
      </div>
      <div style="background:#F5F3FF;border:1px solid #DDD6FE;border-radius:var(--radius-lg);padding:14px 18px;text-align:center">
        <div style="font-size:30px;font-weight:800;color:#6D28D9;font-family:var(--font-display)">${emailSteps}</div>
        <div style="font-size:13px;font-weight:600;color:#6D28D9;margin-top:3px">Email Steps</div>
      </div>
    </div>
    <div class="card" style="overflow:visible">
      <div class="card-header">
        <div>
          <div class="card-title">Drip Sequences</div>
          <div style="font-size:13px;color:var(--gray-500);margin-top:3px">Each sequence fires on its trigger and runs step-by-step — texts &amp; emails on the days you choose</div>
        </div>
        <button class="btn btn-primary" onclick="openLifecycleEditor(null)" style="font-size:13.5px">⚡ New Sequence</button>
      </div>
      <div style="padding:16px 20px">

      </div>
    </div>
  </div>`;
}

function closeLifecycleEditor() {
  const el = document.getElementById('lifecycleModalOverlay');
  if (el) el.style.display = 'none';
}

function saveLifecycleRule() {
  syncLCStepsFromDOM();
  const g = id => document.getElementById(id);
  const name = g('lc_name') ? g('lc_name').value.trim() : '';
  if (!name) { alert('Sequence name is required.'); return; }
  if (!window.LIFECYCLE_RULES) window.LIFECYCLE_RULES = [];
  const newId = window._editingLifecycleId !== null && window._editingLifecycleId !== undefined
    ? window._editingLifecycleId
    : (window.LIFECYCLE_RULES.length ? Math.max(...window.LIFECYCLE_RULES.map(r=>r.id))+1 : 1);
  const rule = {
    id:           newId,
    name,
    triggerLabel: g('lc_trigger') ? g('lc_trigger').value : 'Lead is created',
    active:       !!(g('lc_active') && g('lc_active').checked),
    steps:        JSON.parse(JSON.stringify(window._lcSteps || [])),
  };
  const idx = window.LIFECYCLE_RULES.findIndex(r => r.id === newId);
  if (idx >= 0) { window.LIFECYCLE_RULES[idx] = rule; } else { window.LIFECYCLE_RULES.push(rule); }
  closeLifecycleEditor();
  refreshAdminPage();
}

function deleteLifecycleRule(id) {
  if (!confirm('Delete this sequence? This cannot be undone.')) return;
  window.LIFECYCLE_RULES = (window.LIFECYCLE_RULES || []).filter(r => r.id !== id);
  closeLifecycleEditor();
  refreshAdminPage();
}

function submitAddAgent() {
  const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const required = [
    ['af_first',    'First Name'],
    ['af_last',     'Last Name'],
    ['af_email',    'Email Address'],
    ['af_phone',    'Phone Number'],
    ['af_npn',      'NPN'],
    ['af_lic',      'License Number'],
    ['af_licstate', 'License State(s)'],
    ['af_licexp',   'License Expiration Date'],
    ['af_eo',       'E&O Insurance Carrier'],
    ['af_eoexp',    'E&O Expiration Date'],
    ['af_start',    'Start Date'],
    ['af_pgoal',    'Policy Goal'],
  ];
  for (const [id, label] of required) {
    if (!get(id)) {
      window.ADMIN_STATE.agentError = `⚠ "${label}" is required.`;
      refreshAdminPage();
      setTimeout(() => { const cb = document.querySelector('.card-body'); if (cb) cb.scrollTop = 0; }, 50);
      return;
    }
  }
  const email     = get('af_email');
  const firstName = get('af_first');
  const lastName  = get('af_last');
  const fullName  = firstName + ' ' + lastName;
  const feeGoal   = parseInt(get('af_fgoal').replace(/[^0-9]/g,'')) || 0;
  const tierRaw   = (get('af_tier') || 'Tier 4').split(' — ')[0] || 'Tier 4';

  const newAgent = {
    name:             fullName,
    apps:             0,
    goal:             parseInt(get('af_pgoal')) || 0,
    fee:              0,
    feeGoal:          feeGoal,
    premium:          0,
    tier:             tierRaw,
    close:            '0%',
    contact:          '0%',
    leads:            0,
    rank:             AGENTS.length + 1,
    _role:            get('af_role') || 'Agent',
    _agentType:       get('af_agentType') || 'Licensed Producer',
    _email:           email,
    _phone:           get('af_phone'),
    _npn:             get('af_npn'),
    _lic:             get('af_lic'),
    _licstate:        get('af_licstate'),
    _licexp:          get('af_licexp'),
    _eo:              get('af_eo'),
    _eoexp:           get('af_eoexp'),
    _startDate:       get('af_start'),
    _team:            get('af_team'),
    _dob:             get('af_dob'),
    _lang:            get('af_lang'),
    _leadcap:         get('af_leadcap'),
    _2fa:             false,
    _inboundDisabled: false,
    _archived:        false,
    _onboarded:       new Date().toISOString().slice(0,10),
  };
  AGENTS.push(newAgent);

  if (!window.TEAM_MEMBERS) window.TEAM_MEMBERS = [];
  window.TEAM_MEMBERS.push({
    name: fullName, first: firstName, last: lastName,
    email, phone: get('af_phone'), ext: '',
    role: get('af_role') || 'Agent',
    tier: tierRaw, team: get('af_team'),
    status: 'Active', startDate: get('af_start'),
    goalApps: parseInt(get('af_pgoal')) || 0,
    goalFee: feeGoal, goalPremium: 0, goalClose: 0, goalContact: 0,
    permViewAll: false, permReports: false, permPayments: false,
    permManage: false, permAddRemove: false,
  });

  if (!window.AGENT_GOALS) window.AGENT_GOALS = {};
  window.AGENT_GOALS[fullName] = { apps: parseInt(get('af_pgoal'))||0, fee: feeGoal, premium: 0, close: 0, contact: 0 };

  window.ADMIN_STATE.addingAgent = false;
  window.ADMIN_STATE.agentError  = '';
  refreshAdminPage();
  showOnboardingModal(fullName, email, get('af_role')||'Agent');
}

function getDashRange() {
  const s = window.DASH_ADMIN_STATE || { range:'period' };
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  if (s.range === 'today') {
    return { start: todayStr, end: todayStr, label: 'Today — ' + today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) };
  }
  if (s.range === 'month') {
    const start = todayStr.slice(0,7) + '-01';
    return { start, end: todayStr, label: today.toLocaleDateString('en-US',{month:'long',year:'numeric'}) };
  }
  if (s.range === 'custom' && s.customStart && s.customEnd) {
    return { start: s.customStart, end: s.customEnd, label: s.customStart + ' → ' + s.customEnd };
  }
  // Default: this pay period (14 days)
  const ps = new Date(today); ps.setDate(ps.getDate() - 13);
  return { start: ps.toISOString().slice(0,10), end: todayStr, label: 'This Pay Period' };
}

function getFilteredSales() {
  const { start, end } = getDashRange();
  return (window.SALES || []).filter(s => s.date >= start && s.date <= end);
}

function buildAgentDashboard() {
  const cu      = window.CURRENT_USER || {};

  const _myPPSales = (window.SALES||[]).filter(s=>s.agentName===cu.name&&s.date>=_agDrStart&&s.date<=_agDrEnd);

  const apps    = _myAllSales.reduce((t,s)=>t+(s.totalPolicies||1),0);

          </div>

          </div>

}

function buildAdminDashboard() {
  if ((window.CURRENT_USER||{}).role === 'Agent') return buildAgentDashboard();
  const s    = window.DASH_ADMIN_STATE || { range: 'period' };
  const range = getDashRange();
  const sales = getFilteredSales();
  const allAgents = (typeof AGENTS !== 'undefined' ? AGENTS : []).filter(a => !a._archived);

  // Aggregate metrics from filtered sales
  const totalPolicies    = sales.reduce((sum, s) => sum + (s.totalPolicies || 1), 0);
  const totalFeeCollected= sales.reduce((sum, s) => sum + (s.feeCollected || 0), 0);
  const totalFeeExtended = sales.reduce((sum, s) => sum + (s.feeExtended || 0), 0);
  const totalPremium     = sales.reduce((sum, s) => sum + (s.premium || 0) + (s.towingPremium || 0), 0);
  const agentsWriting    = new Set(sales.map(s => s.agentName)).size;

  // Per-agent breakdown
  const agentMap = {};
  sales.forEach(sale => {
    if (!agentMap[sale.agentName]) agentMap[sale.agentName] = { policies:0, feeCollected:0, feeExtended:0, premium:0, sales:0 };
    agentMap[sale.agentName].policies     += sale.totalPolicies || 1;
    agentMap[sale.agentName].feeCollected += sale.feeCollected || 0;
    agentMap[sale.agentName].feeExtended  += sale.feeExtended  || 0;
    agentMap[sale.agentName].premium      += (sale.premium||0) + (sale.towingPremium||0);
    agentMap[sale.agentName].sales        += 1;
  });

  const fmt$ = n => '$' + (n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});

  // KPI cards
  const kpi = (label, value, sub, bg, color, border) => `
  <div style="background:${bg||'#fff'};border:1.5px solid ${border||'#E5E7EB'};border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-sm)">
    <div style="font-size:12px;font-weight:700;color:${color||'#6B7280'};text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">${label}</div>
    <div style="font-family:var(--font-display);font-size:30px;font-weight:800;color:${color==='#fff'?'#fff':'#111827'};letter-spacing:-0.5px">${value}</div>
    <div style="font-size:12px;color:${color==='#fff'?'rgba(255,255,255,0.65)':'#6B7280'};margin-top:5px">${sub}</div>
  </div>`;

  // Filter tabs
  const tab = (key, label) => `<button onclick="window.DASH_ADMIN_STATE.range='${key}';refreshDashboard()" style="padding:8px 18px;border:1.5px solid ${s.range===key?'#1A6ED0':'#E5E7EB'};background:${s.range===key?'#1A6ED0':'#fff'};color:${s.range===key?'#fff':'#374151'};border-radius:var(--radius-md);font-size:13px;font-weight:${s.range===key?'700':'500'};cursor:pointer;font-family:var(--font-body);transition:all 0.15s">${label}</button>`;

  // Agent breakdown rows (sorted by policies desc)
  const sortedAgents = Object.entries(agentMap).sort((a,b)=>b[1].policies - a[1].policies);
  const agentRows = sortedAgents.length ? sortedAgents.map(([name, m], i) => {
    const pct = totalPolicies > 0 ? Math.round(m.policies / totalPolicies * 100) : 0;
    const avatarColors = ['#16A34A','#1D4ED8','#B45309','#7C3AED','#0E7490','#DC2626'];
    const av = avatarColors[i % avatarColors.length];
    const ini = name.split(' ').map(w=>w[0]).join('').slice(0,2);
    return `<tr>
      <td style="padding:12px 16px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:50%;background:${av};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${ini}</div>
          <div style="font-weight:600;font-size:13.5px;color:var(--navy-900)">${name}</div>
        </div>
      </td>
      <td style="padding:12px 16px;text-align:center;font-weight:700;font-size:15px;color:var(--navy-900)">${m.policies}</td>
      <td style="padding:12px 16px;text-align:center;font-weight:700;color:#16A34A">${fmt$(m.feeCollected)}</td>
      <td style="padding:12px 16px;text-align:center;color:#6B7280">${fmt$(m.feeExtended)}</td>
      <td style="padding:12px 16px;text-align:center;color:#374151">${fmt$(m.premium)}</td>
      <td style="padding:12px 16px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:7px;background:#F3F4F6;border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#1A6ED0;border-radius:99px"></div></div>
          <span style="font-size:12px;font-weight:600;color:#6B7280;min-width:32px">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" style="padding:40px;text-align:center;color:var(--gray-400)">No sales recorded for this period yet. Use the New Sale button on any lead to start tracking.</td></tr>`;

  // Recent sales list
  const recentSales = (window.SALES||[]).slice().reverse().slice(0,12);
  const recentRows = recentSales.length ? recentSales.map(sale => {
    const d = new Date(sale.timestamp || sale.date+'T00:00:00');
    const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const timeStr = sale.timestamp ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
    return `<div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border)">
      <div style="flex-shrink:0;text-align:center;min-width:44px">

      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:13px;font-weight:700;color:#16A34A">${fmt$(sale.feeCollected)}</div>
        <div style="font-size:11px;color:var(--gray-400)">${sale.totalPolicies>1?sale.totalPolicies+' policies':'1 policy'}</div>

  }).join('') : `<div style="padding:40px;text-align:center;color:var(--gray-400);font-size:13px">No sales recorded yet.</div>`;

  // Goal progress leaderboard — sorted by apps from actual SALES records
  const _allSalesForLb = window.SALES || [];
  const _agentAppsLb = {};
  _allSalesForLb.forEach(s => { _agentAppsLb[s.agentName] = (_agentAppsLb[s.agentName]||0) + (s.totalPolicies||1); });
  const sortedGoalAgents = allAgents.slice().sort((a,b)=>(_agentAppsLb[b.name]||0)-(_agentAppsLb[a.name]||0));
  const rankColors = ['#F59E0B','#94A3B8','#CD7F32'];
  const goalBars = sortedGoalAgents.map((a, i) => {
    const _ag  = (window.AGENT_GOALS || {})[a.name] || {};
    const goal = _ag.apps !== undefined ? _ag.apps : (a.goal || 1);
    const _lbApps = _agentAppsLb[a.name] || 0;
    const pct  = Math.min(100, Math.round(_lbApps / (goal||1) * 100));
    const ini  = a.name.split(' ').map(w=>w[0]).join('').slice(0,2);
    const rankBg  = i < 3 ? rankColors[i] : '#E5E7EB';
    const rankClr = i < 3 ? '#fff' : '#374151';
    return `<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)">
      <div style="width:28px;height:28px;border-radius:50%;background:${rankBg};color:${rankClr};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${i+1}</div>
      <div style="width:28px;height:28px;border-radius:50%;background:#1A6ED0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${ini}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;font-weight:700;color:var(--navy-900)">${a.name}</span>
          <span style="font-size:12px;font-weight:700;color:${pct>=100?'#16A34A':pct>=75?'#B45309':'var(--navy-700)'}">${_lbApps} / ${goal} apps &nbsp; <span style="color:${pct>=100?'#16A34A':pct>=75?'#F59E0B':'#1A6ED0'}">${pct}%</span></span>
        </div>
        <div style="height:7px;background:#F3F4F6;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${pct>=100?'#16A34A':pct>=75?'#F59E0B':'#1A6ED0'};border-radius:99px;transition:width 0.4s ease"></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Agency goal ring data
  const agencyGoal      = allAgents.reduce((s2, a) => { const _ag=(window.AGENT_GOALS||{})[a.name]||{}; return s2+(_ag.apps!==undefined?_ag.apps:(a.goal||0)); }, 0) || 1;
  const agencyGoalPct   = Math.min(150, Math.round(totalPolicies / agencyGoal * 100));
  const goalStatus      = agencyGoalPct >= 100 ? 'EXCEEDED' : agencyGoalPct >= 75 ? 'ON TRACK' : 'BEHIND';
  const goalStatusColor = agencyGoalPct >= 100 ? '#16A34A' : agencyGoalPct >= 75 ? '#D97706' : '#DC2626';
  const ringFill        = Math.min(1, agencyGoalPct / 100) * 2 * Math.PI * 60;
  const ringTotal       = 2 * Math.PI * 60;

  // 9-month app trend from window.SALES
  const _mnms = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const _nowD = new Date();
  const trendMonths = [];
  for (let _ti = 8; _ti >= 0; _ti--) {
    const _td = new Date(_nowD.getFullYear(), _nowD.getMonth() - _ti, 1);
    trendMonths.push({ label: _mnms[_td.getMonth()], year: _td.getFullYear(), month: _td.getMonth(), count: 0 });
  }
  (window.SALES||[]).forEach(_ts => {
    const _td = new Date(_ts.timestamp || _ts.date + 'T00:00:00');
    const _tm = trendMonths.find(t => t.year === _td.getFullYear() && t.month === _td.getMonth());
    if (_tm) _tm.count += _ts.totalPolicies || 1;
  });
  const maxTrend    = Math.max(...trendMonths.map(m => m.count), 1);
  const trendAvg    = Math.round(trendMonths.reduce((sum2, m) => sum2 + m.count, 0) / 9);
  const trendBest   = trendMonths.reduce((b, m) => m.count > b.count ? m : b, trendMonths[0]);
  const trendGrowth = trendMonths[0].count > 0
    ? Math.round((trendMonths[8].count - trendMonths[0].count) / trendMonths[0].count * 100)
    : (trendMonths[8].count > 0 ? 100 : 0);

  // Custom date range row
  const customRow = s.range === 'custom' ? `
  <div style="display:flex;align-items:center;gap:10px;margin-top:10px">

    <input type="date" value="${s.customStart||''}" class="form-control" style="width:160px;font-size:13px" onchange="window.DASH_ADMIN_STATE.customStart=this.value;refreshDashboard()">
    <div style="font-size:13px;font-weight:600;color:var(--gray-600)">To:</div>
    <input type="date" value="${s.customEnd||''}" class="form-control" style="width:160px;font-size:13px" onchange="window.DASH_ADMIN_STATE.customEnd=this.value;refreshDashboard()">
  </div>` : '';

  return `
  <!-- HEADER -->
  <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,#0A1624 0%,#122B47 100%);padding:22px 28px;border-radius:var(--radius-xl);margin-bottom:20px;color:#fff;box-shadow:0 6px 22px rgba(10,22,36,0.28)">

    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-shrink:0">

      </div>
      <div style="display:flex;flex-direction:column;gap:9px">
        <button onclick="handleClockIn()" id="clockInBtn" style="background:#1A6ED0;border:none;color:#fff;border-radius:var(--radius-md);padding:12px 24px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v3.5l2.5 1.5" stroke-linecap="round"/></svg>Clock In</button>
        <button onclick="handleClockOut()" id="clockOutBtn" style="background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.60);border-radius:var(--radius-md);padding:12px 24px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M10.5 5.5l-5 5M5.5 5.5l5 5" stroke-linecap="round"/></svg>Clock Out</button>
      </div>
    </div>

    ${kpi('Fees Collected', fmt$(totalFeeCollected), 'Broker fees paid in full','#F0FDF4','#16A34A','#86EFAC')}

  <!-- MAIN CONTENT: TWO COLUMNS -->
  <div style="display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:16px">

    <!-- AGENT BREAKDOWN TABLE -->

      </div>

            <th style="padding:10px 16px">Agent</th>

            <td style="padding:12px 16px;font-weight:700">100%</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>

    <!-- RECENT SALES -->
    <div class="card" style="overflow:hidden">
      <div class="card-header" style="padding:14px 16px">

      <div style="overflow-y:auto;max-height:420px">${recentRows}</div>

  </div>

  <!-- GOAL PROGRESS -->

    <div class="card-header">
      <div class="card-title">Agent Goal Progress — Policies</div>
      <div style="font-size:12px;color:var(--gray-500)">All-time from agent profiles</div>
    </div>
    <div class="card-body" style="padding:8px 20px">
      ${goalBars || '<div style="text-align:center;padding:24px;color:var(--gray-400)">No agents yet.</div>'}
    </div>
  </div>

  <!-- AGENCY GOAL RING + TIER TRACKER -->
  <div style="display:grid;grid-template-columns:360px 1fr;gap:14px;margin-bottom:20px">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Agency Goal</div>
        <span style="font-size:11px;font-weight:700;color:#fff;background:${goalStatusColor};padding:3px 11px;border-radius:var(--radius-full)">${goalStatus}</span>
      </div>
      <div class="card-body" style="display:flex;align-items:center;gap:22px;padding:22px">
        <div style="flex-shrink:0">
          <svg width="148" height="148" viewBox="0 0 148 148">
            <circle cx="74" cy="74" r="60" fill="none" stroke="var(--gray-100)" stroke-width="13"/>
            <circle cx="74" cy="74" r="60" fill="none" stroke="#163D6B" stroke-width="13"
              stroke-dasharray="${ringFill} ${ringTotal}"
              stroke-linecap="round" transform="rotate(-90 74 74)"/>
            <text x="74" y="70" text-anchor="middle" font-family="Sora" font-weight="800" font-size="30" fill="#0C1D33">${agencyGoalPct}%</text>
            <text x="74" y="90" text-anchor="middle" font-family="Outfit" font-weight="500" font-size="11" fill="#94A3B8">to goal</text>
          </svg>
        </div>
        <div style="flex:1">
          <div style="font-size:12px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">${totalPolicies} of ${agencyGoal} policies</div>
          <div style="font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--navy-900);margin-bottom:16px">${agencyGoalPct>=100?'Exceeded by '+(totalPolicies-agencyGoal):(agencyGoal-totalPolicies)+' left to go'}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div style="background:var(--gray-50);padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border)">
              <div style="font-size:10px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Agents</div>
              <div style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--navy-900)">${allAgents.length}</div>
            </div>
            <div style="background:var(--gray-50);padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border)">
              <div style="font-size:10px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Writing</div>
              <div style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--navy-900)">${agentsWriting}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Tier Thresholds</div>
        <span style="font-size:13px;color:var(--gray-400)">Agency reference</span>
      </div>
      <div class="card-body" style="padding:20px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
          ${(window.TIER_DATA||[]).map((tier,ti)=>`
          <div style="border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 14px;background:#fff">
            <div style="width:8px;height:8px;border-radius:50%;background:${['#16A34A','#1A6ED0','#D97706','#6B7280'][ti]||'#6B7280'};margin-bottom:9px"></div>
            <div style="font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--navy-900);margin-bottom:3px">${tier.name}</div>
            <div style="font-size:12.5px;color:var(--gray-500);margin-bottom:2px">${tier.minApps}+ apps</div>
            <div style="font-size:12px;color:var(--gray-400);margin-bottom:8px">${fmt$(tier.minFee||0)} fee · ${fmt$(tier.minPremium||0)} prem</div>
            <div style="font-size:14px;font-weight:800;color:#163D6B">${tier.commission}%</div>
            <div style="font-size:11px;color:var(--gray-400)">commission</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- 9-MONTH TREND (full width) -->
  <div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">9-Month Policy Trend</div>
        <span style="font-size:13px;color:var(--gray-400)">${trendMonths[0].label} ${trendMonths[0].year} – ${trendMonths[8].label} ${trendMonths[8].year}</span>
      </div>
      <div class="card-body" style="padding:18px 22px">
        <div class="rpt-bar-wrap" style="height:150px">
          ${trendMonths.map((m,idx)=>`
          <div class="bar-col" title="${m.label}: ${m.count} policies">
            <div class="bar-val" style="font-size:12px">${m.count}</div>
            <div class="bar-fill" style="height:${Math.max(4,Math.round(m.count/maxTrend*130))}px;background:${idx===8?'#163D6B':'var(--navy-100)'};border:1px solid ${idx===8?'#0E2340':'var(--navy-200)'};border-radius:5px 5px 0 0"></div>
            <div class="bar-lbl">${m.label}</div>
          </div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px">
          <div style="background:var(--gray-50);border-radius:var(--radius-md);padding:13px;text-align:center;border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">Best Month</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--navy-900)">${trendBest.count}</div>
            <div style="font-size:12px;color:var(--gray-500);margin-top:2px">${trendBest.label} ${trendBest.year}</div>
          </div>
          <div style="background:var(--gray-50);border-radius:var(--radius-md);padding:13px;text-align:center;border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">9-Mo Avg</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--navy-900)">${trendAvg}</div>
            <div style="font-size:12px;color:var(--gray-500);margin-top:2px">policies / month</div>
          </div>
          <div style="background:rgba(22,61,107,0.06);border-radius:var(--radius-md);padding:13px;text-align:center;border:1px solid rgba(22,61,107,0.16)">
            <div style="font-size:10px;color:#163D6B;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">Growth</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:800;color:#163D6B">${trendGrowth>=0?'+':''}${trendGrowth}%</div>
            <div style="font-size:12px;color:#163D6B;margin-top:2px">${trendMonths[0].label} → ${trendMonths[8].label}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

window.PAGE_INIT.admin = function() { refreshAdminPage(); };

// ==================== TAB SWITCHER ====================
function switchTab(el, targetId) {
  el.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('[id]').forEach(el => {
    if (el.id && el.id !== targetId && (el.id.startsWith('dash-') || el.id.startsWith('rpt-') || el.id.startsWith('fin-'))) {
      el.style.display = 'none';
    }
  });
  const target = document.getElementById(targetId);
  if (target) target.style.display = '';
}

// ==================== DARK MODE ====================
function toggleDark() {
  const isDark = document.body.classList.toggle('dark-mode');
  document.getElementById('darkToggle').classList.toggle('on', isDark);
  document.getElementById('darkKnob').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('maxsave-dark', isDark ? '1' : '0');
}

window.addEventListener('DOMContentLoaded', () => {
  nav('dashboard', document.querySelector('.nav-item'));
  if (localStorage.getItem('maxsave-dark') === '1') {
    document.body.classList.add('dark-mode');
    document.getElementById('darkToggle').classList.add('on');
    document.getElementById('darkKnob').textContent = '🌙';
  }
});
</script>
</body>
</html>
